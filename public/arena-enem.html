2. Calcular a velocidade em km/h: V = 108 km / 1,5 h = 72 km/h.
3. Comparar com o limite: Como 72 km/h < 80 km/h, a velocidade média ficou abaixo do limite da via.
4. Converter para m/s dividindo por 3,6: 72 / 3,6 = 20 m/s.
Resposta final: 20 m/s, e a velocidade média esteve dentro do limite regulamentar.`}},{id:"f-cin-2",name:"Aceleração Média",expression:"a = Δv / Δt",description:"Mede o quão rápido a velocidade de um corpo varia no tempo.",mnemonic:"A aceleração acelera a Vovó no Tempo!",variables:["a: Aceleração média (m/s²)","Δv: Variação de velocidade (m/s)","Δt: Intervalo de tempo (s)"],enemContext:"Frequente em questões sobre testes de segurança veicular (Airbag, freios ABS) ou de arrancada de veículos elétricos. Lembre-se: se a aceleração tem sentido contrário à velocidade, o movimento é retardado (desaceleração).",triAnalysis:"Fácil",triDetails:"Por ser um conceito introdutório, aparece associado a gráficos de velocidade por tempo (V x t), onde a inclinação da reta representa numericamente a aceleração do corpo.",resolvedExample:{statement:"Um moderno veículo elétrico consegue acelerar de 0 a 108 km/h em exatamente 3,0 segundos. Qual a aceleração média desenvolvida por esse automóvel nesse intervalo, em m/s²?",solution:`1. Converter a velocidade final de km/h para m/s: v = 108 / 3,6 = 30 m/s.
2. Calcular a variação de velocidade (Δv): v - v₀ = 30 - 0 = 30 m/s.
3. Aplicar a fórmula: a = Δv / Δt = 30 m/s / 3,0 s = 10 m/s².
Resposta final: A aceleração média do veículo é de 10 m/s² (equivalente a 1G, a aceleração da gravidade).`}},{id:"f-cin-3",name:"Movimento Retilíneo Uniforme (MRU)",expression:"S = S₀ + v · t",description:"Função horária da posição para corpos com velocidade constante (sem aceleração).",mnemonic:"Sorvete! No calor, nada melhor que um Sorvete!",variables:["S: Posição final (m)","S₀: Posição inicial (m)","v: Velocidade constante (m/s)","t: Tempo decorrido (s)"],enemContext:"Cobrado principalmente em problemas de encontro de móveis (como trens em rota de colisão ou ultrapassagens) e propagação de ondas eletromagnéticas (luz) ou sonoras com velocidade constante no vácuo/ar.",triAnalysis:"Fácil",triDetails:"Questões puras de MRU possuem alta taxa de acerto no ENEM. O gráfico S x t é sempre uma linha reta cuja tangente do ângulo de inclinação fornece a velocidade.",resolvedExample:{statement:"Dois automóveis, A e B, movem-se em uma estrada retilínea com velocidades constantes de Va = 20 m/s e Vb = 15 m/s, respectivamente, no mesmo sentido. Sabendo que o carro B está 100 metros à frente do carro A no instante t = 0, quanto tempo o carro A levará para alcançar o carro B?",solution:`1. Escrever as equações horárias para ambos (considerando o ponto de partida do carro A como origem S₀ = 0):
- Carro A: Sa = 0 + 20 · t = 20t
- Carro B: Sb = 100 + 15 · t = 100 + 15t
2. No instante do encontro, as posições são iguais: Sa = Sb.
3. Substituindo: 20t = 100 + 15t => 5t = 100 => t = 20 s.
Resposta final: O carro A alcançará o carro B após 20 segundos.`}},{id:"f-cin-4",name:"Função da Posição no MRUV",expression:"S = S₀ + v₀ · t + a · t² / 2",description:"Calcula a posição de um corpo em movimento acelerado em um instante t.",mnemonic:"Sozinho, o Vovô e a Vovó na Metade do Tempo ao quadrado!",variables:["S: Posição final (m)","S₀: Posição inicial (m)","v₀: Velocidade inicial (m/s)","t: Tempo (s)","a: Aceleração constante (m/s²)"],enemContext:"Essencial para analisar queda livre e lançamentos verticais/horizontais. Nessas situações de gravidade, a aceleração 'a' é substituída por 'g' (geralmente 10 m/s² no ENEM) e a posição inicial/final é associada à altura (h).",triAnalysis:"Média",triDetails:"A complexidade matemática da equação quadrática eleva o nível dessa questão. Na TRI, acertá-la demonstra ótimo domínio algébrico do candidato.",resolvedExample:{statement:"Um vaso de plantas cai acidentalmente do parapeito de uma janela que está a uma altura de 45 metros do solo. Desprezando a resistência do ar e adotando g = 10 m/s², determine o tempo que o vaso leva para atingir a calçada.",solution:`1. Definir os dados: S₀ = 45 m (topo), S = 0 m (solo), v₀ = 0 m/s (queda livre, partiu do repouso), a = -g = -10 m/s².
2. Montar a equação da queda: S = S₀ + v₀t + (a·t²)/2 => 0 = 45 + 0t - (10·t²)/2.
3. Simplificar: 0 = 45 - 5t² => 5t² = 45 => t² = 9 => t = 3 segundos.
Resposta final: O vaso leva 3 segundos para colidir com o solo.`}},{id:"f-cin-5",name:"Função da Velocidade no MRUV",expression:"v = v₀ + a · t",description:"Calcula a velocidade de um corpo acelerado em um instante t.",mnemonic:"Vovó e Vovô Ainda Trabalham!",variables:["v: Velocidade final (m/s)","v₀: Velocidade inicial (m/s)","a: Aceleração (m/s²)","t: Tempo (s)"],enemContext:"Muito aplicada em análise de frenagem de emergência ou de lançamento vertical para cima (onde no ponto mais alto a velocidade se anula temporariamente: V = 0).",triAnalysis:"Fácil",triDetails:"Representa o comportamento linear da velocidade sob aceleração constante. É comumente cobrado para identificar o perfil gráfico do movimento.",resolvedExample:{statement:"Um goleiro chuta uma bola verticalmente para cima com velocidade inicial de 25 m/s. Adotando g = 10 m/s² e desprezando o atrito do ar, calcule após quanto tempo a bola atinge o ponto de altura máxima.",solution:`1. No ponto mais alto da trajetória, a velocidade final da bola é zero: v = 0 m/s.
2. Como o lançamento é para cima e a gravidade aponta para baixo, a aceleração é negativa: a = -g = -10 m/s².
3. Aplicar a fórmula: v = v₀ + a·t => 0 = 25 - 10t.
4. Resolver para t: 10t = 25 => t = 2,5 segundos.
Resposta final: A bola leva 2,5 segundos para atingir o topo de sua subida.`}},{id:"f-cin-6",name:"Equação de Torricelli",expression:"v² = v₀² + 2 · a · ΔS",description:"Relaciona velocidade e deslocamento no MRUV sem precisar do tempo.",mnemonic:"Vovô e Vovó com Duas Amigas num Triângulo de Sapato!",variables:["v: Velocidade final (m/s)","v₀: Velocidade inicial (m/s)","a: Aceleração (m/s²)","ΔS: Deslocamento (m)"],enemContext:"A queridinha do ENEM quando o enunciado NÃO menciona o tempo de duração do fenômeno! É muito cobrada em acidentes de trânsito para descobrir a velocidade que o carro estava antes de iniciar as marcas de frenagem na pista.",triAnalysis:"Média",triDetails:"Costuma gerar questões de nível médio. Sua identificação poupa tempo valioso de prova por evitar a necessidade de achar o tempo intermediário.",resolvedExample:{statement:"Um motorista trafega por uma avenida com velocidade constante de 72 km/h quando avista um buraco e pisa imediatamente no freio, aplicando uma desaceleração constante de 5,0 m/s². Qual a distância mínima de frenagem que o veículo percorre até parar completamente?",solution:`1. Converter a velocidade de km/h para m/s: v₀ = 72 / 3,6 = 20 m/s.
2. Como o carro para ao final, a velocidade final é zero: v = 0 m/s.
3. A aceleração de frenagem é contrária ao movimento, logo: a = -5,0 m/s².
4. Aplicar Torricelli: v² = v₀² + 2aΔS => 0² = (20)² + 2(-5)ΔS.
5. Resolver: 0 = 400 - 10ΔS => 10ΔS = 400 => ΔS = 40 metros.
Resposta final: O veículo percorrerá 40 metros até imobilizar-se.`}},{id:"f-cin-7",name:"Velocidade Linear (MCU)",expression:"v = w · r",description:"Associa a velocidade escalar tangencial com a velocidade angular de rotação.",mnemonic:"Vê se não me Erra, Você é o Wescley do Rádio!",variables:["v: Velocidade linear (m/s)","w: Velocidade angular (rad/s)","r: Raio da trajetória circular (m)"],enemContext:"Altíssima frequência sob o tema 'acoplamento de polias e engrenagens' (como marchas de bicicleta ou correias industriais). Lembre-se: em polias unidas por correia ou dentes em contato, a velocidade linear 'v' das bordas é idêntica para ambas, mudando apenas a velocidade angular.",triAnalysis:"Média",triDetails:"Praticamente presente em todas as edições do ENEM. Questões com marchas de bicicleta exigem raciocínio crítico sobre as relações de proporcionalidade e são classificadas como médias/difíceis na TRI.",resolvedExample:{statement:"Uma bicicleta possui uma coroa de raio Rc = 12 cm acoplada por uma corrente a um pinhão de raio Rp = 4,0 cm na roda traseira. Se o ciclista pedala imprimindo uma velocidade angular de 2,0 rad/s à coroa, qual será a velocidade angular transmitida ao pinhão?",solution:`1. Como as duas polias estão acopladas por uma corrente, as velocidades lineares nas suas superfícies periféricas são iguais: Vcoroa = Vpinhão.
2. Aplicando a fórmula V = w·r, temos: w_coroa · R_coroa = w_pinhão · R_pinhão.
3. Substituindo os valores conhecidos: 2,0 · 12 = w_pinhão · 4,0.
4. Simplificando: 24 = 4 · w_pinhão => w_pinhão = 6,0 rad/s.
Resposta final: A velocidade angular do pinhão é de 6,0 rad/s (gira mais rápido por ter raio menor).`}},{id:"f-cin-8",name:"Velocidade Angular",expression:"w = 2 · π · f = 2 · π / T",description:"Calcula a rapidez de rotação de um objeto em radianos por segundo.",mnemonic:"Duas Pizzas no Forno ou Duas Pizzas no Prato!",variables:["w: Velocidade angular (rad/s)","f: Frequência de rotação (Hz)","T: Período da rotação (s)"],enemContext:"Aplicado no estudo de geradores de energia (turbinas de hidrelétricas ou aerogeradores eólicos), rotação da Terra e ponteiros de relógios analógicos.",triAnalysis:"Média",triDetails:"O domínio da relação entre frequência (Hz ou rpm) e período (segundos) é vital. Lembrar que f = 1/T é um pré-requisito cobrado em muitas questões de cinemática e ondulatória.",resolvedExample:{statement:"O rotor de uma turbina eólica gira uniformemente completando exatamente 120 rotações por minuto (rpm). Adotando π = 3, determine a velocidade angular desse rotor em radianos por segundo.",solution:`1. Converter a frequência de rpm para Hertz (rotações por segundo): f = 120 / 60 = 2,0 Hz.
2. Aplicar a fórmula da velocidade angular: w = 2 · π · f.
3. Substituir os valores: w = 2 · 3 · 2,0 = 12 rad/s.
Resposta final: A velocidade angular do rotor é de 12 rad/s.`}},{id:"f-cin-9",name:"Aceleração Centrípeta",expression:"a_cp = v² / r",description:"Aceleração direcionada ao centro da curva que altera a direção da velocidade.",mnemonic:"Amor com Duas Vovós no Rádio!",variables:["a_cp: Aceleração centrípeta (m/s²)","v: Velocidade linear (m/s)","r: Raio da curva (m)"],enemContext:"Presente em problemas de curvas de estradas, looping de montanhas-russas, órbitas de satélites artificiais ou globos da morte. Crucial: ela NÃO altera o valor numérico da velocidade, apenas altera a direção e o sentido do vetor velocidade.",triAnalysis:"Média",triDetails:"Classifica-se na faixa média-fácil. Costuma ser o passo intermediário para calcular a força centrípeta exercida por trilhos ou pela gravidade planetária.",resolvedExample:{statement:"Um piloto de testes realiza uma curva circular plana de raio r = 80 metros pilotando um carro esportivo a uma velocidade tangencial constante de 72 km/h. Qual a intensidade da aceleração centrípeta à qual o piloto está submetido?",solution:`1. Converter a velocidade linear de km/h para m/s: v = 72 / 3,6 = 20 m/s.
2. Aplicar a fórmula da aceleração centrípeta: a_cp = v² / r.
3. Substituir os valores: a_cp = (20)² / 80 = 400 / 80 = 5,0 m/s².
Resposta final: A aceleração centrípeta é de 5,0 m/s² (cerca de metade da aceleração da gravidade terrestre).`}},{id:"f-cin-10",name:"Queda Livre: Tempo e Velocidade",expression:"t = √(2h/g)  |  v = √(2g·h)",description:"Fórmulas diretas e simplificadas para queda livre a partir do repouso sem resistência do ar.",mnemonic:"Tento Ver Duas Garotas de Altura!",variables:["t: Tempo total de queda (s)","h: Altura de queda / deslocamento vertical (m)","g: Aceleração da gravidade local (m/s²)","v: Velocidade final imediatamente antes do impacto (m/s)"],enemContext:"O ENEM cobra intensamente problemas de queda de corpos (como frutos, pedras ou saltos ornamentais) sob ação da gravidade. Nesses problemas, geralmente adota-se g = 10 m/s². Lembre-se: em queda livre, a massa do corpo não interfere no tempo de queda ou na velocidade final de impacto!",triAnalysis:"Fácil",triDetails:"Questões que utilizam as simplificações de queda livre possuem alto índice de acerto na prova. Erros comuns incluem esquecer de extrair a raiz quadrada final ou confundir com a fórmula de Torricelli comum.",resolvedExample:{statement:"Um coco maduro se desprende de um coqueiro situado a uma altura de 5,0 metros em relação ao solo plano. Adotando a aceleração da gravidade g = 10 m/s² e desprezando totalmente a resistência aerodinâmica do ar, determine o tempo total de queda do fruto e sua velocidade de impacto em km/h.",solution:`1. Calcular o tempo de queda usando t = √(2h/g):
t = √(2 · 5,0 / 10) = √(10 / 10) = √1 = 1,0 segundo.
2. Calcular a velocidade final de impacto com v = √(2g·h):
v = √(2 · 10 · 5,0) = √100 = 10 m/s.
3. Converter a velocidade final de m/s para km/h multiplicando por 3,6:
v_kmh = 10 · 3,6 = 36 km/h.
Resposta final: O coco demora 1,0 segundo para cair e atinge o chão a uma velocidade de 36 km/h.`}},{id:"f-cin-11",name:"Transmissão Circular Periférica (Polias)",expression:"f_A · R_A = f_B · R_B",description:"Relação matemática de frequências e raios na transmissão de movimento por contato periférico direto ou correias dentadas.",mnemonic:"Frequenta a Roda A, Frequenta a Roda B!",variables:["f_A: Frequência de rotação da polia A (Hz ou rpm)","R_A: Raio da polia ou engrenagem A (m ou cm)","f_B: Frequência de rotação da polia B (Hz ou rpm)","R_B: Raio da polia ou engrenagem B (m ou cm)"],enemContext:"O ENEM ama o funcionamento de marchas de bicicletas (coroa acoplada ao pinhão via corrente) ou engrenagens de motores. Guarde no coração: as velocidades lineares na borda (periferia) são IGUAIS (v_A = v_B). Consequentemente, a engrenagem menor (menor raio) sempre gira mais rápido (maior frequência).",triAnalysis:"Média",triDetails:"Compreender a proporcionalidade inversa entre o raio e a frequência é a chave na TRI. Erros conceituais aqui demonstram falta de maturidade em cinemática mecânica.",resolvedExample:{statement:"Um motor de fábrica aciona uma polia motora A de raio R_A = 10 cm a uma frequência de 600 rpm (rotações por minuto). Essa polia está conectada por uma correia ideal a uma polia movida B de raio R_B = 30 cm. Qual será a frequência de rotação desenvolvida pela polia B em Hertz (Hz)?",solution:`1. Aplicar a fórmula de transmissão periférica: f_A · R_A = f_B · R_B.
2. Substituir os valores fornecidos: 600 · 10 = f_B · 30 => 6000 = 30 · f_B.
3. Isolar f_B: f_B = 6000 / 30 = 200 rpm.
4. Converter a frequência resultante de rpm para Hertz (Hz) dividindo por 60:
f_B = 200 / 60 = 20 / 6 ≈ 3,33 Hz.
Resposta final: A frequência de rotação da polia B é de aproximadamente 3,33 Hz.`}},{id:"f-cin-12",name:"Transmissão Circular Coaxial (Eixo Comum)",expression:"w_A = w_B  |  f_A = f_B",description:"Igualdade das velocidades angulares e frequências quando polias de raios diferentes giram presas ao mesmo eixo rígido.",mnemonic:"Eixo Único: Giram Juntos, Frequência Igual!",variables:["w_A: Velocidade angular da polia A (rad/s)","w_B: Velocidade angular da polia B (rad/s)","f_A: Frequência de rotação da polia A (Hz)","f_B: Frequência de rotação da polia B (Hz)"],enemContext:"Essencial para entender a roda traseira de uma bicicleta, que gira rigidamente acoplada ao pinhão (catraca) onde a corrente passa. Ambas completam exatamente o mesmo número de rotações por segundo (f_roda = f_pinhão), contudo, a roda tem raio muito maior e, por isso, sua borda desenvolve velocidade linear muito maior (V_roda = w · R_roda), impulsionando a bicicleta.",triAnalysis:"Média",triDetails:"Diferenciar a transmissão coaxial (onde w é igual) da transmissão periférica por correia (onde v é igual) é o clássico divisor de águas de Física no ENEM. Questões integrando esses dois acoplamentos se classificam como médias a difíceis.",resolvedExample:{statement:"A catraca traseira (pinhão) de uma bicicleta possui raio R_p = 4,0 cm e está soldada de forma coaxial ao centro da roda traseira, que tem raio R_r = 40 cm. Sabendo que o ciclista pedala fazendo a catraca girar com velocidade angular constante de 6,0 rad/s, calcule a velocidade de deslocamento linear da bicicleta em metros por segundo (m/s).",solution:`1. Como a catraca e a roda traseira giram solidárias no mesmo eixo (coaxial), a velocidade angular da roda é idêntica à da catraca: w_roda = 6,0 rad/s.
2. A velocidade linear da bicicleta (V) é equivalente à velocidade tangencial na periferia da roda:
V = w_roda · R_roda.
3. Converter o raio da roda para metros: R_roda = 40 cm = 0,40 m.
4. Aplicar a fórmula: V = 6,0 · 0,40 = 2,4 m/s.
Resposta final: A bicicleta se desloca a uma velocidade linear de 2,4 m/s.`}},{id:"f-cin-13",name:"Decomposição no Lançamento Oblíquo",expression:"v₀x = v₀ · cos(θ)  |  v₀y = v₀ · sin(θ)",description:"Projeções ortogonais cartesianas da velocidade inicial do projétil nos eixos horizontal (onde ocorre MRU) e vertical (onde ocorre MRUV).",mnemonic:"Com sono deita (eixo x usa cosseno), Sem sono fica em pé (eixo y usa seno)!",variables:["v₀x: Velocidade inicial projetada no eixo horizontal x (m/s)","v₀y: Velocidade inicial projetada no eixo vertical y (m/s)","v₀: Vetor velocidade inicial absoluta do lançamento (m/s)","θ: Ângulo de inclinação do lançamento em relação à horizontal (graus)"],enemContext:"Sempre que um projétil é lançado obliquamente (chutes, saques de vôlei, lançamentos de satélites, arremessos de basquete), o movimento real bidimensional deve ser tratado como a soma de dois movimentos independentes (Princípio de Galileu): um MRU horizontal e um MRUV vertical sujeito à gravidade.",triAnalysis:"Difícil",triDetails:"A decomposição vetorial exige conhecimentos sólidos de trigonometria básica aplicada à cinemática. Questões sob este tema costumam apresentar menor taxa de acerto global.",resolvedExample:{statement:"Um atacante de futebol chuta uma bola de uma falta imprimindo uma velocidade inicial modular v₀ = 20 m/s sob um ângulo de 30° com a horizontal. Sabendo que sen(30°) = 0,50 e cos(30°) = 0,86, calcule os módulos das velocidades iniciais nos eixos horizontal e vertical.",solution:`1. Calcular a componente horizontal (eixo x, velocidade constante em MRU):
v₀x = v₀ · cos(30°) = 20 · 0,86 = 17,2 m/s.
2. Calcular a componente vertical (eixo y, velocidade acelerada pela gravidade em MRUV):
v₀y = v₀ · sen(30°) = 20 · 0,50 = 10,0 m/s.
Resposta final: A velocidade horizontal inicial é de 17,2 m/s e a velocidade vertical inicial é de 10,0 m/s.`}},{id:"f-cin-14",name:"Lançamento Oblíquo: Altura e Alcance",expression:"H_max = v₀y² / 2g  |  A = (v₀² · sen(2θ)) / g",description:"Fórmulas para determinar a altura máxima vertical atingida pelo projétil e o seu alcance horizontal total sobre um plano plano e nivelado.",mnemonic:"Altura máxima é a velocidade do y ao quadrado sobre duas gravidades!",variables:["H_max: Altura máxima vertical alcançada no topo da parábola (m)","A: Alcance horizontal total percorrido antes do toque de retorno (m)","v₀y: Componente vertical inicial da velocidade (m/s)","v₀: Velocidade absoluta de lançamento (m/s)","θ: Ângulo de lançamento (graus)","g: Aceleração da gravidade local (m/s²)"],enemContext:"Indispensável na análise de trajetórias de balística e esportes. Um macete crucial do ENEM: o alcance horizontal máximo para uma mesma velocidade inicial v₀ é obtido com o ângulo exato de 45°! Ângulos complementares (que somam 90°, como 30° e 60°) produzem exatamente o mesmo alcance horizontal se disparados com a mesma velocidade inicial.",triAnalysis:"Difícil",triDetails:"O ENEM raramente cobra apenas a aplicação fria da fórmula do alcance. Normalmente, o estudante deve analisar a equação integrando o tempo total de voo (t_voo = 2 · v₀y / g). Conectar esses conceitos garante nota máxima em Cinemática.",resolvedExample:{statement:"Um projétil é disparado a partir do solo plano horizontal com componente de velocidade vertical inicial v₀y = 30 m/s e componente de velocidade horizontal v₀x = 40 m/s. Adotando a aceleração da gravidade g = 10 m/s² e desprezando efeitos do ar, determine a altura máxima vertical atingida e o alcance horizontal total alcançado pelo projétil.",solution:`1. Calcular a altura máxima vertical atingida no topo da parábola (onde v_y = 0):
H_max = v₀y² / (2g) = (30)² / (2 · 10) = 900 / 20 = 45 metros.
2. Calcular o tempo de subida (tempo para v_y ir de 30 m/s para 0 m/s):
t_subida = v₀y / g = 30 / 10 = 3,0 segundos.
3. Como a trajetória é simétrica (mesmo nível de partida e chegada), o tempo total de voo é o dobro do tempo de subida:
t_total = 2 · t_subida = 2 · 3,0 = 6,0 segundos.
4. O alcance horizontal (A) é a distância percorrida no eixo horizontal em MRU durante o tempo total de voo:
A = v₀x · t_total = 40 · 6,0 = 240 metros.
Resposta final: O projétil atinge uma altura máxima de 45 metros e um alcance horizontal total de 240 metros.`}}]},{name:"Dinâmica",formulas:[{id:"f-din-1",name:"Segunda Lei de Newton",expression:"F_R = m · a",description:"A força resultante é o produto da massa do corpo pela sua aceleração.",mnemonic:"Física é Meu Amor!",variables:["F_R: Força resultante (N - Newtons)","m: Massa do corpo (kg)","a: Aceleração (m/s²)"],enemContext:"A espinha dorsal da mecânica. O ENEM adora combinar a 2ª Lei com elevadores, polias/roldanas em sistemas de blocos de carga ou forças de tração. Lembre-se: se a força resultante for zero (equilíbrio), o corpo está parado ou em MRU.",triAnalysis:"Fácil",triDetails:"Questões teóricas ou de aplicação direta desta lei são consideradas fáceis na TRI. Erros algébricos simples reduzem bastante sua proficiência.",resolvedExample:{statement:"Dois blocos, A (massa de 3 kg) e B (massa de 2 kg), estão sobre uma mesa horizontal sem atrito e unidos por um fio ideal. Aplica-se uma força horizontal constante de 20 N no bloco A, puxando o conjunto. Qual é o valor da força de tração no fio que une os blocos?",solution:`1. Analisar o sistema completo: a força externa de 20 N acelera a massa total (mA + mB = 5 kg).
2. Calcular a aceleração comum: F_R = m_total · a => 20 = 5 · a => a = 4 m/s².
3. Analisar apenas o bloco B: a única força horizontal atuando sobre B é a tração (T) do fio.
4. Aplicar a 2ª Lei no bloco B: T = mB · a => T = 2 kg · 4 m/s² = 8 N.
Resposta final: A força de tração no fio é de 8 N.`}},{id:"f-din-2",name:"Força Peso",expression:"P = m · g",description:"Atração gravitacional exercida por um planeta sobre uma massa.",mnemonic:"Peso é Massa com Gravidade!",variables:["P: Força peso (N)","m: Massa (kg)","g: Aceleração da gravidade (aprox. 9.8 ou 10 m/s²)"],enemContext:"Diferenciar PESO (força gravitacional variável com o local) de MASSA (quantidade de matéria constante) é o clássico do ENEM. Sempre cai em questões comparando a gravidade da Terra com a da Lua ou de Marte.",triAnalysis:"Fácil",triDetails:"Questões conceituais sobre gravidade ou diferença de peso e massa são de nível fácil. Na TRI, têm altíssimo peso de acerto conceitual.",resolvedExample:{statement:"Um astronauta com todo o seu equipamento possui massa total de 120 kg na Terra. Sabendo que a gravidade da Lua é aproximadamente 1,6 m/s² e a da Terra é 10 m/s², determine o peso aproximado do astronauta equipado na Terra e na Lua.",solution:`1. Calcular o peso na Terra: P_terra = m · g_terra = 120 kg · 10 m/s² = 1200 N.
2. Calcular o peso na Lua: P_lua = m · g_lua = 120 kg · 1,6 m/s² = 192 N.
Nota de rodapé: A massa dele continua sendo exatamente 120 kg nos dois locais!
Resposta final: 1200 N na Terra e 192 N na Lua.`}},{id:"f-din-3",name:"Força de Atrito",expression:"f_at = μ · N",description:"Força contrária ao deslizamento que surge pelo contato entre superfícies.",mnemonic:"Atrito é Mulher Normal!",variables:["f_at: Força de atrito (N)","μ: Coeficiente de atrito (estático ou cinético, adimensional)","N: Força normal de contato (N)"],enemContext:"Altíssima recorrência! O ENEM ama cobrar a diferença entre atrito estático (antes de mover, atua no caminhar e na roda que rola sem deslizar) e atrito cinético (durante o escorregamento). Muito frequente no estudo de freios ABS.",triAnalysis:"Média",triDetails:"O atrito estático varia de zero até um valor máximo (μ_estático · N). Questões que exigem analisar se o bloco se move ou não são de nível médio a difícil na TRI.",resolvedExample:{statement:"Um bloco de massa 10 kg repousa sobre uma superfície horizontal com coeficiente de atrito estático μe = 0,40. Adotando g = 10 m/s², determine se o bloco entrará em movimento e qual a força de atrito se aplicarmos uma força horizontal empurrando-o com intensidade de 30 N.",solution:`1. Calcular a Força Normal (N): Como a superfície é horizontal e plana, N = Peso = m · g = 10 · 10 = 100 N.
2. Calcular a força de atrito estático máximo: f_at_max = μe · N = 0,40 · 100 N = 40 N.
3. Comparar a força aplicada (30 N) com a máxima estática (40 N): Como 30 N < 40 N, o bloco NÃO entra em movimento (permanece estático).
4. Determinar a força de atrito real: Como o bloco está em repouso, a força de atrito é exatamente igual à força empurrando-o para manter o equilíbrio, ou seja, 30 N.
Resposta final: O bloco permanece imóvel e a força de atrito estático real é de 30 N.`}},{id:"f-din-4",name:"Força Elástica (Lei de Hooke)",expression:"F_el = k · x",description:"Força restauradora proporcional à deformação de uma mola.",mnemonic:"Força Elástica é o KaXote!",variables:["F_el: Força elástica (N - Newtons)","k: Constante elástica da mola (N/m)","x: Deformação / alongamento sofrido (m)"],enemContext:"A lei de Hooke descreve molas e materiais elásticos ideais. O ENEM costuma relacionar as molas com deformações em balanças de mola (dinamômetros) ou sistemas de suspensão automotiva (amortecedores). Atenção: a força elástica é uma força restauradora, o que significa que ela aponta sempre no sentido oposto ao da deformação da mola para tentar fazê-la retornar ao seu tamanho original.",triAnalysis:"Fácil",triDetails:"As questões de aplicação direta da Lei de Hooke são fáceis na TRI. Podem se tornar médias se houver associação de molas em série ou em paralelo, ou se for associada à conservação de energia mecânica (energia potencial elástica).",resolvedExample:{statement:"Um bloco de massa m = 2,0 kg está suspenso verticalmente na extremidade livre de uma mola ideal de constante elástica k = 500 N/m. O sistema está em equilíbrio estático no campo gravitacional terrestre (g = 10 m/s²). Qual a deformação x sofrida pela mola em centímetros?",solution:`1. Como o sistema está em equilíbrio estático vertical, a força elástica exercida pela mola anula exatamente a força peso do bloco: F_el = Peso.
2. Calcular a força peso: Peso = m · g = 2,0 kg · 10 m/s² = 20 N.
3. Aplicar a Lei de Hooke: F_el = k · x => 20 = 500 · x.
4. Resolver para x: x = 20 / 500 = 0,04 metros.
5. Converter a resposta final de metros para centímetros: x = 0,04 · 100 = 4,0 cm.
Resposta final: A deformação sofrida pela mola é de 4,0 cm.`}},{id:"f-din-5",name:"Lei de Coulomb (Força Elétrica)",expression:"F_E = k · |Q₁| · |Q₂| / d²",description:"Atração ou repulsão entre duas cargas elétricas puntiformes.",mnemonic:"Cargas unidas divididas pela Distância ao quadrado!",variables:["F_E: Força elétrica de atração ou repulsão (N)","k: Constante eletrostática do meio (no vácuo é 9x10⁹ N·m²/C²)","Q₁, Q₂: Cargas elétricas pontiformes (C - Coulombs)","d: Distância entre os centros das cargas (m)"],enemContext:"Fundamental para entender a atração e repulsão de corpos carregados eletricamente. No ENEM, foca-se muito na proporcionalidade da força: se a distância dobra, a força elétrica cai para a quarta parte (1/4); se a distância cai pela metade, a força quadruplica (4x). Esse tipo de análise de proporção sem fazer contas complexas é clássica!",triAnalysis:"Média",triDetails:"Geralmente o ENEM prefere cobrar as relações de proporcionalidade inversa com o quadrado da distância. Erros comuns de álgebra envolvem notação científica (potências de 10) e a conversão de microcoulombs (μC = 10⁻⁶ C) ou centímetros para metros.",resolvedExample:{statement:"Duas pequenas esferas carregadas com cargas elétricas Q₁ = 2,0 · 10⁻⁶ C (2,0 μC) e Q₂ = 3,0 · 10⁻⁶ C (3,0 μC) são posicionadas no vácuo a uma distância de 3,0 cm uma da outra. Sabendo que a constante eletrostática no vácuo é k = 9 · 10⁹ N·m²/C², calcule a intensidade da força elétrica repulsiva entre elas.",solution:`1. Converter a distância de centímetros para metros: d = 3,0 cm = 3,0 · 10⁻² m.
2. Aplicar a Lei de Coulomb: F_E = k · |Q₁| · |Q₂| / d².
3. Substituir os valores: F_E = (9 · 10⁹) · (2,0 · 10⁻⁶) · (3,0 · 10⁻⁶) / (3,0 · 10⁻²)².
4. Simplificar o numerador: (9 · 2 · 3) · 10^(9 - 6 - 6) = 54 · 10⁻³ N.
5. Calcular o denominador: (3,0 · 10⁻²)² = 9,0 · 10⁻⁴ m².
6. Dividir os valores obtidos: F_E = (54 · 10⁻³) / (9,0 · 10⁻⁴) = (54 / 9) · 10^(-3 - (-4)) = 6 · 10¹ = 60 N.
Resposta final: A força elétrica de repulsão entre as esferas é de 60 N.`}},{id:"f-din-6",name:"Torque / Momento de Força",expression:"M = F · d",description:"Mede a tendência de uma força de rotacionar um corpo rígido ao redor de um eixo.",mnemonic:"Momento Forte de Distância!",variables:["M: Torque ou Momento (N·m)","F: Força aplicada perpendicularmente (N)","d: Distância da aplicação até o fulcro/ponto de giro (m)"],enemContext:"Presença garantida nas provas do ENEM! Cobrado sob a forma de ferramentas como chaves de roda, alicates, tesouras, carrinhos de mão, ou o equilíbrio de gangorras/pontes. O truque é aplicar forces na maior distância possível do fulcro para reduzir o esforço necessário.",triAnalysis:"Média",triDetails:"Questões de equilíbrio de corpos rígidos (Soma de Torques = 0) envolvem múltiplos vetores e são muito valorizadas na TRI como nível médio/difícil.",resolvedExample:{statement:"Uma barra homogênea e leve de 2,0 metros de comprimento é apoiada exatamente no seu ponto central (1,0 m). Uma criança de 30 kg senta-se na extremidade esquerda da barra (a 1,0 m do apoio). A que distância do apoio, à direita, deve sentar-se um jovem de 60 kg para manter a barra em perfeito equilíbrio horizontal?",solution:`1. Adotar o ponto de apoio central como o ponto de giro (torque nulo do apoio).
2. O peso da criança tende a girar a barra no sentido anti-horário: Torque_criança = F · d = (30 kg · 10 m/s²) · 1,0 m = 300 N·m.
3. O peso do jovem deve produzir um torque igual e contrário (horário) para haver equilíbrio: Torque_jovem = Torque_criança.
4. (60 kg · 10 m/s²) · d_jovem = 300 => 600 · d_jovem = 300 => d_jovem = 0,5 metros.
Resposta final: O jovem deve sentar-se a 0,5 metros (50 cm) do centro de apoio.`}},{id:"f-din-7",name:"Força Centrípeta",expression:"F_cp = m · v² / r",description:"Força resultante necessária para manter um corpo em movimento circular.",mnemonic:"Massa com velocidade ao quadrado sobre o Raio!",variables:["F_cp: Força centrípeta (N)","m: Massa do corpo em rotação (kg)","v: Velocidade linear tangencial (m/s)","r: Raio da curva/trajetória circular (m)"],enemContext:"Atenção de ouro: Força Centrípeta NÃO é uma força nova gerada do nada, ela é uma FORÇA RESULTANTE! Em curvas de estradas planas, a força de atrito lateral atua como centrípeta. No topo ou na base de um looping de montanha-russa, a resultante centrípeta é a combinação do peso e da força normal de contato com o trilho.",triAnalysis:"Média",triDetails:"Compreender que a centrípeta é a resultante das forças que apontam para o centro menos as forças que apontam para fora é um conceito avançado na TRI. Questões sobre curvas planas com atrito estático ou loopings têm peso médio a alto.",resolvedExample:{statement:"Um piloto de acrobacia aérea realiza um looping perfeitamente circular de raio r = 90 metros pilotando um avião de massa total m = 800 kg. Qual deve ser a velocidade tangencial mínima do avião, no ponto mais alto do looping, para que ele consiga completar a curva sem descolar do assento (Normal = 0)? Adote g = 10 m/s².",solution:`1. No ponto mais alto do looping, tanto a Força Peso (P) quanto a Força Normal (N) apontam verticalmente para baixo (em direção ao centro da curva).
2. Portanto, a força resultante centrípeta é a soma de ambas: F_cp = P + N.
3. Para a velocidade mínima de segurança (limite de queda), a força normal tende a zero (N = 0): F_cp = P => m · v² / r = m · g.
4. Simplificar cortando a massa m de ambos os lados: v² / r = g => v = √(g · r).
5. Substituir os valores: v = √(10 · 90) = √900 = 30 m/s.
6. Se quisermos em km/h, multiplicamos por 3,6: 30 · 3,6 = 108 km/h.
Resposta final: A velocidade mínima no topo do looping deve ser de 30 m/s (108 km/h).`}},{id:"f-din-8",name:"Quantidade de Movimento",expression:"Q = m · v",description:"Também conhecido como momento linear, mede o vetor inercial do corpo.",mnemonic:"Quem é Você? Sou a Massa e a Velocidade!",variables:["Q: Quantidade de movimento ou momento linear (kg·m/s)","m: Massa do corpo (kg)","v: Vetor velocidade linear (m/s)"],enemContext:"Medida direta da inércia em movimento do corpo. No ENEM, esse conceito é crucial para analisar sistemas isolados livres de forças externas (onde a Quantidade de Movimento Total se Conserva, ou seja, Q_antes = Q_depois). Isso rege todas as colisões (choques de carros), explosões e o princípio de propulsão de foguetes!",triAnalysis:"Média",triDetails:"Questões de colisões ou explosões exigem analisar a conservação da quantidade de movimento. Por envolver uma grandeza vetorial (direção e sentido importam), costuma-se errar sinais na álgebra algébrica, o que a TRI pune com nível médio/difícil.",resolvedExample:{statement:"Um vagão ferroviário A de massa 10 toneladas (10.000 kg) move-se horizontalmente a uma velocidade de 3,0 m/s sobre trilhos sem atrito e colide com um vagão B idêntico (massa de 10 toneladas) que se encontrava inicialmente em repouso. Após o impacto, os dois vagões acoplam-se e passam a mover-se juntos. Qual a velocidade final do conjunto acoplado?",solution:`1. Como o sistema ferroviário é isolado horizontalmente, a quantidade de movimento total se conserva: Q_inicial = Q_final.
2. Calcular a quantidade de movimento inicial (apenas o vagão A está em movimento): Q_inicial = mA · vA + mB · vB = 10.000 · 3,0 + 10.000 · 0 = 30.000 kg·m/s.
3. Montar a quantidade de movimento final com os vagões acoplados (massa junta m_total = mA + mB = 20.000 kg): Q_final = m_total · v_final = 20.000 · v_final.
4. Igualar Q_inicial e Q_final: 30.000 = 20.000 · v_final.
5. Resolver para v_final: v_final = 30.000 / 20.000 = 1,5 m/s.
Resposta final: O conjunto de vagões acoplados se move a uma velocidade de 1,5 m/s.`}},{id:"f-din-9",name:"Teorema do Impulso",expression:"I = F · Δt = ΔQ",description:"A variação da quantidade de movimento é igual ao impulso de uma força externa.",mnemonic:"Impulso Forte no Tempo!",variables:["I: Impulso de uma força (N·s ou kg·m/s)","F: Força média aplicada (N)","Δt: Tempo de contato / aplicação da força (s)","ΔQ: Variação da quantidade de movimento (Q_final - Q_inicial)"],enemContext:"Super importante na segurança automotiva e no cotidiano! O ENEM adora cobrar por que usamos airbags em carros, capacetes, cintos de segurança, solados acolchoados de tênis ou por que dobramos os joelhos ao pular de um muro. Todos esses dispositivos aumentam o tempo de desaceleração (Δt) de uma colisão. Como a variação da quantidade de movimento (ΔQ) é fixa, aumentar o Δt reduz dramaticamente a força de impacto (F) sobre o corpo!",triAnalysis:"Média",triDetails:"Compreender os aspectos conceituais de segurança mecânica e a relação inversamente proporcional entre Força e Tempo de colisão é um dos focos mais queridos do ENEM. Questões teóricas desse escopo são fáceis/médias e cruciais para a consistência da TRI.",resolvedExample:{statement:"Durante um teste de segurança automotiva (crash-test), um boneco de testes de massa 80 kg colide com o cinto de segurança e é freado de uma velocidade inicial de 20 m/s até parar completamente. Calcule a força média suportada pelo boneco se a parada demorar 0,20 segundos.",solution:`1. Calcular a quantidade de movimento inicial do boneco: Q_inicial = m · v_inicial = 80 kg · 20 m/s = 1600 kg·m/s.
2. Calcular a quantidade de movimento final (repouso): Q_final = 80 · 0 = 0 kg·m/s.
3. Determinar a variação da quantidade de movimento em módulo: |ΔQ| = |Q_final - Q_inicial| = |0 - 1600| = 1600 kg·m/s.
4. Pelo Teorema do Impulso: I = F · Δt = |ΔQ|.
5. Substituir os valores conhecidos: F · 0,20 = 1600 => F = 1600 / 0,20 = 8000 N.
Resposta final: A força média que atuou sobre o boneco foi de 8000 N (equivalente ao peso de uma massa de 800 kg!).`}},{id:"f-din-10",name:"Plano Inclinado (Decomposição de Peso)",expression:"P_x = P · sen(θ)  |  P_y = P · cos(θ)",description:"Decomposição ortogonal do vetor peso em componentes paralela (Px) e perpendicular (Py) ao plano da rampa.",mnemonic:"Px escorregando de SENO (Sem Sono deitado), Py pressionando de COSSENO (Com Sono em pé)!",variables:["P_x: Componente do peso paralela à rampa, causa a descida (N)","P_y: Componente do peso perpendicular à rampa, causa pressão de contato (N)","P: Força peso total do corpo (P = m · g) (N)","θ: Ângulo de inclinação da rampa com a horizontal (graus)"],enemContext:"Indispensável em rampas de acessibilidade, esteiras de mineração ou de cargas. No plano inclinado sem atrito, a única força que faz o corpo deslizar ladeira abaixo é a Px. Lembre-se: a aceleração do corpo descendo uma rampa lisa é simplesmente a_descida = g · sen(θ) (independe da massa do corpo!). A componente Py será anulada pela força Normal de contato: Normal = Py.",triAnalysis:"Média",triDetails:"Envolve decomposição de forças em planos inclinados com ou sem a presença de atrito. A TRI pontua bem alunos que sabem relacionar que f_at = μ · Normal = μ · Py = μ · P · cos(θ) em rampas de teste.",resolvedExample:{statement:"Um caixote de massa m = 10 kg é colocado em repouso sobre uma rampa inclinada de 30° em relação à horizontal. Adote g = 10 m/s², sen(30°) = 0,50 e cos(30°) = 0,86. Desprezando os atritos, determine a força Normal de contato e a aceleração desenvolvida pelo caixote ao deslizar pela rampa.",solution:`1. Calcular a força peso do caixote: Peso = m · g = 10 kg · 10 m/s² = 100 N.
2. Calcular a componente Py (perpendicular ao plano): Py = Peso · cos(30°) = 100 · 0,86 = 86 N.
3. Como não há movimento perpendicular ao plano, a força Normal equilibra Py: Normal = Py = 86 N.
4. Calcular a componente Px (paralela ao plano, força resultante descendo): Px = Peso · sen(30°) = 100 · 0,50 = 50 N.
5. Calcular a aceleração descendo pela 2ª Lei de Newton: F_R = m · a => Px = m · a => 50 = 10 · a => a = 5,0 m/s².
Resposta final: A força Normal é de 86 N e a aceleração descendo a rampa é de 5,0 m/s².`}},{id:"f-din-11",name:"Lei da Gravitação Universal",expression:"F_G = G · M · m / d²",description:"Força mútua de atração gravitacional que atua entre dois corpos massivos.",mnemonic:"Grande Força é a Gravidade das Massas sobre a Distância ao quadrado!",variables:["F_G: Força de atração gravitacional entre os corpos (N)","G: Constante de gravitação universal (6,67 · 10⁻¹¹ N·m²/kg²)","M: Massa do corpo celeste maior, ex: Terra (kg)","m: Massa do corpo menor ou satélite (kg)","d: Distância entre os centers de massa dos dois corpos (m)"],enemContext:"Explica o movimento de satélites artificiais, as órbitas dos planetas ao redor do Sol (leis de Kepler) e as marés oceânicas na Terra. Muito cuidado com o conceito: a força da gravidade cai de forma inversa com o quadrado da distância. Se um satélite dobra sua distância em relação ao centro da Terra, a gravidade agindo nele cai 4 vezes!",triAnalysis:"Média",triDetails:"Questões que associam gravitação com a velocidade orbital de satélites (onde a força gravitacional atua como força centrípeta: F_G = F_cp) exigem manipulações algébricas médias e são altamente pontuadas.",resolvedExample:{statement:"Um satélite meteorológico artificial de massa m está em órbita circular estável a uma distância d do centro da Terra (massa M). Se o satélite for movido para uma órbita mais externa com o dobro da distância original (2d) do centro da Terra, por qual fator a força de atração gravitacional exercida sobre o satélite será alterada?",solution:`1. Escrever a equação original da força gravitacional: F_original = G · M · m / d².
2. Escrever a nova equação substituindo a distância por 2d (cuidado para elevar o parêntese completo ao quadrado):
F_nova = G · M · m / (2d)² = G · M · m / (4 · d²).
3. Reorganizar a equação isolando o fator fracionário:
F_nova = (1/4) · (G · M · m / d²).
4. Comparar os resultados: F_nova = F_original / 4.
Resposta final: A força de atração gravitacional será reduzida a 1/4 (uma quarta parte) do valor original.`}}]},{name:"Eletrodinâmica",formulas:[{id:"f-el-1",name:"Intensidade da Corrente",expression:"i = ΔQ / Δt",description:"Fluxo de carga elétrica que atravessa a seção transversal de um condutor por segundo.",mnemonic:"Quero ir com a Corrente de Carga no Tempo!",variables:["i: Corrente elétrica (A - Ampères)","ΔQ: Carga elétrica total (C)","Δt: Intervalo de tempo (s)"],enemContext:"O ENEM adora contextualizar corrente com o fluxo de elétrons em baterias de smartphones ou aparelhos domésticos. Lembrar que a carga de um único elétron é e = 1,6 · 10⁻¹⁹ C permite associar a corrente com o número de partículas por segundo: ΔQ = n · e.",triAnalysis:"Fácil",triDetails:"Equações de corrente elétrica elementar são essenciais na TRI. Erros comuns são relativos à conversão de tempo de minutos ou horas para segundos.",resolvedExample:{statement:"A bateria de um smartwatch de última geração é recarregada por uma corrente constante de 0,50 A durante um intervalo de tempo de 20 minutos. Sabendo que a carga elementar do elétron vale e = 1,6 · 10⁻¹⁹ C, calcule a quantidade total de carga acumulada e o número aproximado de elétrons que atravessaram o cabo.",solution:`1. Converter o tempo para segundos: Δt = 20 min · 60 s/min = 1200 segundos.
2. Aplicar a fórmula da corrente: i = ΔQ / Δt => ΔQ = i · Δt.
3. Calcular a carga: ΔQ = 0,50 · 1200 = 600 Coulombs (C).
4. Calcular o número de elétrons com ΔQ = n · e => 600 = n · (1,6 · 10⁻¹⁹).
5. Isolar n: n = 600 / (1,6 · 10⁻¹⁹) = 375 · 10¹⁹ = 3,75 · 10²¹ elétrons.
Resposta final: A carga total é de 600 C, correspondendo a 3,75 · 10²¹ elétrons.`}},{id:"f-el-2",name:"Primeira Lei de Ohm",expression:"U = R · i",description:"Relaciona a diferença de potencial, resistência e corrente elétrica.",mnemonic:"Quem Ri, dá um U em cima da Mesa!",variables:["U: Tensão / ddp (V - Volts)","R: Resistência elétrica (Ω - Ohms)","i: Corrente elétrica (A)"],enemContext:"A lei mais famosa da eletricidade do ENEM! Utilizada em praticamente todos os problemas de circuitos elétricos, lâmpadas, chuveiros e resistores. É o ponto de partida absoluto para a análise de malhas.",triAnalysis:"Fácil",triDetails:"Errar uma questão de aplicação direta de U = R·i destrói a pontuação de exatas na TRI, pois é considerada uma das habilidades mais fundamentais de ciências da natureza.",resolvedExample:{statement:"Um estudante monta um circuito experimental contendo uma lâmpada cuja resistência elétrica é de 24 Ω conectada a uma fonte ideal de 12 V. Qual é a intensidade da corrente elétrica que percorre o filamento dessa lâmpada?",solution:`1. Aplicar a Primeira Lei de Ohm: U = R · i.
2. Substituir os valores conhecidos: 12 = 24 · i.
3. Isolar i: i = 12 / 24 = 0,50 A.
Resposta final: A corrente que percorre a lâmpada é de 0,50 Ampères.`}},{id:"f-el-3",name:"Segunda Lei de Ohm",expression:"R = ρ · l / A",description:"Resistência de um fio condutor baseada nas suas características geométricas e materiais.",mnemonic:"Rola! R = ro · l / A !",variables:["R: Resistência (Ω)","ρ: Resistividade do material (Ω·m)","l: Comprimento do condutor (m)","A: Área da seção transversal (m²)"],enemContext:"Muito cobrada de forma qualitativa no ENEM: como fabricar fios mais eficientes (menores perdas) ou por que os cabos de alta tensão de transmissão elétrica são grossos e feitos de alumínio de baixa resistividade. Lembrar: fio mais comprido (l) = mais resistência; fio mais grosso (área A maior) = menos resistência!",triAnalysis:"Média",triDetails:"A manipulação de áreas de círculos (A = π·r² ou A = π·d²/4) para representar a espessura do fio é a pegadinha clássica do ENEM que eleva a dificuldade na TRI.",resolvedExample:{statement:"Dois fios cilíndricos condutores, X e Y, são feitos do mesmo metal homogêneo. O fio X tem comprimento L e área de seção transversal A, apresentando resistência R. O fio Y tem o dobro do comprimento (2L) e metade da área de seção (A/2). Determine a resistência elétrica do fio Y em função de R.",solution:`1. Expressar a resistência de X pela Segunda Lei de Ohm: R_X = ρ · L / A = R.
2. Expressar a resistência de Y com as novas proporções: R_Y = ρ · (2L) / (A/2).
3. Reorganizar os fatores matemáticos: R_Y = ρ · 2L · (2 / A) = 4 · (ρ · L / A).
4. Substituir a relação original de X: R_Y = 4 · R.
Resposta final: A resistência do fio Y é quatro vezes maior que a do fio X (4R).`}},{id:"f-el-4",name:"Potência Elétrica",expression:"P = i · U",description:"Energia elétrica consumida ou produzida por um dispositivo por unidade de tempo.",mnemonic:"Piu! O passarinho faz Piu!",variables:["P: Potência elétrica (W - Watts)","i: Corrente (A)","U: Tensão/ddp (V)"],enemContext:"União fundamental entre corrente, tensão e potência. Cobrado na especificação de carregadores USB rápidos, lâmpadas de LED modernas e eletrodomésticos inteligentes.",triAnalysis:"Fácil",triDetails:"Associação direta e básica de multiplicação de dois parâmetros conhecidos. Erros comuns de conversão de unidades (como miliampères para ampères, mA = 10⁻³ A) são punidos na TRI.",resolvedExample:{statement:"Um carregador rápido de smartphone exibe em sua embalagem as especificações de saída de energia: tensão de 9,0 V e corrente máxima fornecida de 2,0 A. Qual a potência elétrica máxima de carregamento desse dispositivo?",solution:`1. Aplicar a fórmula da potência: P = i · U.
2. Substituir os valores especificados: P = 2,0 · 9,0.
3. Calcular o produto: P = 18 W.
Resposta final: A potência máxima do carregador é de 18 Watts.`}},{id:"f-el-5",name:"Efeito Joule",expression:"P = R · i²",description:"Calcula a potência dissipada em calor por um resistor elétrico.",mnemonic:"Pai Ri de rir duas vezes!",variables:["P: Potência dissipada (W)","R: Resistência (Ω)","i: Corrente elétrica (A)"],enemContext:"O ENEM ama o chuveiro elétrico! No inverno, queremos esquentar mais a água, o que significa aumentar a potência dissipada (P). Como a ddp da rede de energia da nossa casa é constante (U = 110V ou 220V), usamos a variante P = U² / R. Para aumentar a potência, devemos REDUZIR a resistência (R) do chuveiro colocando a chave na posição INVERNO!",triAnalysis:"Média",triDetails:"O conceito intuitivo de que 'menos resistência gera mais calor' para fontes de tensão constante (como tomadas domésticas) é uma das maiores pegadinhas conceituais do ENEM, muito valorizada na TRI.",resolvedExample:{statement:"Um chuveiro elétrico residencial opera conectado a uma tensão de 220 V. Na posição 'Verão', sua resistência vale 22 Ω e na posição 'Inverno', a resistência é reduzida para 11 Ω. Calcule as potências elétricas desenvolvidas pelo aparelho em cada uma das duas posições.",solution:`1. Utilizar a fórmula da potência relacionada com tensão constante: P = U² / R.
2. Calcular a potência na posição Verão (R = 22 Ω):
P_verao = (220)² / 22 = 48.400 / 22 = 2200 W (2,2 kW).
3. Calcular a potência na posição Inverno (R = 11 Ω):
P_inverno = (220)² / 11 = 48.400 / 11 = 4400 W (4,4 kW).
Resposta final: A potência no Verão é de 2200 W e no Inverno é de 4400 W.`}},{id:"f-el-6",name:"Equação do Gerador",expression:"U = ε - r · i",description:"Diferença de potencial útil fornecida por um gerador real ao circuito.",mnemonic:"O Único Amor é livre das perdas internas!",variables:["U: Tensão útil nos terminais (V)","ε: Força eletromotriz do gerador (V)","r: Resistência interna do gerador (Ω)","i: Corrente elétrica (A)"],enemContext:"Explica por que pilhas e baterias reais esquentam durante o uso e por que a tensão real medida nos seus polos cai à medida que exigimos mais corrente do circuito. A parcela (r · i) representa a ddp dissipada internamente em forma de calor.",triAnalysis:"Média",triDetails:"O estudo gráfico do gerador (reta decrescente) e o conceito de curto-circuito (quando U = 0 e a corrente é máxima, i_cc = ε/r) são cobrados de nível médio para difícil no ENEM.",resolvedExample:{statement:"Uma bateria automotiva real possui força eletromotriz ε = 12 V e resistência interna r = 0,20 Ω. Quando os faróis são ligados, a bateria fornece uma corrente elétrica de 10 A ao circuito. Qual a tensão útil disponível para os faróis?",solution:`1. Aplicar a equação do gerador: U = ε - r · i.
2. Substituir os valores fornecidos: U = 12 - (0,20 · 10).
3. Calcular o termo dissipado: r · i = 2,0 V.
4. Subtrair para encontrar a tensão útil nos terminais: U = 12 - 2,0 = 10 V.
Resposta final: A tensão útil real disponível nos polos da bateria é de 10 V.`}},{id:"f-el-7",name:"Equação do Receptor",expression:"U = ε' + r · i",description:"Diferença de potencial consumida por um receptor real (como um motor).",mnemonic:"Consumo total é o útil mais o calor perdido!",variables:["U: Tensão total aplicada (V)","ε': Força contra-eletromotriz (V)","r: Resistência interna do receptor (Ω)","i: Corrente elétrica (A)"],enemContext:"Aplica-se a motores elétricos (ventiladores, batedeiras, furadeiras) ou carregadores de bateria. O receptor transforma energia elétrica em outra forma que não seja puramente calor (ex: energia mecânica no ventilador). A parcela (ε' · i) representa a potência útil transformada, e (r · i²) a potência perdida.",triAnalysis:"Difícil",triDetails:"A distinção fina entre gerador e receptor nos esquemas de circuitos do ENEM é um tema complexo que gera confusão nos sinais algébricos (+ e -) e é classificado como difícil na TRI.",resolvedExample:{statement:"Um motor elétrico de um ventilador possui resistência interna r = 1,5 Ω e força contra-eletromotriz ε' = 110 V. Ao ser conectado a uma tomada de 122 V, qual será a intensidade da corrente elétrica estabelecida no motor?",solution:`1. Aplicar a equação do receptor: U = ε' + r · i.
2. Substituir os valores conhecidos: 122 = 110 + 1,5 · i.
3. Isolar o termo com i: 1,5 · i = 122 - 110 => 1,5 · i = 12.
4. Resolver para i: i = 12 / 1,5 = 8,0 A.
Resposta final: A corrente estabelecida no motor do ventilador é de 8,0 Ampères.`}},{id:"f-el-8",name:"Associação de Resistores em Série",expression:"R_eq = R₁ + R₂ + ...",description:"Cálculo da resistência equivalente quando os resistores estão conectados em sequência.",mnemonic:"Série Soma de boa, Corrente Igualzona!",variables:["R_eq: Resistência equivalente do circuito (Ω)","R₁, R₂: Resistências elétricas individuais (Ω)"],enemContext:"O segredo da associação em série: a corrente elétrica (i) que passa por todos os resistores é exatamente a MESMA! No entanto, a tensão (U) total divide-se proporcionalmente entre eles (quem tem maior R fica com a maior fatia da tensão). Exemplo clássico: luzinhas de árvore de Natal antigas, onde se uma queimar, o circuito abre e todas apagam.",triAnalysis:"Fácil",triDetails:"Cálculos básicos de série são fáceis na TRI. Podem envolver divisores de tensão simples.",resolvedExample:{statement:"Dois resistores de resistências R₁ = 15 Ω e R₂ = 25 Ω são associados em série e conectados a uma fonte de tensão ideal de 120 V. Determine a resistência equivalente da associação e a corrente elétrica que percorre cada resistor.",solution:`1. Somar as resistências em série: R_eq = R₁ + R₂ = 15 + 25 = 40 Ω.
2. Calcular a corrente total pela Primeira Lei de Ohm (U = R_eq · i):
i = U / R_eq = 120 / 40 = 3,0 A.
3. Como a associação é em série, a corrente é igual em ambos: i₁ = i₂ = 3,0 A.
Resposta final: A resistência equivalente é de 40 Ω e a corrente em cada um é de 3,0 A.`}},{id:"f-el-9",name:"Associação de Resistores em Paralelo",expression:"R_eq = (R₁ · R₂) / (R₁ + R₂)",description:"Cálculo simplificado para dois resistores paralelos ou fórmula recíproca geral.",mnemonic:"Paralelo divide: Produto pela Soma! Tensão Igualzona!",variables:["R_eq: Resistência equivalente (Ω)","R₁, R₂: Resistências elétricas individuais (Ω)"],enemContext:"O padrão das instalações elétricas das nossas casas! Todas as tomadas, lâmpadas e eletrodomésticos são associados em PARALELO para que todos recebam exatamente a MESMA TENSÃO de rede (ex: 127V ou 220V) de forma independente. Se um aparelho for desligado, os outros continuam funcionando normalmente.",triAnalysis:"Média",triDetails:"Questões envolvendo paralelismo são de nível médio. Lembre-se: adicionar resistores em paralelo sempre REDUZ a resistência equivalente total do circuito (R_eq será sempre menor que o menor dos resistores individuais!).",resolvedExample:{statement:"Em uma cozinha residencial, uma torradeira (R₁ = 30 Ω) e um liquidificador (R₂ = 20 Ω) estão ligados em paralelo na mesma tomada de 120 V. Calcule a resistência equivalente desse conjunto e a corrente elétrica total consumida na tomada.",solution:`1. Calcular a resistência equivalente usando o produto pela soma:
R_eq = (R₁ · R₂) / (R₁ + R₂) = (30 · 20) / (30 + 20) = 600 / 50 = 12 Ω.
2. Calcular a corrente total consumida na tomada usando a Primeira Lei de Ohm (U = R_eq · i_total):
i_total = U / R_eq = 120 / 12 = 10 A.
Resposta final: A resistência equivalente é de 12 Ω e a corrente total drenada é de 10 A.`}},{id:"f-el-10",name:"Consumo de Energia Elétrica",expression:"E_cons = P · Δt",description:"Energia elétrica total consumida por um aparelho baseado em sua potência e tempo de uso.",mnemonic:"Energia é a Potência no Tempo!",variables:["E_cons: Energia elétrica consumida (kWh ou J)","P: Potência elétrica (kW ou W)","Δt: Intervalo de tempo (h ou s)"],enemContext:"A questão MAIS CERTA de cair em toda a história do ENEM! Calcular o consumo mensal da fatura de luz de uma residência e o impacto financeiro de banhos demorados ou aparelhos de ar-condicionado. Para fins práticos e de cobrança, a energia é medida em quilowatt-hora (kWh), onde 1 kWh é o consumo de um dispositivo de 1000 W ligado por 1 hora.",triAnalysis:"Média",triDetails:"Altíssima frequência no ENEM. O foco é a conversão correta de Watts para quilowatts (dividir por 1000) e do tempo para horas. Dominar esse cálculo é obrigatório na TRI para obter notas robustas.",resolvedExample:{statement:"Em uma residência com quatro moradores, cada um toma um banho diário médio de 15 minutos com o chuveiro elétrico na potência máxima de 6000 W (6,0 kW). Sabendo que a tarifa cobrada pela distribuidora de energia é de R$ 0,80 por cada kWh consumido, calcule o consumo mensal de energia desse chuveiro (30 dias) e o custo financeiro total em Reais.",solution:`1. Calcular o tempo total diário de banho dos quatro moradores: Δt_dia = 4 · 15 minutos = 60 minutos = 1,0 hora por dia.
2. Calcular o tempo total de banho em um mês (30 dias): Δt_mes = 1,0 h/dia · 30 dias = 30 horas.
3. Aplicar a fórmula do consumo de energia (com a potência já convertida para kW):
E_cons = P · Δt_mes = 6,0 kW · 30 h = 180 kWh.
4. Calcular o custo financeiro multiplicando o consumo pela tarifa:
Custo = 180 kWh · R$ 0,80 = R$ 144,00.
Resposta final: O consumo mensal do chuveiro é de 180 kWh, custando R$ 144,00 aos moradores.`}}]},{name:"Energia e Trabalho",formulas:[{id:"f-en-1",name:"Energia Cinética",expression:"E_c = m · v² / 2",description:"Energia associada ao movimento de um corpo massivo.",mnemonic:"Massa no Vento ao quadrado sobre dois!",variables:["E_c: Energia cinética associada ao movimento (J - Joules)","m: Massa do corpo (kg)","v: Velocidade linear (m/s)"],enemContext:"O ENEM costuma associar a energia cinética diretamente com a velocidade dos veículos em estradas e o impacto em colisões de trânsito. Lembre-se: como a velocidade é elevada ao quadrado, dobrar a velocidade de um automóvel quadruplica a sua energia cinética, o que multiplica por quatro a distância necessária de frenagem e a gravidade de um eventual acidente!",triAnalysis:"Fácil",triDetails:"A aplicação direta da fórmula da energia cinética é considerada fácil na TRI. O principal erro cometido pelos candidatos é esquecer de elevar a velocidade ao quadrado ou esquecer de converter a velocidade de km/h para m/s antes do cálculo.",resolvedExample:{statement:"Um veículo de passeio de massa m = 1200 kg trafega por uma rodovia retilínea com velocidade constante de 108 km/h. Calcule a energia cinética desse carro em quilojoules (kJ).",solution:`1. Converter a velocidade de km/h para m/s: v = 108 / 3,6 = 30 m/s.
2. Aplicar a fórmula da energia cinética: E_c = m · v² / 2.
3. Substituir os valores: E_c = 1200 · (30)² / 2 = 600 · 900 = 540.000 Joules (J).
4. Converter Joules para quilojoules dividindo por 1000: E_c = 540 kJ.
Resposta final: A energia cinética do automóvel é de 540 kJ.`}},{id:"f-en-2",name:"Energia Potencial Gravitacional",expression:"E_pg = m · g · h",description:"Energia armazenada em função da altura de um corpo em relação a uma referência.",mnemonic:"Mergulho de cabeça na Altura: m-g-h!",variables:["E_pg: Energia potencial gravitacional acumulada (J)","m: Massa do objeto (kg)","g: Aceleração da gravidade local (m/s²)","h: Altura vertical em relação ao plano de referência (m)"],enemContext:"Extremamente frequente no ENEM na análise de usinas hidrelétricas (onde a água armazenada em represas elevadas possui E_pg que se converte em cinética e depois em energia elétrica), quedas de objetos, montanhas-russas ou esportes radicais. O ponto chave é que a altura (h) depende sempre de um referencial adotado (geralmente o solo).",triAnalysis:"Fácil",triDetails:"Questão típica de nível fácil. Erros comuns envolvem a falta de atenção ao referencial ou unidades incorretas de massa (como usar gramas em vez de kg).",resolvedExample:{statement:"Uma hidrelétrica aproveita a queda d'água de uma represa situada a uma altura vertical de 80 metros para mover suas turbinas. Sabendo que o fluxo de água é de 5,0 toneladas (5.000 kg) por segundo e adotando g = 10 m/s², calcule a energia potencial gravitacional disponibilizada por segundo por essa queda d'água.",solution:`1. Identificar os dados do problema para o intervalo de 1 segundo: m = 5000 kg, h = 80 m, g = 10 m/s².
2. Aplicar a fórmula de energia potencial gravitacional: E_pg = m · g · h.
3. Substituir os valores: E_pg = 5000 · 10 · 80 = 4.000.000 Joules (J).
4. Expressar em megajoules (MJ) ou notação científica: 4,0 · 10⁶ J ou 4,0 MJ.
Resposta final: A queda d'água disponibiliza 4,0 MJ de energia potencial gravitacional por segundo.`}},{id:"f-en-3",name:"Energia Potencial Elástica",expression:"E_pe = k · x² / 2",description:"Energia armazenada em uma mola deformada.",mnemonic:"Mola comprimida na Metade de KX ao quadrado!",variables:["E_pe: Energia potencial elástica armazenada (J)","k: Constante elástica do material/mola (N/m)","x: Deformação ou alongamento sofrido (m)"],enemContext:"O ENEM aplica esse conceito em brinquedos de corda, estilingues, catapultas, arcos de flecha e sistemas de amortecimento. Lembrar que a energia acumulada é diretamente proporcional ao quadrado da deformação: comprimir uma mola o dobro da distância acumula quatro vezes mais energia!",triAnalysis:"Média",triDetails:"Apresenta nível médio na TRI por demandar duas variáveis de controle e a potência quadrática. Erros comuns incluem esquecer de elevar a deformação (x) ao quadrado ou não converter a deformação de centímetros para metros.",resolvedExample:{statement:"Um atleta estica a corda elástica de um arco puxando-a por uma distância x = 50 cm. Sabendo que a constante elástica do arco equivale a k = 400 N/m, calcule a energia potencial elástica acumulada no sistema antes do disparo.",solution:`1. Converter a deformação de centímetros para metros: x = 50 cm = 0,50 m.
2. Aplicar a fórmula da energia potencial elástica: E_pe = k · x² / 2.
3. Substituir os valores: E_pe = 400 · (0,50)² / 2 = 200 · 0,25 = 50 Joules (J).
Resposta final: A energia potencial elástica acumulada no arco é de 50 Joules.`}},{id:"f-en-4",name:"Trabalho de uma Força",expression:"τ = F · d · cosθ",description:"Mede a energia transferida por uma força ao longo de um deslocamento.",mnemonic:"Trabalho Fedido com Cosseno de ângulo!",variables:["τ: Trabalho mecânico realizado pela força (J - Joules)","F: Intensidade da força constante aplicada (N)","d: Distância linear deslocada pelo corpo (m)","θ: Ângulo formado entre o vetor força e a direção do movimento (graus)"],enemContext:"O conceito de trabalho mede a transferência de energia entre sistemas por meio de uma força. No ENEM, atente-se aos sinais: se a força atua no mesmo sentido do movimento (θ = 0°), o trabalho é motor (positivo); se atua em sentido contrário (como a força de atrito, θ = 180°), o trabalho é resistente (negativo). Se for perpendicular (θ = 90°, como a força centrípeta), o trabalho é NULO!",triAnalysis:"Média",triDetails:"Cálculos teóricos ou práticos de trabalho são classificados como médios. Um erro clássico é esquecer de analisar o cosseno do ângulo ou tentar calcular o trabalho de uma força variável multiplicando diretamente F por d (nesse caso, o trabalho deve ser calculado pela área do gráfico Força x Deslocamento).",resolvedExample:{statement:"Um operário arrasta uma caixa de ferramentas pesada por uma distância de 10 metros ao longo do piso plano de uma oficina aplicando uma força constante de intensidade F = 100 N por meio de uma corda inclinada a 60° em relação à horizontal. Sabendo que cos(60°) = 0,50 e sen(60°) = 0,86, calcule o trabalho realizado pela força aplicada pelo operário.",solution:`1. Identificar as variáveis: F = 100 N, d = 10 m, θ = 60°.
2. Aplicar a fórmula do trabalho mecânico: τ = F · d · cosθ.
3. Substituir os valores: τ = 100 · 10 · cos(60°) = 1000 · 0,50 = 500 Joules (J).
Resposta final: O trabalho realizado pela força do operário é de 500 Joules.`}},{id:"f-en-5",name:"Potência Mecânica",expression:"P = τ / Δt = F · v",description:"Taxa de realização de trabalho no tempo, ou força vezes velocidade.",mnemonic:"Potência é Trabalho Rápido ou Força Veloz!",variables:["P: Potência mecânica útil desenvolvida (W - Watts)","τ: Trabalho mecânico realizado (J)","Δt: Intervalo de tempo gasto na execução (s)","F: Intensidade da força aplicada na direção do movimento (N)","v: Velocidade escalar constante (m/s)"],enemContext:"Aplica-se em elevadores, esteiras industriais, guindastes e motores de carros. O ENEM ama relacionar potência útil com rendimento e eficiência energética. Lembre-se de que 1 HP ≈ 746 W e 1 kW = 1000 W.",triAnalysis:"Média",triDetails:"Interpretar as duas formas de potência (trabalho sobre tempo ou força vezes velocidade) exige bom raciocínio analítico. Questões envolvendo rendimento costumam ter classificação média-alta.",resolvedExample:{statement:"O motor elétrico de um elevador de carga aplica uma força vertical constante de 6000 N para erguer uma cabine de massa m com velocidade constante de 2,0 m/s. Qual a potência mecânica desenvolvida pelo motor em cavalos-vapor (CV)? Adote 1 CV ≈ 735 W.",solution:`1. Como a velocidade é constante, usar a fórmula de potência P = F · v.
2. Substituir os valores: P = 6000 N · 2,0 m/s = 12.000 Watts (W).
3. Converter a potência calculada para CV dividindo o valor por 735:
P_CV = 12.000 / 735 ≈ 16,3 CV.
Resposta final: A potência mecânica desenvolvida pelo motor é de aproximadamente 16,3 CV.`}},{id:"f-en-6",name:"Teorema da Energia Cinética (TEC)",expression:"τ_res = ΔE_c = E_cf - E_ci",description:"O trabalho da força resultante é igual à variação da energia cinética do corpo.",mnemonic:"O Trabalho total muda a Velocidade do corpo!",variables:["τ_res: Trabalho realizado pela força resultante (J - Joules)","ΔE_c: Variação da energia cinética total (J)","E_ci: Energia cinética inicial do corpo (J)","E_cf: Energia cinética final do corpo (J)"],enemContext:"Atalho matemático supremo para resolver problemas de mecânica sem precisar passar pela aceleração da segunda lei de Newton e equações de Torricelli. Pode ser usado para calcular a distância de frenagem de um carro sujeito a atrito ou o trabalho necessário para acelerar um projétil.",triAnalysis:"Média",triDetails:"Aplicar o TEC em problemas complexos com forças resistentes é muito valorizado. Um ponto crucial é lembrar que o trabalho resistente do atrito é negativo, o que faz a energia cinética diminuir.",resolvedExample:{statement:"Um ciclista e sua bicicleta de massa conjunta m = 80 kg movem-se a uma velocidade inicial de 10 m/s. Ele aciona os freios até parar completamente (v_final = 0). Determine o trabalho mecânico realizado pela força de atrito dos freios para realizar essa frenagem.",solution:`1. Calcular a energia cinética inicial: E_ci = m · v_inicial² / 2 = 80 · (10)² / 2 = 40 · 100 = 4000 Joules (J).
2. Calcular a energia cinética final (repouso): E_cf = 80 · (0)² / 2 = 0 J.
3. Aplicar o Teorema da Energia Cinética: τ_atrito = ΔE_c = E_cf - E_ci.
4. Substituir os valores: τ_atrito = 0 - 4000 = -4000 Joules (J).
Resposta final: O trabalho realizado pela força de atrito é de -4000 Joules (o sinal negativo confirma que a energia foi dissipada).`}},{id:"f-en-7",name:"Conservação da Energia Mecânica",expression:"E_m1 = E_m2  |  E_c1 + E_p1 = E_c2 + E_p2",description:"Em sistemas conservativos, a energia mecânica total permanece constante em qualquer ponto.",mnemonic:"Sistema Conservativo: Energia antes é Igual a depois!",variables:["E_m1, E_m2: Energia mecânica total nos pontos 1 e 2 (J - Joules)","E_c1, E_c2: Energia cinética nos pontos 1 e 2 (J)","E_p1, E_p2: Energia potencial (gravitacional ou elástica) nos pontos 1 e 2 (J)"],enemContext:"Base fundamental da física mecânica clássica. Aplica-se a sistemas livres de forças dissipativas (sem atrito ou resistência do ar). O ENEM ama montanhas-russas, pistas de skate (halfpipe), looping, pêndulos e objetos caindo de penhascos. Conforme o corpo desce, a energia potencial diminui enquanto a energia cinética aumenta de forma idêntica.",triAnalysis:"Média",triDetails:"Cálculos em sistemas conservativos são clássicos de nível médio. Quando o ENEM adiciona uma perda percentual de energia por atrito (ex: '20% da energia inicial é dissipada'), a questão torna-se difícil na TRI.",resolvedExample:{statement:"Um esqueitista parte do repouso do topo de uma rampa (ponto A) situada a uma altura vertical de 3,2 metros em relação à base plana lisa (ponto B). Desprezando totalmente qualquer força de atrito e a resistência do ar, calcule a velocidade do esqueitista ao atingir a base da rampa. Adote g = 10 m/s².",solution:`1. Como não há atrito, a energia mecânica se conserva: E_mA = E_mB.
2. No ponto A (repouso no topo), a energia é puramente potencial: E_mA = E_pg_A = m · g · h.
3. No ponto B (base, h = 0), a energia é puramente cinética: E_mB = E_cB = m · v_B² / 2.
4. Igualar as expressões: m · g · h = m · v_B² / 2.
5. Simplificar cancelando a massa m de ambos os lados: g · h = v_B² / 2 => v_B = √(2 · g · h).
6. Substituir os valores conhecidos: v_B = √(2 · 10 · 3,2) = √64 = 8,0 m/s.
Resposta final: A velocidade do esqueitista na base da rampa é de 8,0 m/s.`}},{id:"f-en-8",name:"Rendimento Mecânico (Eficiência)",expression:"η = P_util / P_total = E_util / E_total",description:"Razão entre a potência ou energia útil aproveitada e a potência ou energia total fornecida.",mnemonic:"Rendimento é o Útil dividido pelo Total!",variables:["η: Rendimento mecânico ou elétrico (adimensional, geralmente expresso em %)","P_util: Potência útil aproveitada pelo sistema (W - Watts)","P_total: Potência total consumida ou fornecida (W)","E_util: Energia útil aproveitada (J)","E_total: Energia total consumida (J)"],enemContext:"Conceito interdisciplinar com ecologia e sustentabilidade muito cobrado no ENEM. Motores reais nunca são 100% eficientes devido às perdas térmicas (atrito e calor dissipado). O rendimento mede a porcentagem de energia de entrada que realmente é convertida em trabalho útil.",triAnalysis:"Média",triDetails:"Entender que a potência total é a soma da potência útil com a potência dissipada (P_total = P_util + P_dissipada) e trabalhar com porcentagens no denominador é o principal causador de erros de cálculo na TRI.",resolvedExample:{statement:"Um motor de guindaste consome uma potência elétrica total de 5000 W da rede elétrica de uma obra. Sabendo que o guindaste realiza um trabalho útil de erguer cargas equivalente a 3500 W de potência mecânica, determine o rendimento desse motor e a potência dissipada na forma de calor.",solution:`1. Aplicar a fórmula do rendimento: η = P_util / P_total.
2. Substituir os valores: η = 3500 / 5000 = 0,70.
3. Expressar em porcentagem multiplicando por 100: η = 70%.
4. Calcular a potência dissipada em forma de calor: P_dissipada = P_total - P_util = 5000 - 3500 = 1500 W.
Resposta final: O rendimento do motor é de 70% e a potência dissipada é de 1500 W.`}}]},{name:"Termodinâmica",formulas:[{id:"f-term-1",name:"Conversão de Temperatura",expression:"θ_C / 5 = (θ_F - 32) / 9",description:"Relaciona as escalas de temperatura Celsius e Fahrenheit.",mnemonic:"Conversor Clássico de Clima!",variables:["θ_C: Temperatura em graus Celsius (°C)","θ_F: Temperatura em graus Fahrenheit (°F)","T_K: Temperatura absoluta em Kelvin (K), onde T_K = θ_C + 273"],enemContext:"No ENEM, as escalas de temperatura são frequentemente cobradas em contextos cotidianos (receitas de culinária importadas com forno em Fahrenheit, ou notícias internacionais). Lembre-se: a escala Kelvin é a escala absoluta do Sistema Internacional (SI) e seu zero absoluto (0 K) corresponde à ausência total de agitação molecular (-273,15 °C). Nunca diga 'graus Kelvin', apenas 'Kelvin'!",triAnalysis:"Fácil",triDetails:"Classificado como nível fácil por envolver apenas conversão direta de escalas e aritmética básica. O erro mais comum é confundir as fórmulas ou errar a ordem das operações (como somar/subtrair antes de fazer a divisão).",resolvedExample:{statement:"Uma receita culinária americana indica que um bolo deve ser assado a uma temperatura constante de 392 °F. Determine essa temperatura nas escalas Celsius (°C) e Kelvin (K).",solution:`1. Aplicar a fórmula de conversão de Celsius para Fahrenheit: θ_C / 5 = (θ_F - 32) / 9.
2. Substituir θ_F = 392: θ_C / 5 = (392 - 32) / 9 => θ_C / 5 = 360 / 9.
3. Resolver a fração: θ_C / 5 = 40 => θ_C = 40 · 5 = 200 °C.
4. Para obter em Kelvin, somar 273 ao valor em Celsius: T_K = θ_C + 273.
5. Substituir: T_K = 200 + 273 = 473 K.
Resposta final: A temperatura equivale a 200 °C ou 473 K.`}},{id:"f-term-2",name:"Equação dos Gases Ideais",expression:"p · V = n · R · T",description:"Associa pressão, volume, temperatura e número de mols de um gás ideal.",mnemonic:"Por Você, Nunca Rezei Tanto!",variables:["p: Pressão absoluta do gás (atm ou Pa)","V: Volume ocupado pelo gás (L ou m³)","n: Número de mols do gás (mol)","R: Constante universal dos gases ideais (0,082 atm·L/mol·K ou 8,31 J/mol·K)","T: Temperatura absoluta do gás obrigatoriamente em Kelvin (K)"],enemContext:"Extremamente comum na física e química do ENEM, sendo aplicada em balões meteorológicos, airbags, pneus de carros que aquecem na estrada, ou cilindros de oxigênio. O segredo de ouro: se a temperatura for dada em Celsius, converta imediatamente para Kelvin somando 273! Se a questão falar sobre uma transformação gasosa com quantidade constante de gás (n constante), use a lei geral: (p₁ · V₁) / T₁ = (p₂ · V₂) / T₂.",triAnalysis:"Média",triDetails:"É uma questão de nível médio devido à necessidade de compatibilidade entre as unidades das variáveis (ex: se R usa atm e Litros, a pressão deve estar em atm e o volume em Litros, e T sempre em Kelvin).",resolvedExample:{statement:"Um balão meteorológico contém 10 mols de gás hélio armazenados a uma temperatura de 27 °C sob pressão interna de 2,0 atm. Adotando a constante universal dos gases R = 0,082 atm·L/mol·K, qual é o volume aproximado em litros ocupado por esse gás?",solution:`1. Converter a temperatura de Celsius para Kelvin: T = 27 + 273 = 300 K.
2. Isolar o volume (V) na equação de Clapeyron: V = n · R · T / p.
3. Substituir os valores na fórmula: V = 10 · 0,082 · 300 / 2,0.
4. Calcular o numerador: 10 · 0,082 = 0,82; então 0,82 · 300 = 246.
5. Dividir pela pressão: V = 246 / 2,0 = 123 litros.
Resposta final: O volume aproximado ocupado pelo gás hélio no balão é de 123 litros.`}},{id:"f-term-3",name:"Primeira Lei da Termodinâmica",expression:"ΔU = Q - τ",description:"Conservação da energia: a variação de energia interna é o calor líquido menos o trabalho realizado.",mnemonic:"Quem recebe calor, Trabalha e muda por Dentro!",variables:["ΔU: Variação da energia interna do gás (J ou cal)","Q: Calor trocado com o meio externo (J ou cal)","τ: Trabalho mecânico realizado pelo ou sobre o gás (J ou cal)"],enemContext:`Esta lei é a tradução direta do princípio da conservação da energia para sistemas termodinâmicos. É a base de funcionamento de geladeiras, aparelhos de ar-condicionado e motores de combustão interna. Atenção absoluta aos sinais:
- Calor recebido (Q > 0) / Calor cedido (Q < 0);
- Gás realiza trabalho na expansão (τ > 0) / Gás sofre trabalho na compressão (τ < 0);
- Temperatura aumenta (ΔU > 0) / Temperatura diminui (ΔU < 0).`,triAnalysis:"Média",triDetails:"Questões conceituais ou de cálculo envolvendo a Primeira Lei são muito comuns e de nível médio. O calcanhar de Aquiles dos estudantes é a convenção de sinais do trabalho e do calor.",resolvedExample:{statement:"Durante uma transformação termodinâmica, um sistema gasoso ideal recebe 800 J de calor de uma fonte quente e realiza um trabalho de expansão de 500 J sobre o meio externo. Determine a variação da energia interna desse gás nesse processo.",solution:`1. Identificar os sinais de acordo com a convenção: como o gás recebe calor, Q = +800 J; como o gás realiza trabalho, τ = +500 J.
2. Aplicar a Primeira Lei da Termodinâmica: ΔU = Q - τ.
3. Substituir os valores: ΔU = 800 - 500 = +300 Joules (J).
Resposta final: A energia interna do gás aumentou em 300 Joules (indicando também uma elevação em sua temperatura).`}},{id:"f-term-4",name:"Calor Sensível",expression:"Q = m · c · Δθ",description:"Quantidade de calor necessária para alterar a temperatura de um corpo sem mudar seu estado.",mnemonic:"Qui Macete! Q = m-c-delta-t!",variables:["Q: Quantidade de calor sensível trocada (cal ou J)","m: Massa da substância (g ou kg)","c: Calor específico do material (cal/g·°C ou J/kg·K)","Δθ: Variação de temperatura sofrida (°C ou K)"],enemContext:"O ENEM ama relacionar calor sensível com a 'brisa marítima' (areia e água do mar têm calores específicos muito diferentes), aquecedores solares de água, ou resfriamento de motores. Lembrar que quanto maior o calor específico (c) de um material (como a água, c = 1,0 cal/g·°C), mais energia ele precisa ganhar ou perder para sofrer uma alteração em sua temperatura!",triAnalysis:"Fácil",triDetails:"Muito frequente e de nível fácil-médio. Erros comuns estão ligados a não converter unidades (ex: usar massa em kg quando o calor específico está em g, ou confundir calorias com Joules sabendo que 1 cal ≈ 4 J).",resolvedExample:{statement:"Um aquecedor solar eleva a temperatura de m = 2,0 kg (2000 g) de água pura de 20 °C para 70 °C em poucos minutos. Sabendo que o calor específico da água é de 1,0 cal/g·°C, calcule a quantidade de calor em quilocalorias (kcal) absorvida pela água.",solution:`1. Identificar as variáveis: m = 2000 g, c = 1,0 cal/g·°C, Δθ = θ_f - θ_i = 70 - 20 = 50 °C.
2. Aplicar a fórmula do calor sensível: Q = m · c · Δθ.
3. Substituir os valores: Q = 2000 · 1,0 · 50 = 100.000 calorias (cal).
4. Converter calorias para quilocalorias dividindo por 1000: Q = 100 kcal.
Resposta final: A quantidade de calor absorvida pela água é de 100 kcal.`}},{id:"f-term-5",name:"Calor Latente",expression:"Q = m · L",description:"Quantidade de calor necessária para mudar o estado físico de um corpo sob temperatura constante.",mnemonic:"Quem Mela! Q = m · L",variables:["Q: Quantidade de calor latente trocada na mudança de fase (cal ou J)","m: Massa da substância que muda de estado (g ou kg)","L: Calor latente específico de transição (cal/g ou J/kg)"],enemContext:"Presente na evapotranspiração de plantas (resfriamento das folhas), suor humano evaporando para resfriar o corpo, degelo de calotas polares, ou ciclos de refrigeração industrial. O aspecto crucial no ENEM: durante a mudança de estado físico de uma substância pura sob pressão constante, a sua temperatura permanece RIGOROSAMENTE CONSTANTE, pois toda a energia recebida ou doada é gasta no rearranjo das ligações intermoleculares!",triAnalysis:"Fácil",triDetails:"Classificado como fácil se cobrado de forma direta. Pode tornar-se médio quando acoplado ao calor sensível em gráficos de aquecimento (curvas de aquecimento/resfriamento).",resolvedExample:{statement:"Determine a quantidade mínima de calor, em calorias, necessária para fundir completamente um bloco de gelo de massa m = 500 g inicialmente a 0 °C (temperatura de fusão). Dado: Calor latente de fusão do gelo L_f = 80 cal/g.",solution:`1. Como o gelo já está na temperatura de fusão (0 °C), não há variação de temperatura, apenas mudança de fase. Usar a fórmula do calor latente: Q = m · L.
2. Substituir os valores conhecidos: Q = 500 · 80 = 40.000 calorias (cal).
3. Opcional: expressar em kcal dividindo por 1000: Q = 40 kcal.
Resposta final: São necessárias 40.000 calorias (ou 40 kcal) para derreter todo o gelo.`}},{id:"f-term-6",name:"Trabalho de um Gás",expression:"τ = p · ΔV",description:"Trabalho mecânico realizado por ou sobre um gás sob pressão constante.",mnemonic:"Trabalho Pressão-Volume!",variables:["τ: Trabalho mecânico realizado pelo ou sobre o gás (J)","p: Pressão constante do gás durante o processo (Pa ou N/m²)","ΔV: Variação do volume ocupado (V_final - V_inicial) (m³)"],enemContext:"O ENEM adora contextualizar o trabalho de expansão com pistões de motores a combustão interna (ciclo Otto) ou bombas pneumáticas. Se o gás expande (ΔV > 0), o trabalho é realizado pelo gás (τ positivo, o gás gasta sua energia interna para empurrar as paredes do recipiente). Se o gás comprime (ΔV < 0), o trabalho é realizado sobre o gás por um agente externo (τ negativo, o gás ganha energia).",triAnalysis:"Média",triDetails:"A aplicação da fórmula exige cuidado com as unidades do Sistema Internacional (SI): pressão em Pascal (Pa) e volume em metros cúbicos (m³). Lembrar também que, se a transformação não for isobárica (pressão variável), o trabalho é obtido pela Área sob a curva no gráfico Pressão vs Volume!",resolvedExample:{statement:"Um gás sob pressão constante de 2,0 · 10⁵ Pa sofre um aquecimento que provoca sua expansão, fazendo seu volume aumentar de 4,0 L para 6,0 L. Sabendo que 1 L = 10⁻³ m³, calcule o trabalho realizado pelo gás nessa expansão isobárica.",solution:`1. Calcular a variação de volume: ΔV = V_final - V_inicial = 6,0 - 4,0 = 2,0 L.
2. Converter a variação de volume para metros cúbicos: ΔV = 2,0 · 10⁻³ m³.
3. Aplicar a fórmula do trabalho: τ = p · ΔV.
4. Substituir os valores: τ = (2,0 · 10⁵) · (2,0 · 10⁻³) = 4,0 · 10² = 400 Joules (J).
