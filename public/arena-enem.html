O comprimento real físico dessa importante avenida paulistana, expresso em quilômetros (km), equivale a:`,options:[{key:"A",text:"6 km"},{key:"B",text:"60 km"},{key:"C",text:"0,6 km"},{key:"D",text:"600 km"},{key:"E",text:"6.000 km"}],correctKey:"A",reason:"Na escala 1:50.000, 1 cm no mapa equivale a 50.000 cm reais. Multiplicando 12 cm por 50.000, obtém-se 600.000 cm reais. Convertendo de cm para metros dividimos por 100 (6.000 m) e para km dividimos por 1.000, resultando em 6 km.",trapDetails:"A alternativa B é o distrator numérico padrão, punindo alunos que cometem erros de ordem de grandeza ao esquecer que 1 quilômetro possui exatamente 100.000 centímetros.",gateTrigger:"CONVERSÃO DE UNIDADES DE ESCALA"},{id:"en-q-16",year:"ENEM 2019",title:"Questão 16 (Biologia - Organelas e Secreção Celular)",text:`Uma linhagem celular pancreática especializada na síntese de hormônios polipeptídicos de exportação (como o hormônio insulina) apresenta organelas membranasas extremamente desenvolvidas para realizar a tradução e posterior secreção glandular para a corrente sanguínea.

As organelas celulares responsáveis pela síntese ativa de proteínas de exportação e pelo empacotamento em vesículas secretoras são, respectivamente, o:`,options:[{key:"A",text:"lisossomo secundário e o peroxissomo desintoxicante."},{key:"B",text:"retículo endoplasmático rugoso e o complexo de Golgi."},{key:"C",text:"ribossomo citoplasmático livre e o cloroplasto vegetal."},{key:"D",text:"centríolo microtubular e o citoesqueleto proteico ativo."},{key:"E",text:"vacúolo digestivo e a mitocôndria metabólica energética."}],correctKey:"B",reason:"O retículo endoplasmático rugoso (RER) possui ribossomos aderidos que sintetizam proteínas destinadas ao meio extracelular. Essas proteínas migram para o complexo de Golgi, onde são processadas químicamente, concentradas e empacotadas em vesículas de secreção.",trapDetails:"A alternativa A refere-se a organelas envolvidas na digestão intracelular (quebra enzimática de moléculas orgânicas), confundindo o estudante com o prefixo 'proteínas'.",gateTrigger:"SÍNTESE E SECREÇÃO PROTEICA RER-GOLGI"},{id:"en-q-17",year:"ENEM 2023",title:"Questão 17 (Física - Ondulatória e Efeito Doppler)",text:`Uma ambulância trafega em uma via reta com a sirene ligada em frequências constantes. Um observador parado na calçada percebe o som da sirene nitidamente mais agudo enquanto o veículo se aproxima dele e nitidamente mais grave à medida que o veículo ultrapassa e se afasta.

A mudança na altura sonora percebida pelo observador em repouso deve-se ao fenômeno físico denominado:`,options:[{key:"A",text:"Difração de ondas esféricas sonoras."},{key:"B",text:"Interferência acústica construtiva."},{key:"C",text:"Efeito Doppler devido ao movimento relativo da fonte."},{key:"D",text:"Polarização eletromagnética da onda de som."},{key:"E",text:"Ressonância forçada mecânica do tímpano."}],correctKey:"C",reason:"O Efeito Doppler é a alteração aparente da frequência de uma onda percebida por um observador devido ao movimento relativo entre ele e a fonte emissora. Na aproximação, as frentes de onda se comprimem (frequência aumenta: agudo); no afastamento, se espalham (frequência diminui: grave).",trapDetails:"A alternativa E apela para o senso comum de que o ouvido simplesmente 'vibra' com a intensidade, confundindo a altura física (frequência em Hertz) com intensidade ou volume do som.",gateTrigger:"VARIAÇÃO DE FREQUÊNCIA PERCEBIDA DOPPLER"},{id:"en-q-18",year:"ENEM 2021",title:"Questão 18 (Química - Eletroquímica e Pilhas Padrão)",text:`Uma cela galvânica padrão é construída utilizando-se um eletrodo de cobre (semicélula Cu²⁺/Cu, Eº = +0,34 V) imerso em solução ácida e um eletrodo de zinco (semicélula Zn²⁺/Zn, Eº = -0,76 V) imerso em solução salina. Uma ponte salina interliga as semicélulas.

Com base nos potenciais padrão de redução informados, os polos eletroquímicos (anodo e catodo) e o sentido espontâneo de migração dos elétrons são:`,options:[{key:"A",text:"Anodo: cobre; Catodo: zinco; Elétrons migram do cobre para o zinco."},{key:"B",text:"Anodo: zinco; Catodo: cobre; Elétrons migram do zinco para o cobre."},{key:"C",text:"Anodo: zinco; Catodo: cobre; Elétrons migram do cobre para o zinco."},{key:"D",text:"Anodo: cobre; Catodo: zinco; Elétrons migram do zinco para o cobre."},{key:"E",text:"Ambos atuam como catodos reversíveis de fluxo alternado iônico."}],correctKey:"B",reason:"O zinco possui o menor potencial de redução (Eº = -0,76 V), atuando como o agente redutor que oxida (Anodo, polo negativo). O cobre possui o maior potencial de redução (Eº = +0,34 V), reduzindo (Catodo, polo positivo). Os elétrons fluem do anodo (zinco) para o catodo (cobre).",trapDetails:"A alternativa C confunde o sentido de migração de cargas, induzindo o estudante a achar que os elétrons, que possuem carga negativa, seriam empurrados espontaneamente por quem recebe elétrons.",gateTrigger:"ANODO OXIDA E ENVIA ELÉTRONS"},{id:"en-q-19",year:"ENEM 2018",title:"Questão 19 (História - Café e Transição de Trabalho no Império)",text:`Durante a segunda metade do século XIX no Brasil, a expansão acelerada da cultura cafeeira no Oeste Paulista gerou excedentes de capitais comerciais que impulsionaram ferrovias e urbanização, paralelamente à proibição britânica do comércio negreiro transatlântico.

A medida jurídica que pôs fim ao tráfico de escravizados no Brasil, alterando as dinâmicas de capitais para imigração europeia, foi a:`,options:[{key:"A",text:"Lei de Terras de 1850."},{key:"B",text:"Lei Eusébio de Queirós de 1850."},{key:"C",text:"Lei do Ventre Livre de 1871."},{key:"D",text:"Lei dos Sexagenários de 1885."},{key:"E",text:"Lei Áurea de 1888."}],correctKey:"B",reason:"A Lei Eusébio de Queirós (1850) aboliu o tráfico negreiro internacional no Brasil. Com o encerramento do tráfico, vultosos capitais antes imobilizados na compra de escravizados africanos foram redirecionados para investimentos em ferrovias e manufaturas, além de induzir as políticas de colonização e imigração assalariada europeia.",trapDetails:"A alternativa A é um forte distrator por referir-se a uma lei importante promulgada no mesmo ano (1850), que, contudo, regulava o regime jurídico de compra de terras públicas, inviabilizando o acesso à terra a ex-escravizados e imigrantes pobres.",gateTrigger:"FIM DO TRÁFICO E CAPITAIS CAFEIROS"},{id:"en-q-20",year:"ENEM 2022",title:"Questão 20 (Literatura - Rupturas do Realismo)",text:`"Não conto a minha vida como um herói romântico que chora sob o luar por uma donzela idealizada e inacessível. Narro as minhas misérias cotidianas, a minha hipocrisia burguesa e o vazio existencial sob a ótica analítica de um defunto autor."

A postura literária expressa no fragmento ilustra a ruptura estética que inaugurou o movimento literário do(a):`,options:[{key:"A",text:"Romantismo subjetivo, aprofundando o sentimentalismo lírico idealizado."},{key:"B",text:"Realismo de Machado de Assis, rompendo com as ilusões sentimentais burguesas."},{key:"C",text:"Modernismo nacionalista, focado nas manifestações folclóricas indígenas."},{key:"D",text:"Barroco jesuítico contra-reformista, centrado no temor da punição divina."},{key:"E",text:"Parnasianismo poético clássico, centrado no rigor de rimas ricas e métricas fixas."}],correctKey:"B",reason:"O Realismo no Brasil foi inaugurado em 1881 com a publicação de 'Memórias Póstumas de Brás Cubas' de Machado de Assis. A obra utiliza a ironia fina e o distanciamento irônico de um narrador morto para ridicularizar e expor as fraquezas, vaidades e preconceitos da sociedade burguesa oitocentista brasileira.",trapDetails:"A alternativa A atrai candidatos que leem superficialmente a palavra 'romântico' no text, sem perceber que o trecho é uma negação direta da idealização romântica das gerações literárias anteriores.",gateTrigger:"IRONIA E DESILUSÃO REALISTA MACHADIANA"},{id:"en-q-21",year:"ENEM 2020",title:"Questão 21 (Matemática - Geometria e Otimização Quadrática)",text:`Um fazendeiro dispõe de 100 metros de cerca linear para construir um galpão retangular para ovelhas. Ele utilizará um longo muro reto de alvenaria pré-existente como um dos lados desse retângulo, precisando cercar apenas as três faces restantes.

A área máxima que o fazendeiro conseguirá cercar para o galpão retangular, em metros quadrados, equivale a:`,options:[{key:"A",text:"625 m²"},{key:"B",text:"1.250 m²"},{key:"C",text:"2.500 m²"},{key:"D",text:"500 m²"},{key:"E",text:"1.000 m²"}],correctKey:"B",reason:"Sendo x a largura das duas laterais perpendiculares ao muro e y o comprimento paralelo ao muro, temos 2x + y = 100 => y = 100 - 2x. A área A é expressa por A(x) = x * (100 - 2x) = -2x² + 100x. O vértice da função quadrática que dá a área máxima ocorre em x = -b/(2a) = 25m. Portanto, y = 50m, gerando uma área máxima de 25 * 50 = 1.250 m².",trapDetails:"A alternativa A é o distrator mais clássico de geometria do ENEM, onde o estudante supõe apressadamente que a área retangular de perímetro fixado é sempre maximizada no formato quadrado de quatro lados iguais (25m x 25m = 625 m²).",gateTrigger:"MODELAGEM QUADRÁTICA DE ÁREA MÁXIMA"},{id:"en-q-22",year:"ENEM 2019",title:"Questão 22 (Biologia - Genética e Sistemas Sanguíneos)",text:`Um homem com tipo sanguíneo A negativo (genótipo portador do alelo recessivo 'i') casa-se com uma mulher tipo B positivo cujo pai biológico possuía tipo sanguíneo O negativo. O casal planeja ter o primeiro filho.

A probabilidade de esse filho nascer com o fenótipo sanguíneo O negativo (O Rh-) equivale a:`,options:[{key:"A",text:"100%"},{key:"B",text:"50%"},{key:"C",text:"25%"},{key:"D",text:"12,5%"},{key:"E",text:"0%"}],correctKey:"D",reason:"O pai tem genótipo I^A i rr. A mãe é B+ (I^B _ R_), mas seu pai O- (ii rr) legou obrigatoriamente os alelos recessivos 'i' e 'r', determinando o genótipo materno I^B i Rr. O cruzamento entre heterozigotos gera 1/4 de chance para o grupo O (ii) e 1/2 para o fator Rh negativo (rr), resultando na probabilidade conjunta de 1/4 * 1/2 = 1/8, que equivale a 12,5%.",trapDetails:"A alternativa C induz ao erro o aluno que se esquece de analisar o fator Rh de forma independente da tipagem ABO, ou que desconsidera as informações sobre o avô materno para definir a heterozigose da mãe.",gateTrigger:"SEGREGAÇÃO INDEPENDENTE E HETEROZIGOSE"},{id:"en-q-23",year:"ENEM 2021",title:"Questão 23 (Física - Termologia e Inércia Térmica)",text:`Em laboratório, dois recipientes abertos recebem volumes idênticos de 1 kg de água destilada (calor específico c_água = 1,0 cal/gºC) e 1 kg de óleo vegetal (calor específico c_óleo = 0,5 cal/gºC). Ambos iniciam a uma temperatura estável de 20ºC e são aquecidos por fontes térmicas idênticas com fornecimento estável de calor.

Após receberem exatamente a mesma quantidade total de energia térmica, qual dos líquidos registrará a maior temperatura e por quê?`,options:[{key:"A",text:"A água, porque sua alta densidade evita que a energia escape por convecção mecânica."},{key:"B",text:"O óleo, porque seu calor específico menor exige menos energia para elevar sua temperatura."},{key:"C",text:"Ambos terão o mesmo aquecimento, visto que massas e energias recebidas são idênticas."},{key:"D",text:"A água, visto que sua elevada inércia térmica acelera a absorção de radiação infravermelha."},{key:"E",text:"O óleo, exclusivamente porque sua temperatura de ebulição química é menor que a da água."}],correctKey:"B",reason:"O calor específico é a quantidade de calor que 1 grama de substância necessita para elevar sua temperatura em 1ºC. Como o óleo possui metade do calor específico da água (0,5 cal/gºC), o mesmo fornecimento de energia produzirá nele o dobro da variação de temperatura em relação à água (Q = m*c*ΔT).",trapDetails:"A alternativa D tenta ludibriar o estudante fazendo-o acreditar que um alto calor específico 'acelera' o aquecimento, quando conceitualmente o calor específico atua como uma 'inércia térmica' (dificulta a variação de temperatura).",gateTrigger:"CALOR ESPECÍFICO E INÉRCIA TÉRMICA"},{id:"en-q-24",year:"ENEM 2017",title:"Questão 24 (Química - Isomeria Constitucional Plana)",text:`O éter dimetílico (um gás inflamável em condições ambientes) e o etanol (líquido volátil combustível) apresentam propriedades físicas e aplicações industriais totalmente distintas. Entretanto, ambos apresentam a mesma fórmula molecular idêntica: C2H6O.

Esse par de compostos químicos ilustra um clássico caso de isomeria plana do tipo:`,options:[{key:"A",text:"Isomeria de cadeia, diferenciando-se pela presença de ramificações."},{key:"B",text:"Isomeria de posição, pela mudança de localização de um heteroátomo."},{key:"C",text:"Isomeria de função, pois pertencem a diferentes famílias orgânicas."},{key:"D",text:"Metameria, em razão da compensação de carbonos em posições simétricas."},{key:"E",text:"Tautomeria ceto-enólica, gerada por equilíbrio dinâmico próton-elétron."}],correctKey:"C",reason:"Isômeros constitucionais planos de função possuem a mesma fórmula molecular mas pertencem a grupos funcionais químicos diferentes. No caso apresentado, o éter dimetílico pertence à função Éter (R-O-R), enquanto o etanol pertence à função Álcool (R-OH).",trapDetails:"A alternativa B induz o aluno a crer que se trata apenas de mudar a posição do oxigênio (heteroátomo), porém a modificação altera a própria estrutura conectiva da hidroxila, mudando a classificação funcional orgânica.",gateTrigger:"ISOMERIA PLANA DE FUNÇÃO"},{id:"en-q-25",year:"ENEM 2023",title:"Questão 25 (Geografia - Climatologia e Aquecimento Global)",text:`"As intensas queimadas agropecuárias levadas a cabo na região da Amazônia e do Cerrado lançam bilhões de toneladas de CO2 e CH4 na atmosfera. Esses gases acumulam-se no envelope gasoso terrestre, absorvendo radiação térmica infravermelha emitida pela crosta e atrasando sua dissipação para o espaço."

O processo descrito no fragmento corresponde à intensificação antrópica direta do:`,options:[{key:"A",text:"fenômeno de chuva ácida nos grandes centros urbanos florestais."},{key:"B",text:"efeito estufa natural, contribuindo com a crise do aquecimento global."},{key:"C",text:"resfriamento global repentino por retenção de partículas de aerossol."},{key:"D",text:"buraco físico na camada protetora de ozônio estratosférico."},{key:"E",text:"fenômeno meteorológico El Niño por aquecimento do mar Atlântico."}],correctKey:"B",reason:"O efeito estufa é um mecanismo natural benéfico que mantém a Terra aquecida. No entanto, a queima de florestas e combustíveis fósseis libera gases de efeito estufa (GEEs) que aprisionam calor excessivo em forma de radiação infravermelha na troposfera, elevando artificialmente as temperaturas globais.",trapDetails:"A alternativa D é um erro recorrente no qual o estudante confunde o aquecimento global (retenção de calor infravermelho por gases como CO2) com a destruição da camada de ozônio (destruição do gás O3 por gases CFCs, permitindo a entrada de raios UV nocivos).",gateTrigger:"CALOR INFRAVERMELHO E EFEITO ESTUFA"},{id:"en-q-26",year:"ENEM 2016",title:"Questão 26 (Filosofia - Kant e o Esclarecimento)",text:`"Esclarecimento é a saída do homem de sua menoridade, da qual ele próprio é culpado. A menoridade é a incapacidade de fazer uso de seu próprio entendimento sem la tutela de outro. Sapere Aude! Tem a coragem de te servir de teu próprio entendimento!" (KANT, I. Resposta à pergunta: O que é o Esclarecimento?, 1784).

No fragmento citado, o filósofo Immanuel Kant sustenta que a menoridade intelectual humana deve-se primordialmente à:`,options:[{key:"A",text:"indisponibilidade histórica de sistemas públicos universais de ensino básico."},{key:"B",text:"comodidade moral e falta de coragem do indivíduo de pensar de forma autônoma."},{key:"C",text:"repressão violenta jurídica e inquisitorial por parte das cortes europeias."},{key:"D",text:"limitação estritamente cognitiva genética característica de minorias sociais."},{key:"E",text:"necessidade teológica escolástica de obediência irrestrita aos dogmas gregos."}],correctKey:"B",reason:"Para Kant, o Esclarecimento (Aufklärung) depende da atitude crítica ativa. A menoridade não é fruto de insuficiência cognitiva real, mas sim de preguiça e de uma covardia existencial que leva o indivíduo a aceitar passivamente que outras instâncias e tutores pensem por ele.",trapDetails:"A alternativa C induz ao erro ao atribuir a menoridade apenas a uma causa externa coercitiva (leis, repressão), mascarando o foco de Kant na responsabilidade interna do próprio sujeito ('da qual ele próprio é culpado').",gateTrigger:"AUTONOMIA DO ENTENDIMENTO (SAPERE AUDE)"},{id:"en-q-27",year:"ENEM 2015",title:"Questão 27 (História - O Tratado de Methuen de 1703)",text:`O Tratado de Methuen (1703), apelidado de 'Panos e Vinhos', estabeleceu acordos comerciais bilaterais entre Portugal e Inglaterra: os britânicos concediam tarifas vantajosas para a importação de vinhos lusos, enquanto Portugal franqueava seu mercado para a entrada sem impostos dos tecidos manufaturados ingleses.

Para a colônia do Brasil, a principal consequência de longo prazo desse pacto econômico luso-inglês foi o(a):`,options:[{key:"A",text:"desenvolvimento de manufaturas manufatureiras têxteis de algodão em Salvador."},{key:"B",text:"escoamento do ouro extraído em Minas Gerais para pagar os déficits comerciais com a Inglaterra."},{key:"C",text:"fortalecimento geopolítico da esquadra de Portugal contra corsários espanhóis."},{key:"D",text:"decréscimo acentuado da importação de escravizados no porto do Rio de Janeiro."},{key:"E",text:"industrialização de infraestruturas pesadas agrícolas na capitania paulista."}],correctKey:"B",reason:"Como Portugal importava tecidos manufaturados de alto valor agregado da Inglaterra em volumes superiores aos vinhos que conseguia exportar, a balança comercial portuguesa acumulou gigantescos saldos deficitários. Esse déficit foi saldado transferindo-se o ouro extraído das minas de ouro do Brasil Colônia diretamente para os bancos de Londres.",trapDetails:"A alternativa A sugere que o acordo estimulou indústrias na colônia, contudo o efeito foi inverso: o monopólio mercantil das manufaturas inglesas sufocou qualquer iniciativa industrial tanto no Brasil quanto na metrópole portuguesa.",gateTrigger:"PANOS E VINHOS E O FLUXO DO OURO"},{id:"en-q-28",year:"ENEM 2022",title:"Questão 28 (Linguagens - Função Apelativa ou Conativa)",text:`"Atenção, jovem eleitor! Não abra mão do seu poder de escolha democrática. Acesse o portal oficial da justiça eleitoral, tire o seu título de eleitor online e ajude a desenhar o futuro da sua cidade. O seu voto faz toda a diferença!"

O anúncio institucional de utilidade pública exposto emprega uma linguagem que faz prevalecer a função:`,options:[{key:"A",text:"poética, valorizando rimas estilizadas e musicalidade fonética abstrata."},{key:"B",text:"metalinguística, na qual a linguagem analisa o próprio jargão eleitoral."},{key:"C",text:"apelativa ou conativa, que almeja orientar e persuadir o comportamento do interlocutor."},{key:"D",text:"fática, cuja função básica restringe-se a checar a recepção física do canal."},{key:"E",text:"referencial pura, apresentando termos estritamente estatísticos sem vocativos."}],correctKey:"C",reason:"A função apelativa (ou conativa) da linguagem centra-se no destinatário/receptor. Ela se manifesta através do uso de verbos no imperativo ('Acesse', 'tire', 'ajude'), vocativos diretos ('jovem eleitor') e pronomes de tratamento de segunda pessoa, visando convencer o público-alvo a realizar uma ação determinada.",trapDetails:"A alternativa E atrai alunos que confundem anúncios informativos governamentais com a função estritamente referencial, omitindo que o foco sintático imperativo visa prescrever condutas e não apenas expor dados factuais neutros.",gateTrigger:"IMPERATIVOS E INFLUÊNCIA NO RECEPTOR"},{id:"en-q-29",year:"ENEM 2023",title:"Questão 29 (Matemática - Probabilidade de Eventos)",text:`Um estudante precisa responder a duas arguições acadêmicas independentes de múltipla escolha. A probabilidade de ele acertar a primeira pergunta de Cardiologia é de 80% (0,8), e a probabilidade de ele acertar a segunda de Neurologia é de 60% (0,6).

A probabilidade matemática de o aluno acertar exatamente apenas uma das duas perguntas propostas equivale a:`,options:[{key:"A",text:"48%"},{key:"B",text:"14%"},{key:"C",text:"44%"},{key:"D",text:"92%"},{key:"E",text:"50%"}],correctKey:"C",reason:"Existem dois cenários exclusivos para acertar exatamente uma questão: (I) Acertar Cardiologia e errar Neurologia: 0,8 * 0,4 = 0,32. (II) Errar Cardiologia e acertar Neurologia: 0,2 * 0,6 = 0,12. Somando as probabilidades de ambos os eventos mutuamente excludentes: 0,32 + 0,12 = 0,44 ou 44%.",trapDetails:"A alternativa A é o erro mais grave cometível: multiplicar 0,8 * 0,6 diretamente (48%), o que calcula a probabilidade do evento conjunto de acertar AMBAS as questões ao mesmo tempo.",gateTrigger:"PROBABILIDADE DA UNIÃO DE EXCLUSIVOS"},{id:"en-q-30",year:"ENEM 2014",title:"Questão 30 (Biologia - Teorias Evolucionistas)",text:`"As mudanças introduzidas no ecossistema de uma ilha vulcânica forçaram aves terrestres a esticar as pernas constantemente para andar em pântanos profundos. De tanto serem usadas, as pernas das aves alongaram-se ao longo da vida e essa nova característica física foi transmitida diretamente aos filhotes."

A explicação citada fundamenta-se nos princípios evolutivos postulados por:`,options:[{key:"A",text:"Charles Darwin, com base na seleção natural dos indivíduos mais aptos."},{key:"B",text:"Gregor Mendel, fundamentando o cruzamento de alelos recessivos autossômicos."},{key:"C",text:"Jean-Baptiste Lamarck, baseado no uso e desuso e herança de caracteres adquiridos."},{key:"D",text:"Thomas Malthus, baseado nos limites geométricos de subsistência de recursos."},{key:"E",text:"Hugo de Vries, introduzindo o papel de mutações aleatórias no código de DNA."}],correctKey:"C",reason:"A teoria evolutiva de Lamarck apoia-se em duas leis: a do Uso e Desuso (o uso hipertrofia e o desuso atrofia estruturas corporais) e a da Herança dos Caracteres Adquiridos (modificações anatômicas decorrentes do esforço de adaptação ao meio em vida são herdadas pela descendência).",trapDetails:"A alternativa A confunde candidatos que atribuem toda e qualquer menção a evolução biológica a Charles Darwin, que na verdade refutava a ideia de modificações induzidas diretamente pelo esforço e explicava o processo pela seleção de variedades pré-existentes.",gateTrigger:"USO/DESUSO E CARACTERES ADQUIRIDOS"},{id:"en-q-31",year:"ENEM 2018",title:"Questão 31 (Física - Óptica Geométrica e Retrovisores)",text:`Um motorista de ônibus urbano precisa instalar um novo espelho retrovisor externo que ofereça o maior campo de visão lateral possível para monitorar ciclistas e pedestres adjacentes à carroceria, aceitando o fato de que as imagens desses elementos aparecerão reduzidas em tamanho.

Para atender a essa especificação física de segurança veicular, o tipo de espelho que deve ser adquirido é o:`,options:[{key:"A",text:"Espelho plano clássico, por reproduzir fielmente tamanhos e posições espaciais."},{key:"B",text:"Espelho côncavo com o observador posicionado no centro óptico primário."},{key:"C",text:"Espelho convexo, que forma imagens menores e virtuais, ampliando o campo visual útil."},{key:"D",text:"Espelho côncavo com o observador situado entre o foco e o vértice de refração."},{key:"E",text:"Espelho cilíndrico asférico de faces côncavas sobrepostas lineares."}],correctKey:"C",reason:"Os espelhos convexos divergem os raios luminosos incidentes, o que permite focalizar um campo visual angular muito maior e concentrá-lo na retina. As imagens produzidas são sempre virtuais, diretas e menores que os objetos reais.",trapDetails:"A alternativa D confunde ao citar o espelho côncavo agindo como lente de aumento (quando o objeto está entre o foco e o vértice), o que reduziria drasticamente o campo visual global e causaria inversão de imagens distantes.",gateTrigger:"AMPLIAÇÃO DO CAMPO VISUAL CONVEXO"},{id:"en-q-32",year:"ENEM 2022",title:"Questão 32 (Química - Reações de Neutralização e pH)",text:`Um técnico derramou acidentalmente uma solução concentrada de ácido clorídrico (HCl) de pH muito baixo sobre o piso de granito do laboratório. Para neutralizar o ácido de maneira rápida e segura sem provocar reações exotérmicas violentas ou danos severos de corrosão, ele deve espalhar uma substância de caráter básico.

A substância recomendada para conter o derrame do ácido de forma segura no laboratório é o(a):`,options:[{key:"A",text:"vinagre comercial (solução aquosa de ácido acético)."},{key:"B",text:"suco de limão concentrado, rico em ácido cítrico saturado."},{key:"C",text:"cloreto de sódio (sal de cozinha purificado seco)."},{key:"D",text:"bicarbonato de sódio (NaHCO3), sal que sofre hidrólise alcalina suave."},{key:"E",text:"álcool isopropílico absoluto com desinfetante volátil."}],correctKey:"D",reason:"O bicarbonato de sódio (NaHCO3) é um sal de caráter básico decorrente de hidrólise alcalina fraca. Ele reage prontamente com o HCl em uma reação de neutralização gerando gás carbônico (CO2), água (H2O) e cloreto de sódio (sal neutro), contendo a acidez sem riscos corrosivos adicionais.",trapDetails:"As alternativas A e B são ácidos (ácido acético e ácido cítrico). Adicioná-los aumentaria ainda mais a acidez do meio e espalharia a contaminação, revelando falta de domínio conceitual sobre a escala de pH.",gateTrigger:"NEUTRALIZAÇÃO COM SAL DE HIDRÓLISE ALCALINA"},{id:"en-q-33",year:"ENEM 2019",title:"Questão 33 (Geografia - Processos Urbanos e Segregação)",text:`"A requalificação estética de antigas áreas industriais degradadas ou casarões históricos portuários atrai grandes incorporadoras, que constroem condomínios de luxo e estabelecimentos sofisticados. Esse influxo encarece os custos de moradia, inviabilizando a permanência de moradores locais de baixa renda."

O processo socioespacial contemporâneo de elitização e exclusão residencial descrito é conhecido como:`,options:[{key:"A",text:"Conurbação metropolitana rápida."},{key:"B",text:"Gentrificação urbana."},{key:"C",text:"Metropolização periférica concentrada."},{key:"D",text:"Segregação residencial planejada pelo governo estatal."},{key:"E",text:"Êxodo de retorno rural voluntário inverso."}],correctKey:"B",reason:"A gentrificação é um fenômeno socioespacial caracterizado pela valorização imobiliária abrupta e intervenção urbanística em bairros tradicionalmente ocupados por classes populares. Esse processo atrai comércio nobre e classes mais abastadas, forçando a expulsão silenciosa dos antigos moradores de menor poder de renda.",trapDetails:"A alternativa A é um erro muito comum de terminologia, mas conurbação refere-se exclusivamente ao crescimento físico horizontal que une as franjas geográficas de duas ou mais municipalidades limítrofes.",gateTrigger:"GENTRIFICAÇÃO E EXCLUSÃO SOCIOESPACIAL"},{id:"en-q-34",year:"ENEM 2017",title:"Questão 34 (História - O Feudalismo e Obrigações Servis)",text:`Na estrutura econômica do Feudalismo na Europa Ocidental, a posse da terra concentrava-se nas mãos do clero e da nobreza militar. A força de trabalho apoiava-se na servidão, onde as famílias de camponeses ficavam atadas ao solo e deviam obrigações consuetudinárias estritas ao senhor feudal.

As obrigações feudais designadas como corveia e talha consistiam, respectivamente, no(a):`,options:[{key:"A",text:"pagamento de impostos à Igreja Católica e prestação de assessoria militar nas cruzadas."},{key:"B",text:"trabalho gratuito obrigatório nas terras do senhor (manso senhorial) e entrega de parte das colheitas camponesas."},{key:"C",text:"taxação pelo uso das infraestruturas do feudo (fornos) e imposto sobre herdeiros legítimos de servos mortos."},{key:"D",text:"tributação para manter a guarda de pontes e dotes matrimoniais."},{key:"E",text:"contribuição compulsória em moedas para feiras comerciais e prestação de serviços domésticos no castelo."}],correctKey:"B",reason:"A corveia era a obrigação do servo de trabalhar de forma gratuita alguns dias da semana no manso senhorial (terras de exploração direta do nobre). A talha consistia na entrega compulsória de uma porcentagem da produção agrícola obtida pelo servo no manso servil.",trapDetails:"A alternativa C descreve as banalidades (taxas de uso de fornos, moinhos) e a mão-morta (tributo de herança de servos falecidos), que são obrigações feudais reais mas com definições totalmente distintas das solicitadas na questão.",gateTrigger:"CORVEIA, TALHA E OBRIGAÇÕES FEUDAIS"},{id:"en-q-35",year:"ENEM 2021",title:"Questão 35 (Matemática - Análise Combinatória)",text:"Uma empresa de transporte de cargas deseja criar novos códigos de identificação para suas caixas usando três letras seguidas por dois algarismos numéricos. Para as letras, serão usadas as 26 letras do alfabeto, permitindo repetição. Para os algarismos, serão usados os dígitos de 0 a 9, sem repetição entre eles. O número total de códigos distintos que a empresa poderá criar é expresso por:",options:[{key:"A",text:"26³ × 10²"},{key:"B",text:"26 × 25 × 24 × 10 × 9"},{key:"C",text:"26³ × 10 × 9"},{key:"D",text:"26 × 3 × 10 × 2"},{key:"E",text:"3^26 × 2^10"}],correctKey:"C",reason:"Pelo Princípio Fundamental da Contagem (PFC), como as três letras podem se repetir, temos 26 opções para a primeira letra, 26 para a segunda e 26 para a terceira, ou seja, 26³ possibilidades. Para os algarismos, o primeiro algarismo possui 10 opções (de 0 a 9) e o segundo possui 9 opções (pois não pode haver repetição). Assim, o total de códigos distintos é dado por 26³ × 10 × 9.",trapDetails:"A alternativa A induz o aluno a calcular com repetição de algarismos (10²), enquanto a alternativa B força a não repetição de letras (26 × 25 × 24), contrariando o enunciado que permite repetição para as letras.",gateTrigger:"PFC COM E SEM REPETIÇÃO"},{id:"en-q-36",year:"ENEM 2023",title:"Questão 36 (Química Orgânica - Isomeria Óptica e Quiraldade)",text:`A talidomida é um fármaco que foi amplamente prescrito na década de 1950 para grávidas contra enjoos, mas que causou malformações congênitas graves em recém-nascidos. Descobriu-se que o medicamento era vendido como mistura racêmica, onde um dos isômeros acalmava os enjoos enquanto o outro isômero espacial era teratogênico (nocivo).

A propriedade estrutural que define a existência desse par de isômeros que são imagens especulares não sobreponíveis é a presença de:`,options:[{key:"A",text:"uma ligação dupla entre carbonos que impede a rotação livre da molécula."},{key:"B",text:"um plano de simetria molecular dividindo a estrutura ao meio."},{key:"C",text:"um heteroátomo de oxigênio na cadeia cíclica principal."},{key:"D",text:"um átomo de carbono quiral (ou assimétrico) ligado a quatro grupos diferentes."},{key:"E",text:"um grupo funcional ácido carboxílico de alta acidez aquosa."}],correctKey:"D",reason:"A isomeria óptica (enantiomeria) ocorre devido à assimetria molecular, cuja causa mais comum é a presença de um carbono quiral (ou assimétrico) que está ligado a quatro ligantes químicos diferentes. Os enantiômeros são imagens especulares não sobreponíveis entre si, que podem ter propriedades biológicas radicalmente distintas.",trapDetails:"A alternativa A descreve a condição para isomeria geométrica cis-trans (diastereoisomeria), onde há impedimento rotacional de ligações duplas, mas não gera atividade óptica ou enantiômeros especulares.",gateTrigger:"CARBONO QUIRAL E ENANTIÔMEROS"},{id:"en-q-37",year:"ENEM 2022",title:"Questão 37 (Física - Segunda Lei de Ohm e Resistividade)",text:`Uma linha de transmissão de energia elétrica de cobre possui um comprimento L e área de seção transversal A. Com o aumento da demanda energética industrial na região, decide-se substituir o cabo antigo por um novo cabo, feito do mesmo material condutor de cobre, mas com o dobro do comprimento (2L) e o triplo da área da seção transversal (3A).

Em comparação com o cabo elétrico antigo, a resistência elétrica do novo cabo condutor:`,options:[{key:"A",text:"aumentará para o sêxtuplo do valor original."},{key:"B",text:"diminuirá para um terço do valor original."},{key:"C",text:"será multiplicada pelo fator de 2/3 em relação à original."},{key:"D",text:"será multiplicada pelo fator de 3/2 em relação à original."},{key:"E",text:"permanecerá idêntica, pois o material condutor não foi alterado."}],correctKey:"C",reason:"Pela Segunda Lei de Ohm, a resistência elétrica é calculada por R = ρ × L / A. Para o novo cabo, temos R' = ρ × (2L) / (3A) = (2/3) × (ρ × L / A) = (2/3) × R. Portanto, a resistência elétrica será multiplicada pelo fator 2/3.",trapDetails:"A alternativa A induz o aluno a simplesmente multiplicar os fatores 2 e 3 (2 × 3 = 6), esquecendo que a área de seção transversal é inversamente proporcional à resistência elétrica.",gateTrigger:"RESISTÊNCIA E GEOMETRIA DO CONDUTOR"},{id:"en-q-38",year:"ENEM 2020",title:"Questão 38 (Biologia - Imunização Ativa vs Passiva)",text:`Uma pessoa sofreu uma picada profunda de cobra peçonhenta na floresta e foi encaminhada às pressas ao hospital. O médico assistente administrou imediatamente uma ampola de soro antiofídico específico por via intravenosa, salvando a vida da vítima. Dias depois, ao receber alta, o paciente perguntou se agora estava imune ao veneno daquela cobra.

A ação imediata do soro e a resposta para o questionamento do paciente são, respectivamente:`,options:[{key:"A",text:"Ação ativa preventiva; sim, o paciente produziu células de memória duradouras."},{key:"B",text:"Ação passiva curativa; não, pois o soro contém anticorpos prontos que neutralizam o veneno sem estimular o sistema imunológico do paciente a produzir memória."},{key:"C",text:"Ação de barreira fagocitária; sim, pois os macrófagos do soro englobam o antígeno ativamente."},{key:"D",text:"Ação ativa induzida; não, porque o corpo destruiu as mitocôndrias exógenas contidas no soro humano."},{key:"E",text:"Ação passiva imunizante; sim, pois os antígenos atenuados induziram a produção de linfócitos T auxiliares."}],correctKey:"B",reason:"O soro antiofídico é uma forma de imunização passiva, contendo anticorpos prontos criados em outro organismo (geralmente equinos) para neutralizar imediatamente o veneno circulante. Por não introduzir antígenos que provoquem uma resposta imune primária do próprio paciente, ele não gera células de memória nem imunidade futura.",trapDetails:"A alternativa A confunde o mecanismo do soro com o da vacina. A vacina é uma imunização ativa (introduz antígenos atenuados/mortos para induzir o corpo a produzir seus próprios anticorpos e células de memória).",gateTrigger:"SORO VS VACINA E IMUNIDADE"},{id:"en-q-39",year:"ENEM 2018",title:"Questão 39 (História - Período Regencial e Instabilidade)",text:`O Período Regencial (1831-1840) na história do Império do Brasil foi marcado por forte instabilidade social e política, decorrente da abdicação de D. Pedro I. A ausência de uma figura monárquica centralizada e a descentralização de poder estimulada pelo Ato Adicional de 1834 abriram caminho para diversas revoltas armadas provinciais.

Uma revolta de caráter popular e republicano que ocorreu na província do Grão-Pará, onde a população ribeirinha de baixa renda e indígenas chegaram a ocupar o poder local por meses, foi a:`,options:[{key:"A",text:"Farroupilha, liderada por estancieiros gaúchos produtores de charque."},{key:"B",text:"Sabinada, de cunho militar e separatista temporário na Bahia."},{key:"C",text:"Cabanagem, fortemente motivada pela miséria social extrema das populações ribeirinhas."},{key:"D",text:"Revolta dos Malês, protagonizada por escravizados muçulmanos urbanos em Salvador."},{key:"E",text:"Balaiada, revolta camponesa com liderança de artesãos no Maranhão."}],correctKey:"C",reason:"A Cabanagem (1835-1840), ocorrida na Província do Grão-Pará, destacou-se como a única revolta regencial em que as camadas populares (ribeirinhos conhecidos como cabanos, negros e indígenas) assumiram de fato o poder provincial, lutando contra a miséria histórica e a opressão das elites locais ligadas ao governo imperial.",trapDetails:"A alternativa A cita a Farroupilha, que embora também tenha ocorrido no mesmo período, foi uma revolta de elite liderada por grandes proprietários de terras e gado do sul, com motivos de taxação tributária sobre o charque.",gateTrigger:"CABANAGEM E POPULAÇÕES RIBEIRINHAS"},{id:"en-q-40",year:"ENEM 2023",title:"Questão 40 (Geografia - Transição Energética e Matriz Brasileira)",text:`O Brasil apresenta uma das matrizes elétricas mais limpas e renováveis do mundo, apoiada historicamente na grande capacidade hídrica de seus rios de planalto. No entanto, crises hídricas recorrentes têm forçado o país a diversificar suas fontes geradoras. Entre as alternativas renováveis, uma fonte específica tem crescido exponencialmente no Nordeste brasileiro devido às condições climáticas semiáridas constantes e ventos fortes direcionais.

A fonte de energia alternativa renovável que se destaca pela expansão de parques de geração eólicos e de alta incidência de ventos alísios no Nordeste é a:`,options:[{key:"A",text:"Energia Heliotérmica concentrada em bacias carboníferas."},{key:"B",text:"Energia Geotérmica gerada em fraturas tectônicas profundas."},{key:"C",text:"Energia Eólica, aproveitando o potencial atmosférico dos ventos litorâneos e de interior."},{key:"D",text:"Energia de Biomassa gerada a partir da queima de carvão mineral de xisto."},{key:"E",text:"Energia Maremotriz concentrada nas comportas dos rios da Amazônia."}],correctKey:"C",reason:"O Nordeste brasileiro, especialmente nas áreas costeiras e em certas depressões de interior, apresenta excelente potencial eólico devido à constância e à intensidade dos ventos alísios. A expansão da energia eólica consolidou o Brasil como um dos principais produtores mundiais desse segmento energético renovável.",trapDetails:"A alternativa D descreve carvão mineral de xisto, que é um combustível fóssil altamente poluente e não renovável, além de incorrer em erro conceitual ao misturá-lo com biomassa sustentável.",gateTrigger:"POTENCIAL EÓLICO NO NORDESTE"},{id:"en-q-41",year:"ENEM 2021",title:"Questão 41 (Filosofia - Ética e Justo Meio em Aristóteles)",text:`"A virtude moral é um meio-termo entre dois extremos, um que peca por excesso e outro por falta. É por isso que a virtude é difícil de ser alcançada, pois encontrar o meio em todas as coisas é uma tarefa árdua. O meio-termo não é idêntico para todos, mas refere-se à proporção geométrica de equilíbrio em relação a nós." (ARISTÓTELES. Ética a Nicômaco. São Paulo: Nova Cultural, 1996).

Segundo a ética das virtudes aristotélica, a conduta humana considerada justa e virtuosa é orientada pela:`,options:[{key:"A",text:"busca insaciável pelo prazer físico individual (hedonismo absoluto)."},{key:"B",text:"obediência irrestrita a mandamentos divinos revelados por meio da fé cega."},{key:"C",text:"prudência (phronesis), identificando o justo meio que evita o excesso e a escassez de paixões."},{key:"D",text:"acumulação de riquezas materiais como recompensa pela dedicação ao trabalho."},{key:"E",text:"eliminação total e repressão absoluta das emoções e sentimentos do corpo."}],correctKey:"C",reason:"Para Aristóteles, a virtude ética (aretê) reside no equilíbrio e na moderação (justo meio), intermediando vícios por excesso ou falta (por exemplo, a coragem é o justo meio entre a covardia e a temeridade). Esse equilíbrio é guiado pela prudência ou sabedoria prática (phronesis).",trapDetails:"A alternativa E atrai estudantes que confundem a virtude aristotélica com o estoicismo helenístico (que prega a apatia ou eliminação das emoções), quando Aristóteles propõe apenas a harmonização e moderação das paixões, e não sua erradicação física.",gateTrigger:"ÉTICA ARISTOTÉLICA E JUSTO MEIO"},{id:"en-q-42",year:"ENEM 2019",title:"Questão 42 (Sociologia - Indústria Cultural de Adorno e Horkheimer)",text:`"A indústria cultural funde os velhos setores conhecidos numa qualidade nova: os produtos culturais não são criados apenas de forma espontânea por artistas, mas são programados de cima para baixo como mercadorias de consumo. Ela impede a formação de indivíduos autônomos, independentes, capazes de julgar e decidir conscientemente." (ADORNO, T.; HORKHEIMER, M. Dialética do Esclarecimento. Rio de Janeiro: Zahar, 1985).

Conforme os teóricos da Escola de Frankfurt, o principal objetivo ideológico da Indústria Cultural na sociedade capitalista contemporânea é:`,options:[{key:"A",text:"promover o debate democrático e a emancipação crítica de minorias sociais."},{key:"B",text:"padronizar os gostos e comportamentos, transformando a arte em mercadoria e alienando a massa consumidora."},{key:"C",text:"resgatar expressões folclóricas populares regionais para salvaguarda de museus."},{key:"D",text:"oferecer acesso gratuito à educação de alto nível a todas as classes sociais."},{key:"E",text:"eliminar a publicidade comercial para priorizar produções artísticas sem fins lucrativos."}],correctKey:"B",reason:"A Indústria Cultural, conceito formulado por Theodor Adorno e Max Horkheimer, opera mercantilizando a arte e a cultura. Através da padronização industrial de produções fáceis de consumir (músicas comerciais, filmes fórmula), ela gera passividade intelectual, enfraquece o pensamento crítico e reproduz a ideologia dominante capitalista de consumo contínuo.",trapDetails:"A alternativa A descreve o oposto do que os frankfurtianos sustentam, pois eles defendem que a indústria cultural atua para obstaculizar a emancipação crítica dos indivíduos, e não para incentivá-la.",gateTrigger:"INDÚSTRIA CULTURAL E ALIENÇÃO"},{id:"en-q-43",year:"ENEM 2022",title:"Questão 43 (Linguagens - Função Metalinguística)",text:`"Escrever é uma arte de paciência. Uso as palavras para descrever o próprio ato de alinhar as letras, de rasurar a folha de papel e de buscar o vocábulo perfeito que dê conta de expressar o quão árduo é escrever sobre o nada."

No fragmento de texto poético-ensaístico acima, observa-se o predomínio da função da linguagem conhecida como:`,options:[{key:"A",text:"Função Fática, voltada exclusivamente para testar as condições acústicas do canal de comunicação."},{key:"B",text:"Função Referencial ou Denotativa, com dados estatísticos e neutralidade de linguagem jornalística."},{key:"C",text:"Função Metalinguística, onde o próprio código da palavra é utilizado para explicar e falar sobre si mesmo."},{key:"D",text:"Função Apelativa ou Conativa, estruturada com verbos imperativos dirigidos ao eleitor."},{key:"E",text:"Função Emotiva pura, restrita a um diário íntimo biográfico sem qualquer menção ao ato de ler."}],correctKey:"C",reason:"A função metalinguística ocorre quando o emissor utiliza o próprio código (a escrita, a pintura, o cinema) para falar sobre si mesmo. No texto, o autor usa as palavras especificamente para teorizar e descrever o próprio ato mecânico e artístico de escrever, caracterizando a metalinguagem típica.",trapDetails:"A alternativa A descreve a função fática (focada no canal de transmissão, ex: 'Alô?', 'Oi, está me ouvindo?'), que não possui qualquer relação conceitual com o ato de reflexão linguística da escrita sobre si mesma.",gateTrigger:"METALINGUAGEM E CÓDIGO SOBRE CÓDIGO"},{id:"en-q-44",year:"ENEM 2022",title:"Questão 44 (Matemática - Média Aritmética e Média Ponderada)",text:"Para ser aprovado em uma disciplina universitária de engenharia, um aluno deve realizar três avaliações parciais no semestre. A nota final é uma média ponderada, em que a primeira prova tem peso 1, a segunda prova tem peso 2 e a terceira prova tem peso 3. Sabendo que o aluno obteve notas 5,0 na primeira prova e 5,0 na segunda prova, qual deve ser a nota mínima que ele precisa tirar na terceira prova para alcançar uma média final de aprovação igual a 6,0?",options:[{key:"A",text:"6,0"},{key:"B",text:"7,0"},{key:"C",text:"6,5"},{key:"D",text:"8,0"},{key:"E",text:"9,0"}],correctKey:"B",reason:"A média ponderada (MP) é dada por: MP = (N1 × P1 + N2 × P2 + N3 × P3) / (P1 + P2 + P3). Temos MP = 6,0, N1 = 5,0, N2 = 5,0, P1 = 1, P2 = 2, P3 = 3. Logo: 6,0 = (5,0 × 1 + 5,0 × 2 + N3 × 3) / (1 + 2 + 3) => 6,0 = (5 + 10 + 3 × N3) / 6 => 36,0 = 15 + 3 × N3 => 3 × N3 = 21 => N3 = 7,0.",trapDetails:"A alternativa A atrai o aluno que calcula uma média aritmética simples (5 + 5 + x)/3 = 6 => 10 + x = 18 => x = 8,0 (que é a alternativa D), ou que assume erroneamente que basta tirar a nota de aprovação da média desejada, que seria 6,0.",gateTrigger:"MÉDIA PONDERADA COM EQUAÇÃO"},{id:"en-q-45",year:"ENEM 2020",title:"Questão 45 (Física - Calorimetria e Trocas de Calor)",text:"Em uma xícara contendo 200 g de café quente a uma temperatura inicial de 80ºC, uma pessoa adiciona 100 g de leite frio que estava guardado na geladeira a 5ºC. Desprezando as trocas de calor da mistura com o copo e com o ambiente externo, e sabendo que o calor específico do café e do leite equivalem aproximadamente a 1,0 cal/gºC, a temperatura de equilíbrio térmico da mistura será de:",options:[{key:"A",text:"42,5ºC"},{key:"B",text:"55,0ºC"},{key:"C",text:"45,0ºC"},{key:"D",text:"50,0ºC"},{key:"E",text:"60,0ºC"}],correctKey:"B",reason:"Pelo princípio das trocas de calor em sistemas isolados: Q_cedido + Q_recebido = 0. Como os calores específicos são iguais (c = 1 cal/gºC), temos: m_café × (T - T_café) + m_leite × (T - T_leite) = 0 => 200 × (T - 80) + 100 × (T - 5) = 0 => 2 × T - 160 + T - 5 = 0 => 3 × T = 165 => T = 55ºC.",trapDetails:"A alternativa A é o resultado da média aritmética simples das duas temperaturas (80 + 5) / 2 = 42,5ºC, que só ocorreria se as massas de café e leite adicionadas ao sistema fossem rigorosamente iguais.",gateTrigger:"EQUILÍBRIO TÉRMICO E CALORIMETRIA"},{id:"en-q-46",year:"ENEM 2019",title:"Questão 46 (Química - Termoquímica e Reações de Combustão)",text:`O gás metano (CH4) é o principal componente do gás natural e do biogás. A reação química de combustão completa do metano libera energia sob a forma de calor para o ambiente, sendo amplamente usada em fogões e caldeiras industriais. Essa reação pode ser expressa quimicamente por: CH4(g) + 2 O2(g) → CO2(g) + 2 H2O(g).

Com base nas propriedades termodinâmicas das reações de combustão, o processo químico descrito é classificado como:`,options:[{key:"A",text:"Endotérmico, pois a quebra de ligações no oxigênio molecular consome calor da vizinhança."},{key:"B",text:"Isotérmico, pois a energia cinética média das moléculas se iguala ao zero absoluto."},{key:"C",text:"Exotérmico, pois ocorre liberação líquida de energia (ΔH < 0) gerada pela formação de ligações estáveis."},{key:"D",text:"Endotérmico, pois a fotólise da água produzida requer a incidência contínua de luz UV."},{key:"E",text:"Eletrolítico espontâneo, uma vez que a ddp global do sistema gasoso é negativa."}],correctKey:"C",reason:"As reações de combustão completa de hidrocarbonetos como o metano são processos clássicos de natureza EXOTÉRMICA. Elas liberam energia em forma de calor para as vizinhanças (ΔH < 0), pois a energia total liberada na formação de ligações químicas nos produtos (CO2 e H2O) é maior do que a energia absorvida para quebrar as ligações nos reagentes.",trapDetails:"A alternativa A tenta confundir o aluno ao afirmar que a combustão é endotérmica baseado unicamente na energia requerida para quebrar as ligações iniciais, omitindo o balanço energético global que é fortemente exotérmico.",gateTrigger:"REAÇÕES EXOTÉRMICAS E BALANÇO ENERGÉTICO"},{id:"en-q-47",year:"ENEM 2021",title:"Questão 47 (Biologia - Teoria Sintética da Evolução ou Neodarwinismo)",text:`A Teoria Sintética da Evolução (ou Neodarwinismo), estruturada em meados do século XX, unificou a teoria da seleção natural postulada originalmente por Charles Darwin com as descobertas científicas modernas de outras áreas biológicas.

As duas fontes fundamentais de variabilidade genética celular que fornecem a matéria-prima sobre a qual atua a seleção natural, e que eram desconhecidas por Darwin no século XIX, são:`,options:[{key:"A",text:"Uso e desuso anatômico e transmissão direta de alterações fenotípicas adquiridas."},{key:"B",text:"Mutações aleatórias no código genético e recombinação gênica por meiose ou fecundação."},{key:"C",text:"Clonagem mitótica assexuada e isolamento reprodutivo geográfico artificial."},{key:"D",text:"Deriva genética por efeito gargalo catastrófico e especiação simpátrica espontânea."},{key:"E",text:"Cruzamento seletivo de raças puras consanguíneas e hibridização molecular in vitro."}],correctKey:"B",reason:"Charles Darwin sabia que os seres apresentavam variações hereditárias, mas desconhecia os mecanismos genéticos causadores. O Neodarwinismo revelou que as duas fontes básicas dessa variabilidade são a mutação (que cria novos alelos de forma totalmente aleatória) e a recombinação gênica (que rearranja alelos existentes via meiose, crossing-over e fecundação).",trapDetails:"A alternativa A cita as premissas lamarckistas (uso e desuso e transmissão de caracteres adquiridos), que foram refutadas cientificamente e não compõem a teoria sintética evolucionista moderna.",gateTrigger:"FONTES DE VARIABILIDADE NEODARWINISTAS"},{id:"en-q-48",year:"ENEM 2017",title:"Questão 48 (História - Primeira Revolução Industrial e Mudanças)",text:`A partir da segunda metade do século XVIII na Inglaterra, a Primeira Revolução Industrial promoveu profundas modificações estruturais nas formas de organização do trabalho, nas dinâmicas demográficas e nos ecossistemas urbanos europeus. O tear mecânico e a máquina a vapor alimentados por carvão mineral aceleraram as taxas produtivas, gerando uma nova divisão técnica do trabalho.

A transição da produção manufatureira artesanal para o sistema de maquinofatura gerou como consequência social direta:`,options:[{key:"A",text:"A valorização salarial do artesão independente, cujos conhecimentos tradicionais se tornaram exclusivos."},{key:"B",text:"O fortalecimento das corporações de ofício medievais de artesãos das cidades rurais."},{key:"C",text:"A expropriação de terras camponesas (cercamentos) e a subsequente proletarização de camponeses submetidos à severa disciplina fabril."},{key:"D",text:"A distribuição igualitária de lucros industriais entre operários têxteis e empresários burgueses."},{key:"E",text:"A redução progressiva da jornada laboral para menos de seis horas diárias em regime corporativo."}],correctKey:"C",reason:"A Revolução Industrial foi precedida pelos Cercamentos de Terras Comuns (enclosures) no campo, que expulsaram camponeses de suas terras feudais coletivas, gerando êxodo urbano maciço. Esses camponeses expropriados migraram para as cidades e tornaram-se a mão de obra barata (proletariado) necessária para alimentar as fábricas britânicas sob regimes extenuantes de trabalho.",trapDetails:"A alternativa A está incorreta, pois o artesão tradicional sofreu um violento processo de desvalorização e perda do controle sobre os meios de produção, uma vez que seu trabalho foi fragmentado e substituído pela rapidez mecânica da máquina.",gateTrigger:"CERCAMENTOS E PROLETARIZAÇÃO"},{id:"en-q-49",year:"ENEM 2021",title:"Questão 49 (Geografia - Solo e Intemperismo Químico)",text:`O intemperismo é o conjunto de processos físicos, químicos e biológicos que atuam sobre as rochas na crosta terrestre, desintegrando-as e decompondo-as para dar origem aos solos. A intensidade e a natureza desses processos variam geograficamente de acordo com as condições macroclimáticas locais.

Nas regiões tropicais úmidas de baixa altitude do território brasileiro, o tipo de intemperismo predominante e a principal característica do solo resultante são, respectivamente:`,options:[{key:"A",text:"Intemperismo físico térmico por congelamento; formação de solos rasos e pedregosos ricos em silício."},{key:"B",text:"Intemperismo químico por hidrólise e lixiviação ácida; solos profundos e ricos em hidróxidos de ferro e alumínio (latossolos)."},{key:"C",text:"Intemperismo biológico por algas xerófitas; solos arenosos extremamente salinos de deserto."},{key:"D",text:"Intemperismo eólico mecânico por atrito de areia; solos de cor preta de altíssima fertilidade mineral."},{key:"E",text:"Intemperismo mecânico abrasivo por fluxo glacial; solos alcalinos sem qualquer teor de argila."}],correctKey:"B",reason:"Nas regiões tropicais úmidas, as altas temperaturas combinadas com a abundante disponibilidade de água pluvial aceleram as reações químicas de hidrólise e lixiviação (lavagem de nutrientes solúveis). Isso resulta no intemperismo químico predominante e na formação de solos profundos, muito intemperizados, ácidos e ricos em compostos insolúveis de ferro e alumínio (latossolos).",trapDetails:"A alternativa A descreve condições típicas de climas polares ou de altitude elevada, onde o congelamento mecânico da água em frestas rochosas provoca crioclastia (intemperismo físico), incompatível com o território tropical brasileiro.",gateTrigger:"INTEMPERISMO QUÍMICO E LATOSSOLOS"},{id:"en-q-50",year:"ENEM 2020",title:"Questão 50 (Linguagens - Intertextualidade e Publicidade)",text:`Um anúncio de revista de um novo creme antirrugas de marca famosa exibe o slogan: "Decifra-me ou devoro-te, diz a passagem do tempo. Desafie os limites da idade com nossa fórmula de ácido hialurônico ativo".

Ao utilizar a clássica frase "Decifra-me ou devoro-te" atribuída à Esfinge da mitologia grega clássica de Édipo Rei, a peça publicitária constrói um mecanismo discursivo de:`,options:[{key:"A",text:"Paráfrase metonímica literal, reduzindo a linguagem poética original a dados meramente químicos do produto."},{key:"B",text:"Intertextualidade por apropriação metafórica, associando o enigma inevitável da Esfinge com a ação destrutiva implacável do envelhecimento biológico."},{key:"C",text:"Ironia depreciativa sutil, cujo foco reside em ridicularizar a mitologia grega clássica perante os avanços da ciência."},{key:"D",text:"Hiperbole de caráter esportivo, visando motivar atletas juvenis na quebra de recordes de velocidade."},{key:"E",text:"Dissonância cognitiva proposital, destinada a confundir as consumidoras sobre as dosagens do creme."}],correctKey:"B",reason:'A intertextualidade ocorre quando um texto faz referência direta ou indireta a outro texto anterior de conhecimento geral. No anúncio, a apropriação metafórica da famosa frase da Esfinge correlaciona a ameaça mítica de ser "devorado" com o desgaste físico inevitável produzido pelo tempo, persuadindo o consumidor a "decifrar" o enigma adquirindo o creme.',trapDetails:"A alternativa C é um distrator que interpreta erroneamente a alusão como 'depreciativa' ou depreciando a mitologia, quando na verdade a publicidade eleva o status da frase clássica para conferir sofisticação e apelo dramático ao slogan.",gateTrigger:"INTERTEXTUALIDADE E PUBLICIDADE METAFÓRICA"},{id:"en-q-51",year:"ENEM 2023",title:"Questão 51 (Matemática - Geometria Plana e Área de Círculos)",text:`O proprietário de um haras planeja construir uma pista circular de areia para treinamento de cavalos, cercada externamente por uma calçada de concreto concêntrica medindo 2 metros de largura em toda a sua extensão. Sabe-se que o raio interno da pista de areia (do centro até o início da calçada) mede exatamente 10 metros.

A área total da superfície ocupada exclusivamente pela calçada circular de concreto, expressa em metros quadrados e utilizando a aproximação π ≈ 3,14, corresponde a:`,options:[{key:"A",text:"138,16 m²"},{key:"B",text:"314,00 m²"},{key:"C",text:"452,16 m²"},{key:"D",text:"276,32 m²"},{key:"E",text:"75,36 m²"}],correctKey:"A",reason:"A calçada circular forma uma coroa circular. O raio interno do sistema é r = 10 m, e o raio externo (incluindo a calçada de 2 metros) é R = 10 + 2 = 12 m. A área da calçada de concreto é a diferença entre a área do círculo maior e a do círculo menor: A = π × R² - π × r² = π × (12² - 10²) = π × (144 - 100) = 44π m². Substituindo π ≈ 3,14, temos A ≈ 44 × 3,14 = 138,16 m².",trapDetails:"A alternativa B calcula unicamente a área da pista de areia interna (π × 10² = 100π ≈ 314 m²), enquanto a alternativa C calcula a área total somada (π × 12² = 144π ≈ 452,16 m²), esquecendo de subtrair a região central que continuará sendo de areia.",gateTrigger:"ÁREA DE COROA CIRCULAR"},{id:"en-q-52",year:"ENEM 2022",title:"Questão 52 (Física - Conservação da Energia Mecânica)",text:"Um carrinho de brinquedo de massa 0,5 kg é abandonado a partir do repouso do topo de uma rampa suave e livre de atritos, situada a uma altura vertical de 1,8 metros em relação ao solo plano horizontal. Considerando a aceleração da gravidade g = 10 m/s² e desprezando a resistência aerodinâmica do ar, a velocidade linear com que o carrinho atinge a base horizontal da rampa equivale a:",options:[{key:"A",text:"3,0 m/s"},{key:"B",text:"4,5 m/s"},{key:"C",text:"6,0 m/s"},{key:"D",text:"12,0 m/s"},{key:"E",text:"18,0 m/s"}],correctKey:"C",reason:"Como o sistema é conservativo (sem atrito ou forças dissipativas), a energia mecânica se conserva. A energia potencial gravitacional inicial no topo se converte integralmente em energia cinética na base: E_pot = E_cin => m × g × h = (1/2) × m × v² => v = √(2 × g × h) = √(2 × 10 × 1,8) = √(36) = 6 m/s.",trapDetails:"A alternativa E atrai o aluno que esquece de extrair a raiz quadrada final da equação (v² = 36), resultando erroneamente em uma velocidade absurda de 18 m/s ou confundindo com a multiplicação linear de termos.",gateTrigger:"SISTEMAS CONSERVATIVOS E VELOCIDADE"},{id:"en-q-53",year:"ENEM 2023",title:"Questão 53 (Química - Estequiometria com Pureza de Reagente)",text:`O carbonato de cálcio (CaCO3, massa molar 100 g/mol) é o principal constituinte do calcário, minério usado na fabricação de cimento e na calagem de solos agrícolas. Ao aquecer 200 g de uma amostra comercial de calcário com teor de pureza de 80% em CaCO3, ocorre a reação de decomposição térmica (calcinação) expressa por: CaCO3(s) → CaO(s) + CO2(g).

Sabendo que as massas molares são Ca = 40 g/mol, C = 12 g/mol e O = 16 g/mol, a massa de óxido de cálcio (CaO, massa molar 56 g/mol) obtida ao final desse processo de queima é de exatamente:`,options:[{key:"A",text:"112 g"},{key:"B",text:"89,6 g"},{key:"C",text:"56 g"},{key:"D",text:"160 g"},{key:"E",text:"44,8 g"}],correctKey:"B",reason:"A massa inicial de calcário é 200g, mas sua pureza é de apenas 80%. Portanto, a massa real de CaCO3 puro que reage é: 200g × 0,80 = 160g de CaCO3. Pela estequiometria balanceada: 1 mol de CaCO3 (100g) produz 1 mol de CaO (56g). Montando a regra de três: 100g de CaCO3 ---- 56g de CaO; 160g de CaCO3 ---- X g de CaO => X = (160 × 56) / 100 = 89,6 g de CaO.",trapDetails:"A alternativa A calcula a massa de CaO produzida considerando a amostra com 100% de pureza (200g × 56 / 100 = 112g), ignorando o percentual de impurezas inertes contidas no calcário comercial.",gateTrigger:"ESTEQUIOMETRIA COM GRAU DE PUREZA"},{id:"en-q-54",year:"ENEM 2020",title:"Questão 54 (Biologia - Eutrofização de Corpos d'Água)",text:`O descarte inadequado de esgotos domésticos urbanos ricos em matéria orgânica biodegradável e fertilizantes agrícolas fosfatados em lagos de água doce provoca um grave distúrbio ecológico artificial de degradação rápida do ecossistema aquático.

A sequência lógica de eventos ecológicos que caracteriza o fenômeno de eutrofização antropogênica, culminando na morte de peixes por asfixia física, é:`,options:[{key:"A",text:"Proliferação excessiva de algas superficiais → redução da entrada de luz → morte de plantas submersas → proliferação de bactérias decompositoras aeróbicas → esgotamento rápido de oxigênio dissolvido."},{key:"B",text:"Morte de peixes → aumento da acidez devido ao CO2 dissolvido → precipitação mecânica de carbonatos → solidificação do leito."},{key:"C",text:"Aumento imediato de oxigênio dissolvido → superpopulação de peixes herbívoros → escassez de fitoplâncton → deserto biológico."},{key:"D",text:"Evaporação rápida da lâmina d'água → aumento da salinidade osmótica → plasmólise imediata de todas as brânquias marinhas."},{key:"E",text:"Surgimento de correntes térmicas verticais profundas → inversão térmica lacustre → liberação explosiva de gás metano liquefeito."}],correctKey:"A",reason:"A eutrofização começa com o aporte de nutrientes (fósforo e nitrogênio), estimulando a proliferação explosiva de algas superficiais (bloom). Esse tapete verde bloqueia a passagem de luz solar, matando plantas fotossintetizantes submersas. A abundância de matéria orgânica morta desencadeia a proliferação massiva de bactérias decompositoras aeróbicas, que consomem o oxigênio dissolvido na água na respiração celular, matando peixes por anoxia (falta de O2).",trapDetails:"A alternativa C descreve um aumento inicial de oxigênio, confundindo o estudante que supõe de forma equivocada que 'mais plantas e algas crescendo na água' sempre resulta em um ecossistema aquático oxigenado e saudável de longo prazo.",gateTrigger:"EUTROFIZAÇÃO E CONSUMO AERÓBICO DE O2"},{id:"en-q-55",year:"ENEM 2022",title:"Questão 55 (História - Era Vargas e Legislação Trabalhista)",text:`Durante o governo de Getúlio Vargas, especificamente no Estado Novo (1937-1945), a outorga da Consolidação das Leis do Trabalho (CLT) em 1943 representou um marco histórico. Paralelamente, o Departamento de Imprensa e Propaganda (DIP) veiculava amplamente a imagem de Vargas como o 'Pai dos Pobres'.

Essa associação sistemática entre a concessão de direitos sociais e a propaganda estatal tinha como objetivo político principal:`,options:[{key:"A",text:"Fortalecer sindicatos autônomos e independentes com direito irrestrito de greve fabril."},{key:"B",text:"Legitimar o regime autoritário varguista, promovendo o apaziguamento dos conflitos de classe e a cooptação da classe operária."},{key:"C",text:"Desestimular a industrialização nacional para focar a economia exclusivamente nas exportações de café."},{key:"D",text:"Implantar uma república socialista inspirada no modelo revolucionário soviético."},{key:"E",text:"Extinguir a cobrança de impostos sobre grandes fortunas e heranças rurais."}],correctKey:"B",reason:"A legislação trabalhista da Era Vargas, embora tenha consolidado direitos fundamentais, foi utilizada como instrumento corporativista de controle político. Ao centralizar as concessões no Estado e atrelar a imagem de Vargas à propaganda do DIP, buscava-se esvaziar a combatividade operária e legitimar o caráter autoritário do governo.",trapDetails:"A alternativa A sugere o fortalecimento de sindicatos 'autônomos', o que é historicamente incorreto, visto que o varguismo atrelou os sindicatos ao Ministério do Trabalho (sindicalismo pelego), proibindo greves.",gateTrigger:"CORPORATIVISMO E PROPAGANDA NA ERA VARGAS"},{id:"en-q-56",year:"ENEM 2023",title:"Questão 56 (Física - Óptica e Refração da Luz)",text:`Um estudante realiza um experimento inserindo um feixe de laser monocromático, inicialmente propagando-se no ar (índice de refração n1 = 1,0), em um bloco de vidro polido (índice de refração n2 = 1,5). Ele observa que o feixe sofre um desvio de trajetória ao cruzar a interface plana entre os dois meios.

Ao passar do ar para o vidro, as alterações ocorridas na velocidade (v), frequência (f) e comprimento de onda (λ) da luz são:`,options:[{key:"A",text:"A velocidade diminui, a frequência permanece constante e o comprimento de onda diminui."},{key:"B",text:"A velocidade aumenta, a frequência diminui e o comprimento de onda aumenta."},{key:"C",text:"A velocidade diminui, a frequência aumenta e o comprimento de onda permanece constante."},{key:"D",text:"A velocidade e o comprimento de onda aumentam, e a frequência permanece constante."},{key:"E",text:"A velocidade, a frequência e o comprimento de onda permanecem inalterados."}],correctKey:"A",reason:"Na refração, quando a luz passa para um meio mais refringente (maior índice de refração, de 1,0 para 1,5), sua velocidade de propagação diminui (v = c/n). A frequência é uma característica da fonte emissora e nunca muda durante a refração. Sendo v = λ × f, se a velocidade diminui e a frequência é constante, o comprimento de onda (λ) também deve diminuir.",trapDetails:"A alternativa C confunde o aluno ao sugerir que a frequência aumenta. Lembre-se: a frequência de uma onda depende exclusivamente da fonte geradora e é invariável na mudança de meio.",gateTrigger:"REFRAÇÃO E CONSTÂNCIA DA FREQUÊNCIA"},{id:"en-q-57",year:"ENEM 2021",title:"Questão 57 (Química - Equilíbrio Químico e Le Chatelier)",text:`A produção industrial de amônia (NH3) ocorre pelo processo Haber-Bosch, expresso pela reação reversível exotérmica: N2(g) + 3 H2(g) ⇌ 2 NH3(g)  ΔH < 0.

De acordo com o Princípio de Le Chatelier, para maximizar o rendimento de produção de amônia no equilíbrio, o sistema industrial deve ser submetido a:`,options:[{key:"A",text:"Altas temperaturas e baixas pressões globais."},{key:"B",text:"Baixas temperaturas e altas pressões globais."},{key:"C",text:"Adição constante de um catalisador metálico sob vácuo absoluto."},{key:"D",text:"Redução da concentração de reagentes gasosos (N2 e H2)."},{key:"E",text:"Altas temperaturas e remoção do catalisador do reator."}],correctKey:"B",reason:"Sendo a reação exotérmica (ΔH < 0), a redução da temperatura desloca o equilíbrio no sentido direto (liberação de calor), favorecendo a produção de NH3. Em termos de pressão, o lado dos reagentes possui 4 mols de gás e o dos produtos possui 2 mols; o aumento da pressão favorece o sentido de menor volume (direto), otimizando a produção de amônia.",trapDetails:"A alternativa C cita o catalisador. Catalisadores aumentam a velocidade com que o equilíbrio é alcançado, mas não alteram a posição do equilíbrio ou o rendimento termodinâmico dos produtos.",gateTrigger:"PRINCÍPIO DE LE CHATELIER NO PROCESSO HABER"},{id:"en-q-58",year:"ENEM 2020",title:"Questão 58 (Biologia - Genética e Cruzamento Di-híbrido)",text:`Em ervilhas de cheiro, a cor amarela das sementes (V) é dominante sobre a cor verde (v), e a textura lisa (R) é dominante sobre a textura rugosa (r). Dois indivíduos duplo-heterozigotos (VvRr) são cruzados entre si.

A proporção fenotípica esperada para a descendência desse cruzamento, seguindo a Segunda Lei de Mendel, é de:`,options:[{key:"A",text:"3 : 1"},{key:"B",text:"1 : 2 : 1"},{key:"C",text:"9 : 3 : 3 : 1"},{key:"D",text:"9 : 7"},{key:"E",text:"1 : 1 : 1 : 1"}],correctKey:"C",reason:"Segundo a Segunda Lei de Mendel (segregação independente), o cruzamento entre dois indivíduos di-híbridos (VvRr × VvRr) resulta em uma proporção clássica de 9/16 amarelas e lisas, 3/16 amarelas e rugosas, 3/16 verdes e lisas, e 1/16 verdes e rugosas. Logo, a proporção fenotípica é 9 : 3 : 3 : 1.",trapDetails:"A alternativa A (3:1) é a proporção fenotípica clássica para a Primeira Lei de Mendel em cruzamento mono-híbrido (um único par de alelos com dominância completa), e não di-híbrido.",gateTrigger:"SEGUNDA LEI DE MENDEL E DI-HIBRIDISMO"},{id:"en-q-59",year:"ENEM 2022",title:"Questão 59 (Geografia - Urbanização e Macrocefalia Urbana)",text:`O processo de urbanização brasileiro, intensificado na segunda metade do século XX, ocorreu de forma acelerada e concentrada, associado ao êxodo rural em larga escala. Esse crescimento desordenado das grandes metrópoles gerou o fenômeno da macrocefalia urbana.

Uma consequência socioespacial direta da macrocefalia urbana nas grandes cidades brasileiras é a:`,options:[{key:"A",text:"Distribuição equitativa de infraestrutura urbana básica e saneamento de qualidade."},{key:"B",text:"Inversão térmica rural e eliminação da poluição atmosférica industrial."},{key:"C",text:"Segregação socioespacial, expressa na proliferação de favelas e na informalidade habitacional nas periferias."},{key:"D",text:"Descentralização absoluta de todas as atividades administrativas federais."},{key:"E",text:"Superpopulação de animais silvestres de grande porte nos centros urbanos."}],correctKey:"C",reason:"A macrocefalia urbana é a concentração massiva de população e atividades econômicas em poucas metrópoles, que crescem sem planejamento. Isso gera um descompasso entre o crescimento demográfico e a oferta de empregos/infraestrutura, resultando em segregação socioespacial, favelização e crescimento do mercado informal de trabalho.",trapDetails:"A alternativa A é um distrator absurdo que descreve uma utopia de 'distribuição equitativa', que contrasta fortemente com o cenário de profunda desigualdade urbana existente nas metrópoles do país.",gateTrigger:"MACROCEFALIA URBANA E SEGREGAÇÃO"},{id:"en-q-60",year:"ENEM 2023",title:"Questão 60 (Matemática - Funções e Modelos Quadráticos)",text:`Uma pequena fábrica de camisas personalizadas estima que seu lucro diário L (em reais) em função da quantidade x de peças produzidas e vendidas seja modelado pela função quadrática: L(x) = -2x² + 120x - 1000.

Para obter o lucro máximo diário possível, a quantidade ideal de camisas a ser fabricada por dia é:`,options:[{key:"A",text:"20 camisas"},{key:"B",text:"30 camisas"},{key:"C",text:"40 camisas"},{key:"D",text:"60 camisas"},{key:"E",text:"120 camisas"}],correctKey:"B",reason:"O valor de x que maximiza a função quadrática com concavidade voltada para baixo (a = -2 < 0) é a coordenada x do vértice da parábola: Xv = -b / (2a). Substituindo os valores da função L(x), temos: Xv = -120 / (2 × (-2)) = -120 / -4 = 30 camisas.",trapDetails:"A alternativa D apresenta o valor 60, que o aluno pode encontrar ao calcular incorretamente -b/a ou esquecer de multiplicar o denominador por 2.",gateTrigger:"MÁXIMOS E MÍNIMOS DE FUNÇÃO QUADRÁTICA"},{id:"en-q-61",year:"ENEM 2021",title:"Questão 61 (História - Ditadura Militar e o AI-5)",text:`O Ato Institucional Nº 5 (AI-5), baixado em 13 de dezembro de 1968 durante o governo do general Costa e Silva, é amplamente considerado pelos historiadores como o marco do endurecimento autoritário da Ditadura Militar no Brasil.

Entre as medidas extremas instituídas pelo AI-5, destaca-se:`,options:[{key:"A",text:"A legalização de todos os partidos políticos socialistas e comunistas."},{key:"B",text:"A suspensão da garantia de habeas corpus para crimes de motivação política e a permissão para fechar o Congresso Nacional."},{key:"C",text:"A convocação imediata de eleições diretas presidenciais com voto feminino universal."},{key:"D",text:"A criação da Companhia Siderúrgica Nacional e do salário mínimo."},{key:"E",text:"A concessão de anistia ampla e irrestrita a todos os presos de esquerda."}],correctKey:"B",reason:"O AI-5 consolidou a fase mais repressiva da Ditadura Militar (os 'anos de chumbo'). Ele outorgou ao Presidente o poder de fechar o Congresso, cassar mandatos, suspender direitos políticos e suprimir a garantia jurídica do habeas corpus para crimes contra a segurança nacional.",trapDetails:"A alternativa D confunde as ações da Era Vargas (criação da CSN e do salário mínimo) com o período ditatorial posterior, que ocorreu décadas depois.",gateTrigger:"AI-5 E ENDURECIMENTO DITATORIAL"},{id:"en-q-62",year:"ENEM 2022",title:"Questão 62 (Física - Termodinâmica e Primeira Lei)",text:`Em um motor de combustão interna, um gás ideal contido em um pistão sofre uma expansão rápida na qual realiza um trabalho mecânico de 400 J sobre o pistão. Devido à rapidez do processo, a troca de calor entre o gás e as paredes metálicas do cilindro é praticamente nula (processo adiabático).

A variação da energia interna (ΔU) desse gás durante o processo de expansão equivale a:`,options:[{key:"A",text:"+400 J"},{key:"B",text:"0 J"},{key:"C",text:"-400 J"},{key:"D",text:"-200 J"},{key:"E",text:"+200 J"}],correctKey:"C",reason:"Pela Primeira Lei da Termodinâmica: ΔU = Q - W. Como o processo é adiabático, a troca de calor é nula (Q = 0). Sabendo que o gás realiza trabalho na expansão, o trabalho é positivo (W = +400 J). Assim, ΔU = 0 - 400 = -400 J. O gás perde energia interna, resfriando-se.",trapDetails:"A alternativa A atrai o aluno que erra o sinal do trabalho na fórmula da Primeira Lei da Termodinâmica, esquecendo que o trabalho realizado pelo gás diminui sua energia interna disponível.",gateTrigger:"PROCESSO ADIABÁTICO E PRIMEIRA LEI"},{id:"en-q-63",year:"ENEM 2020",title:"Questão 63 (Química - Concentração Molar de Soluções)",text:`Um técnico de laboratório químico precisa preparar 500 mL de uma solução aquosa de hidróxido de sódio (NaOH, massa molar 40 g/mol) na concentração molar de exatamente 0,2 mol/L.

A massa de NaOH puro que o técnico deve pesar na balança analítica para preparar essa solução é de:`,options:[{key:"A",text:"4,0 g"},{key:"B",text:"8,0 g"},{key:"C",text:"2,0 g"},{key:"D",text:"40,0 g"},{key:"E",text:"0,1 g"}],correctKey:"C",reason:"A concentração molar (M) é calculada por M = m / (MM × V), onde m é a massa em gramas, MM é a massa molar (40 g/mol) e V é o volume em litros (500 mL = 0,5 L). Isolando a massa: m = M × MM × V = 0,2 mol/L × 40 g/mol × 0,5 L = 4,0 × 0,5 = 2,0 g.",trapDetails:"A alternativa A é o dobro da resposta correta, obtida se o aluno esquecer de converter o volume de 500 mL para litros (usando 1 L na fórmula) ou errar na multiplicação dos fatores.",gateTrigger:"CÁLCULO DE CONCENTRAÇÃO MOLAR"},{id:"en-q-64",year:"ENEM 2021",title:"Questão 64 (Biologia - Fisiologia e Resposta Humoral)",text:`As vacinas de RNA mensageiro (mRNA) contra a Covid-19 representaram um grande avanço biotecnológico. Elas introduzem no corpo humano uma sequência de mRNA que codifica a síntese da proteína spike do vírus SARS-CoV-2.

Após a leitura do mRNA pelas células do hospedeiro, o sistema imunológico desencadeia uma resposta humoral cuja principal característica de defesa a longo prazo é a:`,options:[{key:"A",text:"Destruição imediata das hemácias do sangue por fagocitose mecânica de macrófagos."},{key:"B",text:"Produção de anticorpos específicos por plasmócitos e diferenciação de células de memória B."},{key:"C",text:"Ativação direta de plaquetas para formar coágulos que asfixiam os vírus circulantes."},{key:"D",text:"Mutação dirigida do DNA mitocondrial para impedir a entrada de qualquer tipo de capsídeo viral."},{key:"E",text:"Inativação do timo para suspender de forma definitiva a produção de linfócitos."}],correctKey:"B",reason:"A imunização ativa gerada pela vacina estimula a resposta imune humoral. Os antígenos produzidos (proteína spike) são apresentados aos linfócitos B, que se diferenciam em plasmócitos produtores de anticorpos específicos e em células B de memória. Estas garantem uma resposta secundária rápida e potente em caso de infecção futura pelo patógeno real.",trapDetails:"A alternativa E sugere a inativação do timo, órgão vital para a maturação de linfócitos T, o que causaria imunodeficiência severa e contraria o funcionamento imunológico de defesa.",gateTrigger:"RESPOSTA HUMORAL E CÉLULAS DE MEMÓRIA"},{id:"en-q-65",year:"ENEM 2023",title:"Questão 65 (Geografia - Biomas e Fitogeografia do Cerrado)",text:`O Cerrado é o segundo maior bioma da América do Sul e destaca-se por sua rica biodiversidade e endemismo. No entanto, é amplamente pressionado pela expansão da fronteira agrícola. Sua vegetação apresenta adaptações xeromórficas marcantes para sobreviver ao clima estacional com inverno seco.

As principais características físicas e vegetacionais do Cerrado brasileiro são:`,options:[{key:"A",text:"Florestas densas latifoliadas, solo lamoso de mangue e ausência de incidência solar direta."},{key:"B",text:"Troncos tortuosos com casca grossa, folhas coriáceas e raízes profundas para captação de água no lençol freático."},{key:"C",text:"Árvores de grande porte com raízes escoras (pneumatóforos) adaptadas à hipóxia contínua."},{key:"D",text:"Campos limpos de gramíneas rasteiras sem arbustos, típicos de climas desérticos superáridos."},{key:"E",text:"Florestas aciculifoliadas homogêneas sob influência de neve e geadas polares."}],correctKey:"B",reason:"A vegetação do Cerrado possui características adaptadas à seca sazonal e aos solos ácidos (ricos em alumínio), tais como casca espessa e corticosa (proteção térmica contra o fogo natural), galhos e troncos sinuosos, folhas rígidas (coriáceas) e raízes muito profundas que alcançam lençóis subterrâneos mesmo na estiagem prolongada.",trapDetails:"A alternativa C descreve adaptações de plantas halófitas de manguezais (raízes pneumatóforas para captação de O2 em solo lamoso anaeróbio), incompatíveis com o solo profundo e drenado do Cerrado.",gateTrigger:"ADAPTAÇÕES XEROMÓRFICAS DO CERRADO"},{id:"en-q-66",year:"ENEM 2022",title:"Questão 66 (Filosofia - Contratualismo de Thomas Hobbes)",text:`"Durante o tempo em que os homens vivem sem um poder comum capaz de mantê-los a todos em respeito, eles se encontram naquela condição a que se chama guerra de todos contra todos. Nesse estado, não há lugar para a indústria, pois seu fruto é incerto; e a vida do homem é solitária, pobre, sórdida, embrutecida e curta." (HOBBES, T. Leviatã. São Paulo: Abril Cultural, 1974).

Para Thomas Hobbes, a transição desse estado de natureza para a sociedade civilizada ocorre por meio de:`,options:[{key:"A",text:"Um pacto social voluntário no qual os indivíduos abdicam de sua liberdade natural em favor de um soberano absoluto que garanta a paz e a segurança física."},{key:"B",text:"Uma revolução armada comunista destinada a socializar a propriedade privada da terra."},{key:"C",text:"Uma eleição direta periódica com divisão proporcional de poderes entre executivo e judiciário."},{key:"D",text:"Um acordo puramente econômico focado na eliminação das taxas alfandegárias europeias."},{key:"E",text:"O abandono completo de qualquer forma de governo e leis escritas em busca da anarquia individual."}],correctKey:"A",reason:"Thomas Hobbes defende que, para escapar do caos e da violência do estado de natureza (guerra de todos contra todos), os indivíduos realizam um pacto ou contrato social. Nesse acordo, todos transferem seu poder e direito de autodefesa a um terceiro (o soberano/Estado absoluto - o Leviatã), que passa a deter o monopólio do uso da força para manter a paz civil.",trapDetails:"A alternativa E descreve o anarquismo radical, que é o exato oposto da tese absolutista e centralizadora hobbesiana da necessidade de um Estado forte.",gateTrigger:"CONTRATO SOCIAL E ESTADO ABSOLUTO"},{id:"en-q-67",year:"ENEM 2020",title:"Questão 67 (Sociologia - Karl Marx e o Conceito de Mais-Valia)",text:`Na teoria crítica do capitalismo de Karl Marx, o processo de acumulação de capital pelas classes proprietárias dos meios de produção (burguesia) assenta-se na exploração sistemática da força de trabalho da classe operária (proletariado).
