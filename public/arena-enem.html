Resposta final: O trabalho realizado pelo gás na expansão foi de 400 Joules.`}},{id:"f-term-7",name:"Rendimento de Máquina Térmica",expression:"η = 1 - Q_f / Q_q",description:"Calcula o rendimento termodinâmico de uma máquina que opera em ciclos.",mnemonic:"Rendimento é um menos a fração fria pela quente!",variables:["η: Rendimento termodinâmico (adimensional, entre 0 e 1)","Q_q: Calor retirado da fonte quente (J ou cal)","Q_f: Calor rejeitado para a fonte fria (J ou cal)","W: Trabalho útil produzido pela máquina (J), onde W = Q_q - Q_f"],enemContext:"Esta é uma das equações de maior apelo socioambiental no ENEM! Máquinas térmicas operam em ciclos retirando calor de uma fonte quente, convertendo parte dele em trabalho útil (movimento) e rejeitando o restante para uma fonte fria. De acordo com a Segunda Lei da Termodinâmica, é impossível construir uma máquina térmica que converta integralmente todo o calor recebido em trabalho (ou seja, o rendimento de uma máquina real é sempre menor que 100%!).",triAnalysis:"Média",triDetails:"Envolve o conceito de conservação de energia (W = Q_q - Q_f). A TRI costuma classificar essas questões como de nível médio-alto, pois exigem bom entendimento físico do fluxo de energia.",resolvedExample:{statement:"Uma usina termoelétrica consome uma quantidade de carvão que fornece 10.000 kJ de calor (fonte quente) a cada segundo ao sistema. Sabendo que desse total, 6.000 kJ são dissipados e perdidos na água de resfriamento (fonte fria), determine o rendimento dessa termoelétrica e o trabalho útil produzido por segundo.",solution:`1. Identificar os dados: Q_quente = 10.000 kJ, Q_fria = 6.000 kJ.
2. Calcular o trabalho útil realizado por ciclo/segundo: W = Q_quente - Q_fria = 10.000 - 6.000 = 4.000 kJ.
3. Aplicar a fórmula do rendimento: η = W / Q_quente.
4. Substituir os valores: η = 4.000 / 10.000 = 0,40.
5. Converter para porcentagem multiplicando por 100: η = 40%.
Resposta final: O rendimento da usina termoelétrica é de 40% e o trabalho útil por segundo (potência útil) é de 4.000 kJ.`}}]}]},{id:"matematica",name:"Matemática",icon:"🧮",color:"violet",subthemes:[{name:"Análise Combinatória",formulas:[{id:"m-comb-1",name:"Permutação Simples",expression:"P_n = n!",description:"Número de maneiras de ordenar n elementos distintos.",mnemonic:"Permutar é Fatorial total!",variables:["P_n: Número total de permutações (maneiras de organizar os elementos)","n: Quantidade de elementos distintos a serem ordenados","!: Operador fatorial (ex: 4! = 4 · 3 · 2 · 1 = 24)"],enemContext:"A permutação simples é usada quando queremos ordenar TODOS os elementos de um conjunto disponível. O exemplo clássico do ENEM são os anagramas (misturar as letras de uma palavra para formar novas palavras, com ou sem sentido), as filas de pessoas sem restrições ou a disposição de livros em uma prateleira. Lembre-se: em permutações, usamos 100% dos elementos disponíveis, apenas alterando suas posições!",triAnalysis:"Fácil",triDetails:"Cálculos diretos de fatoriais pequenos ou anagramas de palavras curtas sem letras repetidas são considerados fáceis pela TRI. Questões com restrições simples (como 'duas pessoas devem sempre sentar juntas') são de nível médio.",resolvedExample:{statement:"Um grupo de 5 amigos vai ao cinema e compra 5 poltronas consecutivas na mesma fileira. De quantas maneiras distintas esses amigos podem se sentar nessas poltronas de modo que dois desses amigos, João e Maria, fiquem obrigatoriamente sentados lado a lado?",solution:`1. Como João e Maria devem ficar juntos, podemos tratá-los como um único 'bloco' ou 'super-elemento'.
2. Agora, em vez de 5 elementos para permutar, temos 4 elementos: o bloco (João+Maria) + os outros 3 amigos.
3. Calculamos a permutação desses 4 elementos: P₄ = 4! = 4 · 3 · 2 · 1 = 24 maneiras.
4. Dentro do bloco, João e Maria também podem trocar de lugar entre si (João à esquerda de Maria, ou Maria à esquerda de João). Isso equivale a P₂ = 2! = 2 maneiras.
5. Pelo Princípio Multiplicativo, multiplicamos as possibilidades: Total = P₄ · P₂ = 24 · 2 = 48.
Resposta final: Existem 48 maneiras distintas de os amigos se organizarem.`}},{id:"m-comb-2",name:"Permutação com Repetição",expression:"P_n^{a,b...} = n! / (a! · b!...)",description:"Ordenação de n elements onde alguns se repetem (letras de anagramas).",mnemonic:"Fatorial total dividido pelo fatorial dos repetidos!",variables:["P_n^{a,b...}: Permutações com elementos repetidos","n: Número total de elementos (incluindo os que se repetem)","a, b: Quantidade de vezes que cada elemento repetido específico aparece no conjunto"],enemContext:"Indispensável para resolver anagramas de palavras que possuem letras repetidas (como 'BANANA', 'URUGUAI' ou 'ENEM'). Outra aplicação fantástica que o ENEM ama: caminhos em malhas quadriculadas! Se para ir de um ponto A a um ponto B você precisa dar obrigatoriamente 4 passos para a Direita (D) e 3 passos para Cima (C) em qualquer ordem, o número total de caminhos possíveis é a permutação de 7 passos com repetição de 4 'D's e 3 'C's!",triAnalysis:"Média",triDetails:"Sua identificação e modelagem mecânica de caminhos ou anagramas com letras repetidas se posiciona no nível médio da TRI. O erro clássico é esquecer de dividir pelos fatoriais dos elementos repetidos, gerando respostas muito maiores que a real.",resolvedExample:{statement:"Um robô de entregas precisa partir do cruzamento A e chegar ao cruzamento B de um bairro planejado. Para isso, ele deve andar exatamente 5 quarteirões para o Leste (L) e 3 quarteirões para o Norte (N), percorrendo a menor distância possível. Quantos caminhos diferentes o robô pode realizar?",solution:`1. O robô deve dar um total de 8 passos (5 Leste e 3 Norte). Cada caminho é uma sequência de letras, ex: LLLLLNNN.
2. O número total de sequências possíveis é a permutação desses 8 passos com repetição das 5 instruções 'L' e das 3 instruções 'N'.
3. Aplicamos a fórmula: P_8^{5,3} = 8! / (5! · 3!).
4. Expandimos o numerador até encontrar o maior fatorial do deminador para simplificar: 8! = 8 · 7 · 6 · 5!.
5. Substituímos: (8 · 7 · 6 · 5!) / (5! · 3 · 2 · 1) = (8 · 7 · 6) / 6 = 8 · 7 = 56.
Resposta final: O robô pode realizar 56 caminhos diferentes.`}},{id:"m-comb-3",name:"Arranjo Simples",expression:"A_{n,p} = n! / (n - p)!",description:"Número de agrupamentos de p elementos de um total de n, onde a ordem importa (ex: senhas, pódio).",mnemonic:"Não importa a fila, o Arranjo divide pela sobra!",variables:["A_{n,p}: Quantidade de arranjos distintos de tamanho p","n: Total de elementos distintos disponíveis no conjunto","p: Número de posições ou elementos escolhidos por grupo (onde p ≤ n)"],enemContext:"O arranjo é utilizado quando queremos escolher e ordenar p elementos de um grupo maior n. A regra de ouro para distinguir Arranjo de Combinação é fazer a pergunta: 'A ORDEM IMPORTA?'. Se você alterar a ordem dos elementos escolhidos e o grupo resultante for diferente (como na escolha de presidente e vice-presidente de um grêmio, na criação de senhas de banco ou na formação do pódio de uma corrida de Fórmula 1), então a ordem IMPORTA e estamos diante de um ARRANJO!",triAnalysis:"Média",triDetails:"Cálculos teóricos de arranjo com aplicação de fórmula ou através do Princípio Fundamental da Contagem (PFC) têm pontuação média. No ENEM, a maioria das questões de arranjo pode ser facilmente resolvida usando tracinhos do PFC (Princípio Multiplicativo), o que reduz as chances de esquecimento da fórmula.",resolvedExample:{statement:"Em uma competição de atletismo escolar, 8 atletas disputam a grande final da corrida dos 100 metros rasos. Sabendo que serão distribuídas medalhas de Ouro, Prata e Bronze para o primeiro, segundo e terceiro colocados, respectivamente, de quantas formas diferentes esse pódio pode ser preenchido?",solution:`1. Identificar se a ordem importa: Sim, pois ganhar Ouro é diferente de ganhar Prata ou Bronze (posições distintas no pódio).
2. Temos n = 8 atletas disponíveis e p = 3 posições a preencher.
3. Aplicando a fórmula do Arranjo: A_{8,3} = 8! / (8 - 3)! = 8! / 5!.
4. Resolver simplificando o fatorial: A_{8,3} = (8 · 7 · 6 · 5!) / 5! = 8 · 7 · 6 = 336.
5. Alternativa prática usando o Princípio Multiplicativo: 8 possibilidades para o 1º lugar, 7 para o 2º lugar e 6 para o 3º lugar. Total = 8 · 7 · 6 = 336.
Resposta final: O pódio pode ser formado de 336 maneiras diferentes.`}},{id:"m-comb-4",name:"Combinação Simples",expression:"C_{n,p} = n! / ((n - p)! · p!)",description:"Número de agrupamentos de p elementos de um total de n, onde a ordem NÃO importa (ex: comissões, times).",mnemonic:"Combinação: a ordem NÃO importa, por isso divide mais ainda!",variables:["C_{n,p}: Quantidade de combinações (grupos/equipes) possíveis","n: Total de elementos distintos disponíveis no conjunto","p: Número de elementos selecionados para compor o grupo/comissão (onde p ≤ n)"],enemContext:"A combinação simples é a campeã absoluta de cobrança no ENEM! Ela é usada quando queremos selecionar p elementos de um conjunto de n, mas a ORDEM dos elementos NÃO IMPORTA. Exemplos clássicos: escolher 3 pessoas de um grupo de 10 para formar uma comissão de trabalho, selecionar 6 dezenas na Mega-Sena ou escolher 4 frutas para fazer uma salada de frutas. Se você escolher as pessoas {Ana, Beto, Caio} ou {Beto, Caio, Ana}, o grupo final é rigorosamente o mesmo!",triAnalysis:"Difícil",triDetails:"Questões de combinação que exigem a montagem matemática pura (sem resolver o cálculo final, comum no ENEM, ex: expressar a resposta como C_{10,3} · C_{7,2}) ou que envolvem tomada de decisão com subgrupos têm classificação de nível médio-alto a difícil na TRI.",resolvedExample:{statement:"Uma equipe médica de pronto-socorro possui em seu plantão 6 médicos e 5 enfermeiros. Para realizar um atendimento móvel de emergência, é necessário formar uma equipe de trabalho composta por exatamente 2 médicos e 2 enfermeiros. De quantas maneiras distintas essa equipe de atendimento pode ser estruturada?",solution:`1. Analisar se a ordem importa: Não, pois a função dos médicos e dos enfermeiros na equipe é equivalente entre si (a ordem de escolha não altera a equipe).
2. Calcular as escolhas dos médicos: Combinação de 6 médicos tomados 2 a 2. C_{6,2} = 6! / (4! · 2!) = (6 · 5 · 4!) / (4! · 2 · 1) = 30 / 2 = 15 maneiras.
3. Calcular as escolhas dos enfermeiros: Combinação de 5 enfermeiros tomados 2 a 2. C_{5,2} = 5! / (3! · 2!) = (5 · 4 · 3!) / (3! · 2 · 1) = 20 / 2 = 10 maneiras.
4. Aplicar o Princípio Multiplicativo para unir as escolhas: Total = C_{6,2} · C_{5,2} = 15 · 10 = 150 maneiras.
Resposta final: A equipe pode ser estruturada de 150 maneiras distintas.`}}]},{name:"Áreas de Figuras Planas",formulas:[{id:"m-area-1",name:"Área do Retângulo e Paralelogramo",expression:"A = b · h",description:"Calcula a superfície multiplicando a base pela altura.",variables:["A: Área ou superfície bidimensional total (m²)","b: Medida do comprimento da base (m)","h: Medida da altura perpendicular à base (m)"],enemContext:"O retângulo é a figura mais comum em problemas práticos do ENEM! Costuma aparecer em situações de pavimentação (quantos pisos cabem em uma sala), cálculo de custos de pintura por metro quadrado, ou dimensionamento de terrenos agrícolas. Dica de ouro: muita atenção na conversão de unidades (1 m² = 10.000 cm²) e na escala de mapas (se a escala linear é 1:100, a escala de área será 1:10.000)!",triAnalysis:"Fácil",triDetails:"Erros em cálculos de área de retângulo penalizam fortemente a nota na TRI por ser um conteúdo básico. Os principais tropeços ocorrem ao misturar unidades (comprimento em metros e largura em centímetros) ou no cálculo de escalas de área.",resolvedExample:{statement:"Um arquiteto está projetando uma sala retangular que mede 6,0 m de comprimento por 4,0 m de largura. Ele deseja revestir todo o piso dessa sala com placas quadradas de porcelanato com 50 cm de lado cada. Desprezando as perdas por cortes, quantas placas de porcelanato serão necessárias para cobrir o piso?",solution:`1. Calcular a área da sala retangular em metros quadrados: A_sala = b · h = 6,0 · 4,0 = 24,0 m².
2. Identificar o lado do porcelanato em metros: L = 50 cm = 0,5 m.
3. Calcular a área de cada placa de porcelanato: A_placa = L² = (0,5)² = 0,25 m².
4. Dividir a área total da sala pela área de cada placa para obter a quantidade necessária: N = A_sala / A_placa = 24 / 0,25.
5. Como dividir por 0,25 é o mesmo que multiplicar por 4: N = 24 · 4 = 96.
Resposta final: Serão necessárias 96 placas de porcelanato.`}},{id:"m-area-2",name:"Área do Quadrado",expression:"A = l²",description:"Superfície de um quadrilátero regular com todos os lados iguais.",variables:["A: Área ou superfície bidimensional total (m²)","l: Medida do lado do quadrado (m)"],enemContext:"Aparece em plantações organizadas, painéis fotovoltaicos (placas solares quadradas), pastilhas de decoração e mosaicos. No ENEM, uma relação muito comum envolve maximizar áreas: para um mesmo perímetro fixo de quadrilátero, o quadrado é o retângulo que possui a maior área possível!",triAnalysis:"Fácil",triDetails:"Questões puras de área do quadrado são de nível muito fácil na TRI. Erros comuns de candidatos desatentos incluem confundir área com perímetro (multiplicar o lado por 4 ao invés de elevar ao quadrado) ou errar a potenciação decimal.",resolvedExample:{statement:"Um proprietário dispõe de uma tela de cerca com 40 metros de comprimento linear e decide cercar um terreno de formato quadrado para criar uma horta, utilizando toda a tela disponível. Determine a área total disponível para o cultivo dessa horta.",solution:`1. Como o terreno é quadrado e o perímetro total cercado é de 40 metros, cada lado (l) do quadrado terá a quarta parte da cerca.
2. Calcular o comprimento do lado: l = 40 / 4 = 10 metros.
3. Calcular a área do terreno quadrado: A = l².
4. Substituir o valor do lado: A = (10)² = 100 m².
Resposta final: A área disponível para o cultivo da horta é de 100 m².`}},{id:"m-area-3",name:"Área do Triângulo",expression:"A = (b · h) / 2",description:"A área de qualquer triângulo é metade do retângulo envolvente.",variables:["A: Área total da superfície triangular (m²)","b: Medida de um dos lados considerado como base (m)","h: Altura perpendicular correspondente à base escolhida (m)"],enemContext:"O ENEM aplica áreas triangulares em telhados, terrenos irregulares que devem ser divididos (triangulados) para cálculo de impostos, ou em sinalizações de trânsito. Lembre-se: em triângulos não retângulos, a altura (h) deve ser perpendicular à base (fazendo 90°), e não a medida do lado inclinado! Para o triângulo equilátero, tenha decorada a fórmula direta da área: A = (l² · √3) / 4.",triAnalysis:"Fácil",triDetails:"Aplicação direta de base e altura é de nível fácil. Quando o ENEM exige que o aluno encontre a altura usando trigonometria ou teorema de Pitágoras primeiro, a questão eleva-se para o nível médio.",resolvedExample:{statement:"Um outdoor publicitário tem o formato de um triângulo equilátero cujo lado mede 6 metros. Sabendo que o custo para pintar esse outdoor é de R$ 50,00 por metro quadrado e adotando √3 ≈ 1,7, qual será o valor total gasto na pintura desse painel?",solution:`1. Identificar o lado do triângulo equilátero: l = 6 m.
2. Aplicar a fórmula da área do triângulo equilátero: A = (l² · √3) / 4.
3. Substituir l: A = (6² · √3) / 4 = (36 · √3) / 4 = 9 · √3.
4. Substituir √3 ≈ 1,7 para cálculo prático: A ≈ 9 · 1,7 = 15,3 m².
5. Calcular o custo total multiplicando a área pelo preço por m²: Custo = 15,3 · 50 = R$ 765,00.
Resposta final: O valor total gasto na pintura será de R$ 765,00.`}},{id:"m-area-4",name:"Área do Trapézio",expression:"A = (B + b) · h / 2",description:"Área de um quadrilátero com dois lados paralelos.",mnemonic:"Basezona mais basezinha, vezes a altura dividido por dois!",variables:["A: Área total do trapézio (m²)","B: Medida da base maior paralela (m)","b: Medida da base menor paralela (m)","h: Distância perpendicular entre as bases paralela (altura) (m)"],enemContext:"Muito cobrado no ENEM em plantas de lotes residenciais, barragens de concreto (onde a seção transversal é um trapézio) e desenhos geométricos de fachadas. No ENEM, fique atento: as bases (B e b) são obrigatoriamente os lados paralelos do quadrilátero, mesmo se o trapézio estiver 'deitado' ou rotacionado na folha de provas!",triAnalysis:"Média",triDetails:"Considerado de nível médio na TRI. Muitos candidatos esquecem de dividir a soma das bases por 2 ou têm dificuldade em identificar os lados paralelos (bases) quando o trapézio está rotacionado.",resolvedExample:{statement:"Um terreno residencial possui formato de trapézio retângulo. A frente do lote (base menor) mede 12 metros, o fundo (base maior) mede 18 metros e a lateral perpendicular à frente e ao fundo (altura) mede 20 metros. Determine a área total desse lote residencial.",solution:`1. Identificar os dados do trapézio: b = 12 m (base menor), B = 18 m (base maior), h = 20 m (altura perpendicular).
2. Aplicar a fórmula da área do trapézio: A = (B + b) · h / 2.
3. Substituir os valores: A = (18 + 12) · 20 / 2.
4. Somar as bases: A = 30 · 20 / 2.
5. Simplificar e multiplicar: A = 30 · 10 = 300 m².
Resposta final: A área total do lote residencial é de 300 m².`}},{id:"m-area-5",name:"Área do Círculo",expression:"A = π · r²",description:"Superfície plana delimitada por uma circunferência.",mnemonic:"A pizza tem 'pi'zza 'r'aio ao quadrado!",variables:["A: Área ou superfície da região circular (m²)","π: Constante matemática Pi (normalmente aproximada para 3, 3,1 ou 3,14 pelo ENEM)","r: Medida do raio da circunferência (m)"],enemContext:"O ENEM ama círculos! Contextualiza com sistemas de irrigação de pivô central (em que uma haste gira irrigando uma plantação circular), alcance de antenas de rádio, pratos, moedas, ou reservas ambientais circulares. Cuidado máximo com a maior pegadinha do ENEM: o enunciado frequentemente fornece o DIÂMETRO (D) para te induzir ao erro, mas você deve usar o RAIO (r = D / 2) na fórmula da área!",triAnalysis:"Média",triDetails:"O erro mais prevalente de nível médio na TRI é substituir o valor do diâmetro diretamente como se fosse o raio, ou esquecer que a potenciação quadrática afeta apenas o raio (fazer π·r e depois elevar tudo ao quadrado).",resolvedExample:{statement:"Um agricultor instala um sistema de irrigação por pivô central em sua propriedade. A haste giratória aspersora possui um comprimento total de 200 metros. Considerando que o sistema dê uma volta completa de 360° e adotando π = 3,14, qual é a área total de cultivo irrigada por esse equipamento em hectares (ha)? Dado: 1 hectare = 10.000 m².",solution:`1. Identificar que o comprimento da haste aspersora corresponde exatamente ao raio (r) do círculo irrigado: r = 200 metros.
2. Aplicar a fórmula da área do círculo: A = π · r².
3. Substituir os valores conhecidos: A = 3,14 · (200)².
4. Realizar a potenciação: 200² = 40.000 m².
5. Multiplicar por π: A = 3,14 · 40.000 = 125.600 m².
6. Converter para hectares dividindo o resultado por 10.000: Área_ha = 125.600 / 10.000 = 12,56 ha.
Resposta final: A área total de cultivo irrigada é de 12,56 hectares.`}}]},{name:"Progressões e Sequências",formulas:[{id:"m-prog-1",name:"Termo Geral da PA",expression:"a_n = a_1 + (n - 1) · r",description:"Encontra qualquer termo de uma progressão aritmética sabendo a razão e o primeiro termo.",mnemonic:"A neta (an) é igual à avó (a1) mais o nenezinho menos um correndo atrás do rato (r)!",variables:["a_n: Termo na posição n (enésimo termo)","a_1: Primeiro termo da sequência","n: Posição ou número de termos (número inteiro positivo)","r: Razão de incremento constante (diferença entre dois termos consecutivos)"],enemContext:"As progressões aritméticas descrevem fenômenos lineares no ENEM, como planejamentos financeiros simples (depósitos fixos mensais), cronogramas de treinos esportivos (correr 500m a mais a cada dia), ou padrões visuais de ladrilhos. Uma dica de ouro no ENEM: preste muita atenção ao valor de n. Se você quer calcular o valor no enésimo dia a partir de um valor inicial dado no 'dia zero', a contagem de termos pode variar. Lembre-se: r > 0 indica PA crescente, r < 0 indica PA decrescente, r = 0 indica PA constante.",triAnalysis:"Fácil",triDetails:"A aplicação direta da fórmula para encontrar um termo específico é de nível fácil. Questões de PA tornam-se médias ou difíceis quando o ENEM não fornece os termos diretamente, exigindo a montagem de um sistema de equações lineares com dois termos genéricos (ex: a₅ = 20 e a₁₀ = 35).",resolvedExample:{statement:"Um atleta inicia um programa de treinamento físico visando correr uma maratona. No primeiro dia (dia 1), ele corre uma distância de 3,0 km. A partir do segundo dia, ele passa a acrescentar diariamente uma distância fixa de 1,5 km em relação ao dia anterior. Qual será a distância percorrida por esse atleta no 15º dia de treinamento?",solution:`1. Identificar os elementos da progressão aritmética: a_1 = 3,0 km (primeiro dia), r = 1,5 km (acréscimo fixo), n = 15 (posição do termo desejado).
2. Aplicar a fórmula do termo geral da PA: a_n = a_1 + (n - 1) · r.
3. Substituir os valores conhecidos: a_15 = 3,0 + (15 - 1) · 1,5.
4. Realizar a subtração dentro do parêntese: a_15 = 3,0 + 14 · 1,5.
5. Resolver a multiplicação primeiro: 14 · 1,5 = 21,0.
6. Somar os termos: a_15 = 3,0 + 21,0 = 24,0 km.
Resposta final: No 15º dia de treinamento, o atleta percorrerá uma distância de 24,0 km.`}},{id:"m-prog-2",name:"Soma dos Termos da PA",expression:"S_n = (a_1 + a_n) · n / 2",description:"Calcula a soma dos n primeiros termos de uma progressão aritmética.",mnemonic:"Soma o primeiro com o último, multiplica pela metade do número de elementos!",variables:["S_n: Soma total acumulada dos n primeiros termos","a_1: Primeiro termo da sequência","a_n: Enésimo termo (último termo considerado na soma)","n: Quantidade total de termos a serem somados"],enemContext:"A soma de termos de uma PA mede o total acumulado de um recurso linear. No ENEM, aparece em economia (total poupado ao longo de um ano com depósitos crescentes), produção industrial acumulada, ou empilhamento de objetos (como tubos ou tijolos organizados em formato trapezoidal, onde cada linha tem um tijolo a menos que a de baixo). O grande segredo: para calcular S_n, você quase sempre precisa encontrar o último termo (a_n) usando a fórmula do Termo Geral antes!",triAnalysis:"Média",triDetails:"Soma de PA é considerada de nível médio na TRI porque geralmente exige uma resolução em duas etapas: primeiro o cálculo de a_n pelo termo geral, e depois a aplicação da soma de termos. Erros comuns de candidatos desatentos envolvem esquecer de dividir por 2 ou errar a contagem total de termos (n).",resolvedExample:{statement:"Para incentivar a poupança familiar, um pai propõe um desafio de 12 meses ao filho: no primeiro mês, o filho depositaria R$ 10,00 em um cofrinho e, a cada mês seguinte, aumentaria o depósito em R$ 5,00 em relação ao mês anterior (R$ 15,00 no segundo mês, R$ 20,00 no terceiro, e assim por diante). Qual será o valor total acumulado no cofrinho ao final dos 12 meses de desafio?",solution:`1. Identificar os dados do problema: a_1 = 10 (depósito inicial), r = 5 (acréscimo fixo), n = 12 (quantidade total de depósitos).
2. Para aplicar a fórmula da soma, precisamos primeiro descobrir o valor do último depósito (a_12) usando o Termo Geral: a_12 = a_1 + (12 - 1) · r.
3. Substituir os valores: a_12 = 10 + 11 · 5 = 10 + 55 = 65 reais.
4. Aplicar a fórmula da Soma de PA: S_n = (a_1 + a_n) · n / 2.
5. Substituir para n = 12: S_12 = (10 + 65) · 12 / 2.
6. Simplificar e calcular: S_12 = 75 · 6 = 450 reais.
Resposta final: O valor total acumulado no cofrinho ao final de 12 meses será de R$ 450,00.`}},{id:"m-prog-3",name:"Termo Geral da PG",expression:"a_n = a_1 · q^{n-1}",description:"Encontra o enésimo termo de uma sequência multiplicativa geométrica.",variables:["a_n: Termo de posição n (enésimo termo)","a_1: Primeiro termo da sequência","q: Razão geométrica multiplicadora constante","n: Posição do termo desejado (índice da sequência)"],enemContext:"As progressões geométricas modelam processos exponenciais que crescem ou decrescem de forma muito rápida. O ENEM ama relacionar PG com crescimento bacteriano (duplica a cada hora), disseminação de vírus (pandemias), desvalorização de bens de consumo (carros que perdem uma fração fixa do valor ao ano), ou juros compostos. Dica preciosa: se um valor inicial V_0 sofre um crescimento de 20% a cada período, a razão geométrica q será de 1,20; se sofre uma redução de 15% (desvalorização), a razão q será de 0,85!",triAnalysis:"Média",triDetails:"A modelagem algébrica de progressão geométrica é de nível médio a difícil na TRI. Os maiores causadores de erros são a manipulação de potências (como elevar números decimais a potências grandes) e a confusão no expoente (n-1), esquecendo de subtrair 1 da posição.",resolvedExample:{statement:"Uma cultura de laboratório possui inicialmente 200 bactérias de uma determinada espécie. Devido às condições ideais de nutrientes, essa população duplica de tamanho a cada hora decorrida. Determine a quantidade exata de bactérias presentes nessa cultura ao final de 7 horas de observação.",solution:`1. Identificar o tipo de crescimento: como a população duplica (multiplica por 2 a cada etapa), trata-se de uma PG de razão q = 2.
2. Definir os termos da sequência: no instante inicial t = 0 (início do teste), temos 200 bactérias. Vamos definir esse termo inicial como o primeiro termo da nossa sequência (a_1 = 200). Após 7 horas de crescimento, o valor final corresponderá ao 8º termo da sequência (já que o termo 1 é o tempo t=0).
3. Aplicar a fórmula do Termo Geral da PG: a_n = a_1 · q^{n-1}.
4. Substituir para n = 8: a_8 = 200 · 2^{8-1} = 200 · 2⁷.
5. Resolver a potência: 2⁷ = 128.
6. Multiplicar os valores: a_8 = 200 · 128 = 25.600.
Resposta final: Ao final de 7 horas, estarão presentes 25.600 bactérias na cultura.`}},{id:"m-prog-4",name:"Soma Infinita da PG",expression:"S_∞ = a_1 / (1 - q)",description:"Soma dos infinitos termos de uma PG decrescente (onde |q| < 1).",mnemonic:"Soma sem fim: o primeiro dividido pelo desconto de um menos a razão!",variables:["S_∞: Soma limite de convergência para infinitos termos","a_1: Primeiro termo da progressão geométrica decrescente","q: Razão geométrica constante, obrigatoriamente no intervalo -1 < q < 1 (ou |q| < 1)"],enemContext:"Representa o limite de soma de termos que decrescem progressivamente até se aproximarem de zero. O ENEM aplica a soma infinita de PG em problemas conceituais de geometria fractal (soma das áreas de triângulos infinitamente menores dentro de outros), problemas de movimento físico (uma bola de pingue-pongue que quica repetidamente no chão, atingindo sempre metade da altura anterior antes de parar), ou dízimas periódicas. A condição crucial é que a razão q deve estar estritamente entre -1 e 1 para que os termos fiquem cada vez menores e a soma convirja para um número real fixo!",triAnalysis:"Difícil",triDetails:"A soma infinita de PG é classificada como difícil na TRI. Exige maturidade matemática para entender o conceito de limite infinito e modelar as infinitas frações decrescentes. Erros comuns de candidatos envolvem aplicar a fórmula para razões maiores que 1 (onde a soma divergiria ao infinito) ou errar a subtração decimal/fracionária no denominador.",resolvedExample:{statement:"Uma bola é solta de uma altura inicial de 10 metros acima de um solo plano horizontal. Cada vez que a bola choca-se com o solo, ela rebate verticalmente para cima atingindo uma altura máxima correspondente a exatamente 60% (fração de 0,60) da altura do salto anterior. Determine a distância vertical total aproximada em metros percorrida por essa bola de forma descendente (apenas nas trajetórias de descida) até que ela pare completamente.",solution:`1. Analisar as alturas de descida consecutivas da bola: o primeiro impacto ocorre após descer 10 m (a_1 = 10). O segundo impacto ocorre após descer de uma altura correspondente a 60% da primeira (a_2 = 10 · 0,6 = 6). O terceiro após descer 6 · 0,6 = 3,6 m, e assim sucessivamente.
2. Trata-se de uma PG decrescente infinita com primeiro termo a_1 = 10 m e razão geométrica q = 0,60.
3. Como |q| < 1, podemos aplicar a fórmula da Soma Infinita da PG: S_∞ = a_1 / (1 - q).
4. Substituir os valores na equação: S_∞ = 10 / (1 - 0,60).
5. Resolver o denominador: S_∞ = 10 / 0,40.
6. Realizar a divisão: 10 / 0,40 = 25 metros.
Resposta final: A distância vertical total percorrida pela bola nas trajetórias de descida até parar é de 25 metros.`}}]}]},{id:"quimica",name:"Química",icon:"⚗️",color:"yellow",subthemes:[{name:"Química Geral",formulas:[{id:"q-gen-1",name:"Densidade de Matéria",expression:"d = m / V",description:"Mede a quantidade de massa de um material contido em um determinado volume.",mnemonic:"O Amor da densidade é a Massa no Volume!",variables:["d: Densidade absoluta do material (g/cm³, g/mL ou kg/m³)","m: Massa total da amostra de matéria (g ou kg)","V: Volume total ocupado pela amostra (cm³, mL, L ou m³)"],enemContext:"A densidade no ENEM está sempre associada a fenômenos cotidianos de flutuação e identificação de substâncias puras. Um clássico é a diferenciação entre água salgada e doce (ovos flutuando), derramamento de petróleo no mar (o óleo flutua por ser menos denso e insolúvel), ou adulteração de combustíveis (como teor de água e álcool na gasolina). Lembre-se: materiais menos densos flutuam sobre os mais densos, desde que sejam imiscíveis!",triAnalysis:"Fácil",triDetails:"Considerada uma competência elementar pela TRI. Os maiores erros ocorrem por confusão na conversão de unidades (como kg/m³ para g/cm³, onde 1 g/cm³ = 1000 kg/m³) ou por não subtrair a massa de recipientes vazios ao se pesar líquidos (massa de tara).",resolvedExample:{statement:"Em um teste de qualidade de combustível em um posto, um fiscal coletou uma amostra de 100 mL de gasolina sob suspeita de adulteração com etanol. Sabendo que a massa dessa amostra líquida pesou exatamente 75,0 g, e que a densidade aceitável da gasolina pura no mercado nacional varia entre 0,70 g/cm³ e 0,74 g/cm³, determine a densidade da amostra coletada em g/cm³ (lembrando que 1 mL = 1 cm³) e verifique se ela atende ao padrão de pureza.",solution:`1. Identificar os dados fornecidos: massa m = 75,0 g, volume V = 100 mL = 100 cm³.
2. Aplicar a fórmula de densidade absoluta: d = m / V.
3. Substituir os valores: d = 75,0 g / 100 cm³ = 0,75 g/cm³.
4. Analisar em relação à faixa padrão: o valor de 0,75 g/cm³ é maior que o limite superior aceitável de 0,74 g/cm³.
Resposta final: A densidade da amostra é de 0,75 g/cm³ e ela não atende ao padrão de pureza (indicando adulteração com adição de solventes mais densos, como etanol hidratado).`}},{id:"q-gen-2",name:"Número de Mols",expression:"n = m / MM",description:"Determina a quantidade de matéria (mols) com base na massa e na massa molar.",mnemonic:"Não me morde, n = m em cima da Massa Molar!",variables:["n: Quantidade de matéria contida na amostra (mol)","m: Massa real da amostra de substância (g)","MM: Massa molar da substância (g/mol, obtida pela soma das massas atômicas da tabela periódica)"],enemContext:"O conceito de mol é a ponte entre o mundo microscópico dos átomos e o mundo macroscópico do laboratório. O ENEM cobra o cálculo do número de mols como etapa obrigatória em quase todas as questões de estequiometria, cálculo de concentração de soluções e leis dos gases. Dica de ouro: a massa (m) na fórmula deve estar rigorosamente em gramas (g)! Se a questão der em kg, toneladas ou mg, converta para gramas antes de dividir pela massa molar (MM)!",triAnalysis:"Fácil",triDetails:"Encontrar o número de mols de forma direta é considerado nível fácil pela TRI. Erros comuns de candidatos envolvem somar incorretamente as massas atômicas da tabela periódica (ex: esquecer de multiplicar a massa atômica de um elemento pelo seu índice na molécula, como o 2 no H₂O) ou errar a conversão de massa de kg/mg para g.",resolvedExample:{statement:"O dióxido de carbono (CO₂) é um dos principais gases causadores do efeito estufa. Sabendo que as massas molares do Carbono e do Oxigênio são, respectively, 12 g/mol e 16 g/mol, determine a quantidade de matéria (número de mols) correspondente a uma emissão de 880 g de CO₂ por um automóvel.",solution:`1. Calcular a massa molar (MM) do CO₂: MM = 1 · (Massa do C) + 2 · (Massa do O) = 1 · 12 + 2 · 16 = 12 + 32 = 44 g/mol.
2. Identificar a massa da amostra: m = 880 g.
3. Aplicar a fórmula do número de mols: n = m / MM.
4. Substituir os valores: n = 880 g / 44 g/mol = 20 mols.
Resposta final: A emissão de 880 g de CO₂ corresponde a exatamente 20 mols desse gás.`}},{id:"q-gen-3",name:"Equilíbrio Químico (Kc)",expression:"K_c = [Produtos]^p / [Reagentes]^r",description:"Relação matemática entre concentrações de produtos e reagentes em equilíbrio químico.",mnemonic:"Produtos em cima, Reagentes embaixo, elevados aos seus coeficientes!",variables:["K_c: Constante de equilíbrio termodinâmico baseada em concentrações molares (adimensional)","[Produtos]: Concentrações molares de cada produto no estado de equilíbrio (mol/L)","[Reagentes]: Concentrações molares de cada reagente no estado de equilíbrio (mol/L)","p, r: Coeficientes estequiométricos da equação química balanceada (viram expoentes)"],enemContext:"O ENEM adora contextualizar o equilíbrio químico com processos biológicos e industriais, como o transporte de oxigênio pela hemoglobina no sangue (altitude de atletas), a síntese da amônia pelo processo Haber-Bosch, e o equilíbrio do gás carbônico nos oceanos (acidificação marinha). Um segredo crucial de prova: substâncias no estado SÓLIDO e solventes líquidos puros NÃO entram na expressão de Kc, pois suas concentrações efetivas permanecem constantes durante o processo! Apenas espécies gasosas (g) e em solução aquosa (aq) participam.",triAnalysis:"Média",triDetails:"Questões de cálculo de Kc são classificadas como nível médio-alto pela TRI. Exigem a montagem da famosa tabela de equilíbrio ('Início, Reage/Forma, Equilíbrio') para descobrir as concentrações de cada espécie no equilíbrio antes de jogar na fórmula, além de requerer atenção aos coeficientes estequiométricos como expoentes.",resolvedExample:{statement:"Considere a reação reversível de síntese do trióxido de enxofre em fase gasosa a uma dada temperatura: 2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g). Em um recipiente fechado em equilíbrio, as concentrações molares encontradas foram: [SO₂] = 0,2 mol/L, [O₂] = 0,1 mol/L e [SO₃] = 0,4 mol/L. Determine o valor da constante de equilíbrio K_c para essa reação sob essas condições.",solution:`1. Montar a expressão matemática de K_c para a reação: K_c = [SO₃]² / ([SO₂]² · [O₂]). Perceba que os coeficientes estequiométricos (2 para SO₂, 1 para O₂, 2 para SO₃) viram os expoentes correspondentes na expressão.
2. Substituir os valores das concentrações molares no equilíbrio: K_c = (0,4)² / ((0,2)² · 0,1).
3. Resolver as potências: (0,4)² = 0,16 e (0,2)² = 0,04.
4. Substituir e simplificar: K_c = 0,16 / (0,04 · 0,1) = 0,16 / 0,004.
5. Realizar a divisão: K_c = 40.
Resposta final: O valor da constante de equilíbrio K_c sob essas condições é igual a 40.`}},{id:"q-gen-4",name:"Potencial Hidrogeniônico (pH)",expression:"pH = -log[H⁺]",description:"Mede o grau de acidez de uma solução aquosa baseado nos íons hidrogênio.",mnemonic:"pH é o logaritmo negativo do próton!",variables:["pH: Índice de acidez ou alcalinidade (escala adimensional de 0 a 14)","[H⁺]: Concentração molar de íons hidrogênio ou hidrônio (H₃O⁺) em solução (mol/L)"],enemContext:"O pH é onipresente na prova de ciências da natureza! É associado ao caráter ácido-básico do solo para agricultura (calagem), chuva ácida e seus impactos ambientais, o funcionamento de enzimas digestivas (como a pepsina no estômago com pH ≈ 2 e a tripsina no intestino com pH ≈ 8), além do pH da água mineral e refrigerantes. Regra de ouro absoluta do ENEM: cada variação de 1 unidade na escala de pH corresponde a uma mudança de 10 VEZES na concentração de íons [H⁺] (escala logarítmica). Por exemplo, uma solução com pH 3 é 100 vezes mais ácida que uma com pH 5!",triAnalysis:"Média",triDetails:"Média-alta pela TRI devido ao uso de conceitos de logaritmo e notação científica aplicados à química. Candidatos costumam errar na matemática dos logaritmos negativos ou confundir soluções ácidas (pH < 7) com básicas (pH > 7).",resolvedExample:{statement:"Uma análise do suco gástrico de um paciente revelou uma concentração molar de íons hidrogênio [H⁺] igual a 1,0 · 10⁻² mol/L. Sabendo que pH = -log[H⁺], determine o pH desse suco gástrico e classifique-o como ácido, neutro ou básico.",solution:`1. Identificar a concentração molar de [H⁺] = 1,0 · 10⁻² mol/L.
2. Aplicar a fórmula matemática do pH: pH = -log[H⁺].
3. Substituir o valor de [H⁺]: pH = -log(1,0 · 10⁻²).
4. Aplicar a propriedade de logaritmo do produto e da potência: -log(10⁻²) = -(-2 · log(10)) = 2 · 1 = 2.
5. Classificar o caráter da solução: como o pH obtido (pH = 2) é menor que 7, a solução possui caráter fortemente ácido.
Resposta final: O pH do suco gástrico é 2 e possui caráter ácido.`}}]},{name:"Soluções e Misturas",formulas:[{id:"q-sol-1",name:"Concentração Comum",expression:"C = m_1 / V",description:"Massa do soluto dissolvido por volume total de solução.",mnemonic:"Concentração é Massa no Volume da caneca!",variables:["C: Concentração comum da solução (g/L)","m_1: Massa do soluto dissolvido na mistura (g)","V: Volume total ocupado pela solução líquida (L)"],enemContext:"O ENEM cobra exaustivamente a concentração comum em contextos cotidianos e ambientais: dosagem de medicamentos em frascos, teor de sódio em alimentos industrializados, poluição de rios por metais pesados (ex: partes por milhão ou g/L) e rotulagem de produtos de limpeza. Atenção máxima: não confunda concentração comum (massa do soluto / volume da solução) com densidade da solução (massa total da solução / volume da solução)!",triAnalysis:"Fácil",triDetails:"Classificado como nível fácil se for cobrança direta de cálculo. Erros comuns na TRI envolvem a conversão de unidades (como mg para g ou mL para Litros) ou a confusão conceitual entre soluto (o que se dissolve) e solvente (o que dissolve).",resolvedExample:{statement:"Uma análise química de um efluente industrial revelou que um reservatório de 500 litros de água continha 250 g de um sal de cromo dissolvido. Qual é a concentração comum desse metal em gramas por litro (g/L) no efluente?",solution:`1. Identificar as variáveis dadas: m_1 = 250 g (massa do soluto) e V = 500 L (volume da solução).
2. Aplicar a fórmula de concentração comum: C = m_1 / V.
3. Substituir os valores: C = 250 / 500 = 0,50 g/L.
Resposta final: A concentração comum do metal é de 0,50 g/L.`}},{id:"q-sol-2",name:"Concentração Molar (Molaridade)",expression:"M = n_1 / V = m_1 / (MM · V)",description:"Número de mols do soluto contidos em um litro de solução.",mnemonic:"Molaridade une o Mol no Volume total!",variables:["M: Molaridade / Concentração em quantidade de matéria (mol/L)","n_1: Quantidade de matéria do soluto (mol)","V: Volume total da solução líquida (L)","MM: Massa molar do soluto (g/mol)","m_1: Massa do soluto dissolvido (g)"],enemContext:"Esta é a forma de concentração preferida do Sistema Internacional e do ENEM! Aparece em análises de laboratório, titulações ácido-base, preparação de reagentes e cálculos estequiométricos de reações aquosas. Memorize: se a massa molar do composto não for fornecida diretamente, você deve calculá-la usando a tabela periódica ou as massas atômicas fornecidas no rodapé da prova!",triAnalysis:"Média",triDetails:"Sua classificação na TRI é média-alta devido à necessidade de combinar duas etapas matemáticas: calcular a massa molar ou número de mols do soluto e, em seguida, dividir pelo volume em litros. Erros comuns envolvem errar a soma da massa molar ou esquecer de converter o volume de mL para litros.",resolvedExample:{statement:"O soro fisiológico é uma solução aquosa de cloreto de sódio (NaCl) utilizada para reidratação. Determine a concentração molar (molaridade) aproximada do NaCl em uma solução preparada dissolvendo-se 5,85 g de sal em água até completar o volume total de 500 mL. Dados: Massas molares: Na = 23 g/mol, Cl = 35,5 g/mol.",solution:`1. Calcular a massa molar (MM) do NaCl: MM = 23 + 35,5 = 58,5 g/mol.
2. Calcular o número de mols (n_1) do soluto: n_1 = m_1 / MM = 5,85 g / 58,5 g/mol = 0,10 mol.
3. Converter o volume de mL para litros: V = 500 mL = 0,50 L.
4. Aplicar a fórmula da Molaridade: M = n_1 / V.
5. Substituir os valores: M = 0,10 mol / 0,50 L = 0,20 mol/L.
Resposta final: A concentração molar do NaCl no soro fisiológico é de 0,20 mol/L.`}},{id:"q-sol-3",name:"Lei da Diluição",expression:"C_i · V_i = C_f · V_f  |  M_i · V_i = M_f · V_f",description:"Adição de solvente mantém a massa do soluto constante, mudando apenas volume e concentração.",mnemonic:"Antes e depois: Civi é igual a Civi!",variables:["C_i, M_i: Concentração inicial comum (g/L) ou molar (mol/L) antes da diluição","V_i: Volume inicial da solução concentrada antes de adicionar solvente","C_f, M_f: Concentração final comum (g/L) ou molar (mol/L) após a diluição","V_f: Volume final total da solução após a adição de solvente (V_f = V_i + V_adicionado)"],enemContext:"Diluição significa adicionar apenas solvente puro (geralmente água) a uma solução já existente para torná-la menos concentrada. No ENEM, aparece em contextos práticos como preparação de sucos concentrados, diluição de inseticidas ou agrotóxicos para aplicação em lavouras, e ajuste de soluções desinfetantes em hospitais. Uma pegadinha clássica do ENEM: o enunciado pergunta o 'volume de água que deve ser adicionado' e o aluno calcula o volume final (V_f) e esquece de subtrair o volume inicial (V_i)!",triAnalysis:"Média",triDetails:"De nível médio na TRI. A principal armadilha é confundir o Volume Final (V_f) com o Volume de solvente adicionado (V_adicionado), sabendo que V_f = V_i + V_adicionado.",resolvedExample:{statement:"Um técnico de laboratório dispõe de 100 mL de uma solução concentrada de ácido clorídrico (HCl) de concentração 2,0 mol/L. He deseja diluir essa solução até que sua concentração caia para 0,50 mol/L. Qual é o volume de água destilada, em mililitros, que deve ser adicionado por esse técnico para realizar essa diluição?",solution:`1. Identificar os dados conhecidos: M_i = 2,0 mol/L, V_i = 100 mL, M_f = 0,50 mol/L.
2. Aplicar a equação da diluição: M_i · V_i = M_f · V_f.
3. Substituir os valores para encontrar o volume final total (V_f): 2,0 · 100 = 0,50 · V_f => 200 = 0,50 · V_f => V_f = 200 / 0,50 = 400 mL.
4. Calcular o volume de água adicionada: V_adicionado = V_f - V_i = 400 mL - 100 mL = 300 mL.

uas linhas de argumentação autoral própria, dissecando as causas e consequências reais do problema na sociedade brasileira contemporânea.",commonTraps:"O famoso 'repertório solto' (jogar uma citação do Kant ou Bauman e não explicar como ela se conecta com o tema ou com o seu argumento). Isso derruba sua nota na Competência 2 (repertório sem uso produtivo) e na Competência 3 (falha na coerência argumentativa)."},conclusion:{title:"Conclusão Nota 200 (Comp. 5)",sections:[{label:"1. Agente",text:"Quem vai executar a ação? (MEC, Ministério da Saúde, Mídia, Família, Escolas, ONGs)."},{label:"2. Ação",text:"O que será feito concretamente para atenuar o problema?"},{label:"3. Meio / Modo",text:"Como essa proposta será colocada em prática? (Ex: 'por meio de investimentos prioritários...')."},{label:"4. Detalhamento",text:"Um detalhe extra sobre um dos elementos já citados (geralmente detalhar o Meio/Modo ou o Agente)."},{label:"5. Finalidade",text:"Para que serve essa proposta? Qual o objetivo a longo prazo? (Ex: 'com o fito de consolidar as diretrizes de igualdade...')."}],modelText:"Conclusão = Tópico Frasal + Agente + Ação + Meio + Detalhamento + Finalidade + Fechamento Cíclico",enem2026Focus:"Certifique-se de que o detalhamento seja extremamente explícito e indiscutível. O método mais seguro para pontuar 200 na Competência 5 é detalhar o Meio/Modo adicionando uma explicação acessória ou explicando minuciosamente as ferramentas ou sub-ações envolvidas.",commonTraps:"Utilizar agentes vagos como 'Governo' (sem especificar o Ministério) ou 'Alguém', 'Ninguém', 'A gente'. Outro erro grave é esquecer o fechamento cíclico do texto, que retoma de forma poética e coerente a mesma alusão utilizada no início da introdução."},intro_filosofica:{title:"Introdução Coringa (Filosófica)",sections:[{label:"1. Tese do Filósofo",text:"Inicie citando um postulado filosófico amplo aplicável a contradições (ex: Aristóteles sobre a felicidade pública)."},{label:"2. Paralelo Temático",text:"Use conectivos de oposição (No entanto, Todavia) para mostrar que a realidade nacional nega a harmonia descrita."},{label:"3. Tese Bifurcada",text:"Apresente os dois entraves: de um lado a omissão governamental e de outro a conivência social e passiva."}],modelText:"Introdução Filosófica = Conceito Universal + Contraste com Tema + Argumentos A e B",enem2026Focus:"Excelente para temas que tratam de dilemas éticos, cidadania negligenciada, bem-estar social incompleto ou injustiças aceitas por conveniência.",commonTraps:"Nacionalizar erroneamente o filósofo. Sempre certifique-se de não dizer que pensadores gregos ou europeus se referiam diretamente ao Brasil colonial ou imperial."},intro_historica:{title:"Introdução Coringa (Histórica)",sections:[{label:"1. Evento Histórico",text:"Aborde um marco temporal forte de fundação ou desenvolvimento (ex: Revolução Industrial, Brasil Colonial)."},{label:"2. Herança Crônica",text:"Mostre que as raízes do problema em debate estão fincadas nessa conjuntura antiga, estendendo-se ao presente."},{label:"3. Formulação da Tese",text:"Indique que a superação desse atraso secular é barrada pela lentidão burocrática e cegueira pública."}],modelText:"Introdução Histórica = Marco Antigo + Herança Contemporânea + Tese Explicativa",enem2026Focus:"Use para debater temas que possuem forte carga estrutural: desigualdade agrária, racismo, preconceito regional ou burocracia excessiva.",commonTraps:"Gastar todo o parágrafo descrevendo o fato histórico. O contexto histórico deve ocupar no máximo 3 linhas; o restante do parágrafo é argumentação pura."},intro_cultura_pop:{title:"Introdução Coringa (Cinema e Música)",sections:[{label:"1. Obra Pop",text:"Cite um filme, série ou canção que represente de forma metafórica o dilema em questão (ex: Admirável Chip Novo)."},{label:"2. Transposição Fática",text:"Esclareça que, fora das telas ou estrofes líricas, a distopia ou drama retratado se materializa no cotidiano brasileiro."},{label:"3. Tese de Direitos",text:"Apresente a urgência de romper esse ciclo alienante combatendo a negligência de agentes reguladores."}],modelText:"Introdução Pop = Ficção/Arte + Paralelo com o Real + Direcionamento de Tese",enem2026Focus:"Gera excelente apelo de originalidade na Competência 2, demonstrando habilidade de transposição interdisciplinar com repertório contemporâneo.",commonTraps:"Esquecer de classificar o tipo de obra (ex: 'longa-metragem', 'canção autoral', 'série dramática') ou errar o nome do criador/autor principal."},intro_constitucional:{title:"Introdução Coringa (Constitucional)",sections:[{label:"1. Artigo da Carta Magna",text:"Referencie o Artigo 6º ou 196º ou 205º que assegura um direito social fundamental universal."},{label:"2. Discrepância Material",text:"Contraste imediatamente a promessa constitucional garantida em papel com a barreira fática vivida pelo brasileiro."},{label:"3. Denúncia Argumentativa",text:"Articule que a perpetuação dessa ineficácia legislativa decorre do descaso do poder público e do silêncio coletivo."}],modelText:"Introdução Constitucional = Promessa Cidadã + Abismo de Realidade + Tese de Omissão",enem2026Focus:"O modelo mais seguro para iniciar qualquer redação. A Constituição de 1988 é aplicável a literalmente 100% dos temas possíveis do ENEM.",commonTraps:"Escrever 'Constituição Federal Brasileira de 1988' em letras minúsculas ou sem a devida concordância de sigla (CF/88). Use sempre iniciais maiúsculas."},intro_literaria:{title:"Introdução Coringa (Literatura)",sections:[{label:"1. Romance Literário",text:"Inicie descrevendo a situação de um personagem marcante da literatura nacional (ex: Fabiano em Vidas Secas)."},{label:"2. Extrapolação do Livro",text:"Evidencie que a amarra ficcional que sufocava o personagem ainda limita a existência de milhares de cidadãos contemporâneos."},{label:"3. Apresentação da Tese",text:"Defina que o combate a essa desumanização exige reforma institucional e engajamento civil sistemático."}],modelText:"Introdução Literária = Personagem/Enredo + Extrapolação Real + Alvo Argumentativo",enem2026Focus:"Traz imenso valor estético e estilístico à redação, encantando a banca corretora pela sensibilidade interpretativa do candidato.",commonTraps:"Dar spoiler do final do livro de forma desnecessária ou descrever detalhes do enredo que não dialogam diretamente com o tema do ENEM solicitado."},dev_causa_conseq:{title:"Desenvolvimento (Causa e Consequência)",sections:[{label:"1. Tópico Frasal",text:"Inicie afirmando que a principal causa do entrave reside na ineficiência do planejamento governamental."},{label:"2. Causa Profunda",text:"Apresente o repertório legitimado que embase essa negligência (ex: Milton Santos e as cidadanias mutiladas)."},{label:"3. Consequência Social",text:"Mostre o efeito imediato na vida do cidadão vulnerável (perda de oportunidades, adoecimento, exclusão)."}],modelText:"D1 = Tópico de Causa + Repertório de Amparo + Impacto Consequente",enem2026Focus:"Demonstre de forma clara a relação de causa e efeito. Use conectivos como 'por conseguinte', 'como efeito', 'disso decorre'.",commonTraps:"Trocar as causas pelas consequências. Lembre-se: o descaso estatal gera a marginalização, e não o oposto."},dev_fatores_historicos:{title:"Desenvolvimento (Fatores Históricos)",sections:[{label:"1. Tópico Frasal",text:"Pontue que o problema está intrinsecamente ligado a heranças coloniais e processos de exclusão secular do país."},{label:"2. Análise da Herança",text:"Conecte com uma alusão histórica forte (ex: Lei Áurea sem políticas públicas inclusivas pós-abolição)."},{label:"3. Efeito Residual",text:"Conclua criticando a inércia da sociedade que naturaliza e reproduz preconceitos e privilégios estruturais herdados."}],modelText:"D2 = Tópico de Herança Histórica + Alusão do Passado + Crítica ao Presente Herdado",enem2026Focus:"Demonstre erudição histórica conectando o passado colonial diretamente com os índices de desigualdade do Brasil atual.",commonTraps:"Fazer anacronismos ou confundir séculos de ocorrência de marcos (ex: datar o Iluminismo no século XIX ou o descobrimento no século XVII)."},dev_negligencia_governo:{title:"Desenvolvimento (Negligência Estatal)",sections:[{label:"1. Tópico de Omissão",text:"Declare que a lentidão regulatória do aparelho estatal impede que as leis protetivas tenham eficácia prática."},{label:"2. Embasamento Teórico",text:"Introduza uma base conceitual forte (ex: o Contrato Social de Hobbes violado pela falta de proteção social)."},{label:"3. Crítica ao Estado",text:"Evidencie que o governo age de forma reativa e superficial, priorizando interesses mercantis acima de vidas."}],modelText:"Parágrafo = Tópico de Omissão + Teoria do Contrato + Crítica ao Descaso Público",enem2026Focus:"Ideal para estruturar a principal linha argumentativa em temas que envolvem falta de fiscalização, escassez de verbas ou ausência de leis.",commonTraps:"Apenas xingar o Estado sem dar embasamento acadêmico. Use teorias políticas sólidas (Hobbes, Locke, Rousseau) para legitimar a crítica."},dev_inercia_social:{title:"Desenvolvimento (Inércia e Silêncio)",sections:[{label:"1. Tópico de Alienação",text:"Indique que a indiferença de grande parte da sociedade atua como engrenagem que perpetua a invisibilidade do problema."},{label:"2. Embasamento Sociológico",text:"Cite um autor que aborde a cegueira ou indiferença coletiva (ex: Georg Simmel e a Atitude Blasé)."},{label:"3. Desfecho Crítico",text:"Aponte como a busca por bem-estar próprio e bolhas de consumo reduzem a empatia mútua entre os cidadãos."}],modelText:"Parágrafo = Tópico de Indiferença + Sociologia do Silêncio + Crítica ao Egoísmo Coletivo",enem2026Focus:"Perfeito para o Desenvolvimento 2, equilibrando a crítica governamental do D1 com uma severa e bem-feita análise comportamental da própria população.",commonTraps:"Generalizar dizendo que toda a sociedade é egoísta de forma agressiva. Prefira falar em 'enfraquecimento dos laços comunitários' ou 'naturalização de mazelas'."},dev_contraste:{title:"Desenvolvimento (Contraste de Realidades)",sections:[{label:"1. Tópico de Dualidade",text:"Apresente a disparidade aberrante entre as regiões centrais ricas e as periferias abandonadas do país."},{label:"2. Repertório Geográfico",text:"Introduza um conceito sobre espaço e cidadania (ex: Cidadanias Mutiladas de Milton Santos)."},{label:"3. Retrato Fático",text:"Fale sobre a falta de saneamento, transporte digno e segurança que mutilam o exercício pleno de direitos periféricos."}],modelText:"Parágrafo = Tópico de Dualidade + Geografia de Milton Santos + Retrato da Periferia",enem2026Focus:"Cirúrgico para temas que abordam desigualdade habitacional, racismo ambiental, saneamento básico deficitário e falta de infraestrutura pública.",commonTraps:"Ser excessivamente descritivo. Não liste apenas os problemas da favela; explique que essa exclusão é um projeto geográfico e político de segregação."},dev_bauman:{title:"Desenvolvimento (Modernidade Líquida)",sections:[{label:"1. Tópico de Volatilidade",text:"Pontue que o imediatismo e a descartabilidade das relações na contemporaneidade esvaziam o debate político denso."},{label:"2. Repertório do Autor",text:"Explique o conceito de Modernidade Líquida de Zygmunt Bauman, pautado pela fragilidade de laços e instituições."},{label:"3. Conexão Temática",text:"Mostre como as políticas públicas e o cuidado social se tornaram efêmeros e passageiros, gerando desamparo contínuo."}],modelText:"Parágrafo = Tópico de Liquidez + Conceito de Bauman + Crítica à Efemeridade das Ações",enem2026Focus:"Muito forte para temas sobre redes sociais, consumismo desenfreado, ansiedade na juventude, precarização do trabalho e descarte ecológico.",commonTraps:"Usar Bauman para falar estritamente de amor líquido quando o tema exige um viés político-social público. Conecte sempre ao aspect coletivo institucional."},dev_foucault:{title:"Desenvolvimento (Sociedade de Controle)",sections:[{label:"1. Tópico de Vigilância",text ora",text:"Apresente a tese de Hannah Arendt sobre a Banalidade do Mal (o mal executado de forma burocrática e impessoal)."},{label:"3. Conexão Social",text:"Demonstre como a conivência passiva de vizinhos ou colegas perpetua o bullying escolar ou a violência doméstica."}],modelText:"Parágrafo = Tópico de Anestesia Ética + Banalidade do Mal + Crítica à Omissão Coletiva",enem2026Focus:"Crucial para temas sobre violência doméstica, intolerância religiosa, assédio em redes e negligência com minorias invisíveis das ruas.",commonTraps:"Associar o conceito à maldade psicopática individual. Explique que o cerne do conceito é a ausência de reflexão e a obediência cega ao sistema."},dev_byung_chul_han:{title:"Desenvolvimento (Sociedade do Cansaço)",sections:[{label:"1. Tópico de Autoexploração",text:"Aponte que a obsessão contemporânea por performance extrema adoece mentalmente a classe trabalhadora e estudantil."},{label:"2. Teoria do Autor",text:"Cite a tese de Byung-Chul Han sobre a Sociedade do Cansaço (indivíduo como vítima e carrasco de si mesmo)."},{label:"3. Reflexo Fático",text:"Fale sobre a escalada de Síndromes de Burnout, transtornos de ansiedade clínica e dependências de medicamentos estimulantes."}],modelText:"Parágrafo = Tópico de Produtividade Tóxica + Sociedade do Cansaço + Análise do Adoecimento",enem2026Focus:"Incomparável para temas sobre saúde mental de jovens, precarização do trabalho uberizado, pressão estética corporativa ou pressões por vestibulares.",commonTraps:"Dizer que o problema é a preguiça do trabalhador. Ao contrário, o problema é o excesso nocivo de atividade voluntária autoimposta."},prop_mec:{title:"Proposta (Foco no MEC / Educação)",sections:[{label:"1. Agente",text:"Ministério da Educação (MEC), em parceria com as Secretarias Estaduais."},{label:"2. Ação",text:"Reformular as bases curriculares nacionais inserindo disciplinas obrigatórias de letramento midiático e digital."},{label:"3. Meio / Modo",text:"Mediante repasses prioritários de ,commonTraps:"Escrever frases longas demais logo na abertura do parágrafo, misturando o argumento com a citação do repertório que deveria vir depois."},uso_repertorio:{title:"Uso Produtivo do Repertório",sections:[{label:"1. Apresentação Neutra",text:"Insira a citação ou fato de forma clara, identificando o autor, filósofo ou marco histórico legitimado."},{label:"2. Conexão Dialógica",text:"Explique como o repertório reflete ou contrapõe diretamente o problema do tema atual (uso produtivo)."},{label:"3. Crítica Autoral",text:"Arremate provando que a teoria do pensador se aplica perfeitamente à inércia do Brasil contemporâneo."}],modelText:"Uso Produtivo = Citação Legitimada + Conexão com o Tema + Análise Crítica Própria",enem2026Focus:"O uso produtivo é o pilar da Competência 2. Não basta que o repertório seja verídico, ele deve ser essencial para provar o seu ponto de vista.",commonTraps:"Colocar citações prontas e decoradas (ex: 'Kant diz que o homem é o que a educação faz dele') sem explicar o que isso tem a ver com o tema."},detalha_meio:{title:"Detalhamento por Meio/Modo",sections:[{label:"1. Conectivo Explicativo",text:"Inicie o detalhamento usando expressões acessórias seguras (como, por exemplo, a saber, isto é, por meio de)."},{label:"2. Sub-ação de Apoio",text:"Explique minuciosamente quais ferramentas práticas serão usadas ou exemplifique o meio proposto."},{label:"3. Desdobramento Prático",text:"Mostre que você domina a execução física do projeto proposto, dando contornos reais à ação."}],modelText:"Detalhamento Meio/Modo = Meio Proposto + ', como, por exemplo, [sub-ações operacionais concretas]'",enem2026Focus:"O método mais seguro para atingir os 40 pontos do detalhamento na Competência 5. É indiscutível e fácil de ser detectado pelo corretor.",commonTraps:"Fazer um detalhamento genérico que pareça apenas uma repetição da ação (ex: 'propor campanhas para conscientizar por meio de palestras que conscientizem')."},detalha_agente:{title:"Detalhamento por ve iniciar com conectivos que somem ou contraponham o anterior (Ademais, Paralelamente, Por outro lado)."},{label:"3. Transição de Conclusão",text:"A Conclusão deve iniciar obrigatoriamente com conectivos conclusivos (Portanto, Em suma, Infere-se, portanto)."}],modelText:"D1: 'Em primeiro plano...' | D2: 'Ademais...' / 'Paralelamente...' | Conclusão: 'Portanto, medidas são necessárias...'",enem2026Focus:"O uso correto e variado de conectivos interparágrafos é exigência explícita para obter 200 pontos na Competência 4 da TRI.",commonTraps:"Usar conectivos errados que passem a ideia oposta (ex: iniciar o D2 com 'No entanto' se os seus dois argumentos forem somas de problemas)."}},eixos:[{id:"educacao",name:"Educação",icon:"🏫",items:[{title:"Constituição Federal, Artigo 205",description:"Assegura que a educação é um direito de todos e um dever compartilhado entre o Estado e a família, visando ao pleno desenvolvimento humano.",comoAplicar:"Excelente para a Introdução ou início do Desenvolvimento. Contraste o ideal democrático do Artigo 205 com a realidade fática das barreiras de acesso escolar no país usando um conectivo adversativo.",enem2026Focus:"Excelente para denunciar a disparidade de acesso digital e tecnológico nas escolas públicas em comparação com as privadas.",commonTraps:"Cuidado para não confundir o Artigo 205 (direito de todos e dever do Estado e da família) com o Artigo 6º (que cita a educação genericamente como direito social)."},{title:"Documentário 'Pro dia nascer feliz'",description:"Exibe a cruel disparidade de recursos e infraestrutura pedagógica entre escolas públicas da periferia e colégios privados de elite.",comoAplicar:"Ideal para fundamentar argumentos sobre desigualdade social ou desigualdade de oportunidades e de recursos públicos nas escolas de regiões vulneráveis.",enem2026Focus:"Ideal para ilustrar a falta de infraestrutura física básica e de saneamento ou laboratórios que afeta o rendimento escolar nas periferias.",commonTraps:"Não se al
