zação escolar focadas na proteção do equilíbrio biótico para as novas gerações.",enem2026Focus:"Ideal para propostas de intervenção exigindo políticas de descarbonização e combate à obsolescência programada de eletrônicos.",commonTraps:"Explique o imperativo ético de Jonas: a sobrevivência das futuras gerações depende de contermos o avanço tecnológico predatório e desregrado de hoje."},{title:"Karl Marx (Fetichismo da Mercadoria)",description:"Explica a obsessão pelo consumo de supérfluos, que gera extração insustentável de recursos naturais e descarte em massa de detritos.",comoAplicar:"Aplique para evidenciar como o capitalismo tardio impulsiona o lixo eletrônico, a obsolescência planejada e a exploração desenfreada dos recursos do ecossistema.",enem2026Focus:"Conecte diretamente à geração absurda de microplásticos, fast fashion e descarte de lixo eletrônico em países em desenvolvimento.",commonTraps:"Foque na análise sociológica do consumismo e do ocultamento das relações de exploração, evitando termos com teor puramente partidário."}]},{id:"tecnologia",name:"Tecnologia e Mídia",icon:"📱",items:[{title:"Manual DSM-V (Nomofobia)",description:"Classifica e define a nomofobia (dependência psicológica extrema de smartphones e internet) como transtorno de ansiedade emergente.",comoAplicar:"Use para abordar o vício digital na infância, a ansiedade gerada pela busca de curtidas digitais ou as dificuldades de socialização presencial na era das telas.",enem2026Focus:"Cirúrgico para discutir o impacto do uso excessivo de telas no neurodesenvolvimento de crianças de primeira infância.",commonTraps:"Não defina a nomofobia como frescura ou bobeira. Use a terminologia médica correta de 'transtorno ou patologia emergente' para manter a formalidade."},{title:"Pierre Lévy (Inteligência Coletiva)",description:"Sustenta que a internet pode democratizar o saber universal se usada de forma coordenada e colaborativa.",comoAplicar:"Contraste esse potencial com a realidade da desinformação (fake news), da polarização extremista e das bolhas de algoritmos que segregam o debate público de alto nível.",enem2026Focus:"Use para discutir o potencial de inteligências artificiais na educação personalizada ou na inclusão digital de idosos, contrapondo à exclusão tecnológica.",commonTraps:"Não afirme que a internet gerou a inteligência coletiva por si só. Lévy fala de um potencial que é frequentemente sabotado por bolhas comerciais e fake news."}]}],coringas:[{title:"Georg Simmel (Atitude Blasé)",description:"Discorre sobre a indiferença de indivíduos das metrópoles diante de tragédias sociais recorrentes ao seu redor, naturalizando abusos e problemas urbanos por autoproteção psicológica.",comoAplicar:"Aplique em temas onde a própria sociedade se mostra apática diante de injustiças, como a persistência de pessoas em situação de rua ou a exclusão de idosos.",enem2026Focus:"Excelente para temas que abordam preconceitos invisíveis (como o etarismo ou o preconceito linguístico) ou negligências em saúde mental, nos quais a população se acostumou com a dor do outro.",commonTraps:"Evite afirmar que os cidadãos urbanos são inerentemente maus. Simmel postula que a atitude blasé é um escudo psicológico de defesa contra o excesso de estímulos da metrópole."},{title:"Carolina Maria de Jesus (A realidade do Despejo)",description:"Retrata o desamparo governamental extremo de minorias que vivem à margem das garantias jurídicas teóricas, evidenciando uma exclusão invisibilizada.",comoAplicar:"Perfeito para argumentar sobre a invisibilidade social de grupos historicamente silenciados e a falta de representatividade legislativa dessas populações.",enem2026Focus:"Pertinente para debates sobre segurança alimentar, desigualdade socioespacial, saneamento básico precário e o desamparo a mães solo e trabalhadoras periféricas.",commonTraps:"Evite citar apenas o nome do livro 'Quarto de Despejo'. Contextualize o diário como um retrato sociológico genuíno das disparidades socioeconômicas e do racismo estrutural brasileiro."},{title:"Gilberto Dimenstein (O Cidadão de Papel)",description:"Explica o paradoxo brasileiro onde os direitos sociais estão previstos perfeitamente na Constituição de 1988 (papel), mas permanecem inoperantes e inacessíveis na realidade fática.",comoAplicar:"O maior coringa do ENEM. Utilize em qualquer tema que possua legislação específica que, no entanto, falhe na aplicação prática por negligência executiva.",enem2026Focus:"Se houver descumprimento de qualquer direito fundamental garantido na Carta Magna (saúde, moradia, inclusão digital, proteção animal), o cidadão de papel fundamenta perfeitamente a tese.",commonTraps:"Não se limite a citar que o cidadão é de papel. Discorra sobre as causas da ineficácia estatal e a ausência de fiscalização civil que perpetuam a farsa legislativa."},{title:"Platão (O Mito da Caverna)",description:"Ilustra a manipulação ideológica de populações desprovidas de senso crítico, que confundem meras sombras projetadas (narrativas falsas) com a verdade real dos fatos.",comoAplicar:"Use para discutir a propagação em massa de notícias falsas, a falta de educação midiática nas escolas e a aceitação passiva de dogmas de preconceito social.",enem2026Focus:"Foco total na desinformação científica, circulação de mentiras na internet, bolhas algorítmicas de redes sociais e relutância em aceitar dados de órgãos oficiais de pesquisa.",commonTraps:"Cuidado para não gastar muitas linhas contando a historinha do mito. Use no máximo duas linhas para descrever a metáfora e o restante para conectá-la de forma produtiva ao problema atual."},{title:"Zygmunt Bauman (Modernidade Líquida)",description:"Propõe que as relações sociais, de consumo e institucionais na contemporaneidade são extremamente voláteis, fluidas e instáveis, pautadas pelo imediatismo, descartabilidade e ausência de laços fortes.",comoAplicar:"Utilize para discutir o consumismo exagerado, descarte irresponsável de resíduos (como lixo eletrônico), volatilidade nas redes sociais e busca desenfreada por dopamina rápida.",enem2026Focus:"Fundamental para temas sobre sustentabilidade, obsolescência programada, dependência tecnológica na juventude, precarização do trabalho (uberização) e a fragilidade das redes de apoio social.",commonTraps:"Não use a modernidade líquida apenas para falar de relacionamentos românticos passageiros. No ENEM, direcione o conceito para a mercantilização dos direitos e a efemeridade das políticas públicas."},{title:"Thomas Hobbes (O Contrato Social)",description:"Argumenta que o homem, no estado de natureza, vive ininterruptamente em conflito egoísta constante ('o homem é o lobo do homem'). Para sair do caos, pactua um acordo que dá origem ao Estado, responsável pela paz e integridade social.",comoAplicar:"Ideal para temas sobre segurança pública, violência doméstica, linchamentos virtuais, milícias ou qualquer falha governamental que exponha fisicamente o indivíduo ao perigo ou à barbárie.",enem2026Focus:"Indispensável se o tema tratar da proteção a minorias ameaçadas (indígenas, mulheres, quilombolas) ou de crises climáticas extremas nas quais o Estado falha na prevenção e acolhimento.",commonTraps:"Evite citar apenas a frase clichê 'o homem é o lobo do homem' sem contextualizar a quebra do contrato social. Explique que, quando o Estado falha em garantir a dignidade física, o pacto de cidadania é violado."},{title:"Hannah Arendt (A Banalidade do Mal)",description:"Postula que o mal, quando institucionalizado ou repetido sistematicamente, deixa de ser visto como monstruoso e passa a ser aceito como um comportamento normal, rotineiro e desprovido de reflexão ética pelas pessoas comuns.",comoAplicar:"Use para abordar problemas estruturais tolerados passivamente, como o bullying nas escolas, o descaso com o saneamento de favelas, a homofobia recreativa e o racismo diário.",enem2026Focus:"Altamente produtivo para temas de assédio moral corporativo, violência doméstica silenciosa e preconceitos enraizados que a sociedade presencia sem esboçar qualquer reação de mudança.",commonTraps:"Não use o conceito de Arendt para tratar de crimes isolados ou patológicos individuais. Direcione para a burocratização e normalização coletiva de injustiças estruturais."},{title:"Michel Foucault (Biopoder e Sociedade de Controle)",description:"Analisa como as instituições modernas estatais e corporativas gerenciam, vigiam e normatizam os corpos e os comportamentos dos indivíduos por meio de dispositivos disciplinares e regulatórios.",comoAplicar:"Perfeito para debater a vigilância algorítmica de dados privados, a patologização e controle de distúrbios de saúde mental, e a imposição de padrões estéticos corporais inalcançáveis.",enem2026Focus:"Ideal para discutir o monitoramento de buscas na internet pelas Big Techs, a coleta ilegal de biometria e o controle disciplinar de condutas em plataformas de rede social.",commonTraps:"Evite reduzir o biopoder a um regime militar ou ditatorial explícito. Mostre que, na contemporaneidade, esse controle ocorre de maneira sutil, invisível e voluntariamente aceita."},{title:"Pierre Bourdieu (Violência Simbólica)",description:"Define a imposição sutil e invisível de padrões culturais dominantes que fazem com que os próprios grupos dominados aceitem sua condição de exclusão como algo natural e legítimo.",comoAplicar:"Aplique em discussões sobre o preconceito linguístico, a desvalorização de religiões de matriz africana, a exclusão cultural em museus e a desigualdade de gênero estrutural.",enem2026Focus:"Crucial para temas que envolvem o estigma de sotaques regionais nas corporações, a invisibilidade de saberes indígenas e a desigualdade de oportunidades no ambiente acadêmico.",commonTraps:"Não confunda violência simbólica com agressão física ou verbal direta. Enfatize que sua principal característica é a invisibilidade e o consentimento inconsciente das próprias vítimas."},{title:"Byung-Chul Han (Sociedade do Cansaço)",description:"Discorre sobre a transição do modelo disciplinar foucaultiano para um modelo de autoexigência de produtividade extrema, no qual o indivíduo se torna carrasco e vítima de si mesmo.",comoAplicar:"Perfeito para debater o aumento vertiginoso de ansiedade e depressão na juventude, a precarização do trabalho digital e a obsessão pela performance pessoal ininterrupta.",enem2026Focus:"Cirúrgico para o tratamento da Síndrome de Burnout, o vício em dopamina rápida de rolagens infinitas em telas e a romantização do estresse no ecossistema corporativo atual.",commonTraps:"Não culpe apenas as empresas individuais pelo cansaço do trabalhador. Destaque que a sociedade do cansaço é uma estrutura cultural internalizada pelo sujeito, que se autoexplora voluntariamente."},{title:"Immanuel Kant (Menoridade Intelectual)",description:"Define a menoridade como a incapacidade humana de fazer uso do próprio entendimento sem a direção de outro indivíduo, motivada por preguiça, medo ou comodismo intelectual.",comoAplicar:"Use para criticar a submissão cega a influenciadores digitais, a dependência excessiva de algoritmos de inteligência artificial e a falta de senso crítico diante de fake news.",enem2026Focus:"Tema perfeito para combater a alienação digital de adolescentes, incentivar o pensamento crítico nas escolas e propor metodologias de letramento de mídia robustos.",commonTraps:"Não utilize a expressão 'menoridade intelectual' para se referir à faixa etária ou capacidade cognitiva biológica de crianças. Trata-se de uma postura filosófica de submissão do pensamento."},{title:"Jean-Paul Sartre (Má-Fé)",description:"Conceitua a má-fé como a tentativa do indivíduo de fugir da angústia da sua liberdade de escolha, fingindo ser desprovido de agência social e culpando as circunstâncias por sua inação moral.",comoAplicar:"Ideal para criticar a desculpa social generalizada de que 'as coisas sempre foram assim', justificando a permanência de desigualdades históricas ou comportamentos preconceituosos.",enem2026Focus:"Útil para temas sobre a omissão cidadã diante da crise climática, o descarte incorreto de lixo urbano e a falta de engajamento em causas humanitárias sob o pretexto de impotência.",commonTraps:"Não confunda 'má-fé' no sentido sartriano com mau-caratismo ou estelionato legal. Explique que é um autoengano existencial de quem nega a própria liberdade e responsabilidade social."},{title:"Aristóteles (A Felicidade Pública)",description:"Sustenta que a política e a organização do Estado têm como objetivo final supremo a promoção da 'Eudaimonia' (felicidade coletiva e vida virtuosa dos cidadãos), e não apenas o crescimento financeiro mercantil.",comoAplicar:"Utilize para fundamentar a obrigatoriedade de o Estado fornecer serviços básicos gratuitos de qualidade (lazer, praças, saúde mental, cultura) como premissas de felicidade ativa.",enem2026Focus:"Excelente para propostas de revitalização de espaços urbanos ociosos, fomento a parques públicos e preservação de patrimônios históricos imateriais para socialização comunitária saudável.",commonTraps:"Não confunda a eudaimonia aristotélica com hedonismo ou busca de prazer imediato. Trata-se de uma realização ética, de florescimento humano e justiça comunitária de longo prazo."},{title:"John Locke (Tábula Rasa)",description:"Argumenta que a mente humana nasce inteiramente limpa (como uma folha em branco) e que todo o conhecimento, moral e conduta social são preenchidos por meio das experiências sensoriais e da educação recebida.",comoAplicar:"O melhor argumento para defender o papel absoluto da escola e da família na erradicação de preconceitos históricos, mostrando que ninguém nasce racista ou preconceituoso.",enem2026Focus:"Essencial para defender a inclusão de disciplinas de empatia, combate à violência de gênero e educação financeira na base curricular das escolas de ensino básico.",commonTraps:"Evite citar apenas a metáfora da 'folha em branco' de forma poética e isolada. Conecte explicitamente com a tese de que o comportamento hostil contemporâneo é uma construção social reversível."},{title:"Paulo Freire (Educação Bancária)",description:"Critica o modelo educacional tradicional opressor no qual o professor apenas 'deposita' conteúdos em mentes passivas dos alunos, sem estimular o senso crítico e a leitura reflexiva do mundo real.",comoAplicar:"Use para propor reformas curriculares ativas, debater o declínio do engajamento estudantil e combater o analfabetismo funcional crônico de jovens.",enem2026Focus:"Perfeito para argumentar sobre a necessidade de letramento digital prático, desenvolvimento de competências socioemocionais e capacitação para autoria de projetos estudantis periféricos.",commonTraps:"Evite polemizar de forma ideológica partidária sobre o autor. Foque estritamente no valor sociológico e pedagógico da crítica à passividade estudantil no processo educativo nacional."},{title:"Milton Santos (Cidadanias Mutiladas)",description:"Discute como a desigualdade de infraestrutura geográfica e a falta de acesso a recursos urbanos básicos geram uma população que possui direitos formais, mas uma cidadania mutilada na prática cotidiana.",comoAplicar:"Perfeito para debater as distorções de transporte público periférico, a segregação de áreas de risco em temporais climáticos e a escassez de hospitais em regiões distantes.",enem2026Focus:"O melhor repertório para temas que envolvem o racismo ambiental, a desigualdade de saneamento básico entre bairros nobres e favelas, e a ausência de internet de alta velocidade no interior.",commonTraps:"Sempre cite o nome correto do geógrafo Milton Santos, destacando-o como um dos maiores intelectuais da história brasileira, o que engrandece significativamente a autoridade de seu texto."},{title:"Sérgio Buarque de Holanda (O Homem Cordial)",description:"Explica a tendência histórica da sociedade brasileira de priorizar as relações familiares e afetivas pessoais em detrimento das regras públicas impessoais, gerando patrimonialismo e nepotismo.",comoAplicar:"Aplique em temas que envolvam a corrupção administrativa, o desrespeito a leis de trânsito cotidianas, o 'jeitinho brasileiro' abusivo e o favorecimento pessoal em cargos públicos.",enem2026Focus:"Útil para analisar por que campanhas de conscientização cívica falham no Brasil quando o indivíduo prioriza o seu benefício próprio de curto prazo acima da lei coletiva.",commonTraps:"Cuidado extremo: no conceito sociológico, 'cordial' vem de coração (agir pela emoção, pelo afeto/ódio) e não de ser dócil ou educado. Explique isso claramente para impressionar o corretor."},{title:"Darcy Ribeiro (O Desperdício de Talentos)",description:"Argumenta que a crise crônica da educação brasileira não é um acidente de percurso de gestão, mas sim um projeto deliberado de exclusão operado pelas elites para manter o povo dócil e submisso.",comoAplicar:"Muito impactante para debater a evasão escolar na juventude periférica, o subfinanciamento de universidades públicas federais e a baixa remuneração de professores de base.",enem2026Focus:"Crucial para temas de trabalho infantil, disparidade de desempenho no Ideb entre escolas públicas e privadas, e a escassez de laboratórios de informática nas periferias.",commonTraps:"Não utilize termos de cunho excessivamente militante ou panfletário que firam a impessoalidade da redação. Aborde o 'projeto deliberado' sob o aspecto de negligência estrutural de prioridades orçamentárias."},{title:"Jürgen Habermas (Ação Comunicativa)",description:"Propõe que a emancipação social e a resolução de conflitos democráticos ocorrem por meio de debates racionais livres de coação, nos quais prevalece a força do melhor argumento fundamentado.",comoAplicar:"Contraste esse ideal democrático comunicativo com as modernas bolhas digitais extremistas de redes sociais, que barram o diálogo e promovem a polarização agressiva de ideias.",enem2026Focus:"Excelente para debater a desregulação das redes sociais, a urgência de códigos éticos digitais, o cancelamento sumário virtual e a desinformação orquestrada comercialmente.",commonTraps:"Não afirme que Habermas propõe censurar as redes. Ele defende a estruturação de uma esfera pública transparente, aberta, igualitária e com livre circulação de ideias baseadas em fatos."},{title:"Frantz Fanon (Alienamento Colonial)",description:"Investiga o sofrimento psicológico de populações racializadas que internalizam a inferioridade cultural imposta pelo colonizador, buscando mimetizar padrões estéticos e sociais que as excluem.",comoAplicar:"Aplique para analisar o preconceito estético contra cabelos crespos, a busca nociva por cirurgias plásticas de embranquecimento e o complexo de vira-lata cultural nacional.",enem2026Focus:"Perfeito para analisar o racismo institucional em processos seletivos corporativos e a marginalização histórica de linguagens artísticas periféricas (como o samba, o funk e o rap).",commonTraps:"Esclareça que, embora Fanon escrevesse no período de descolonização africana, seus conceitos de alienação estética e trauma psíquico racial se aplicam de forma fática na herança colonial do Brasil."},{title:"Noam Chomsky (A Fabricação do Consenso)",description:"Descreve como os grandes conglomerados de mídia de massa filtram, enquadram e simplificam as notícias cotidianas para moldar a opinião pública e distrair a população de debates socioeconômicos profundos.",comoAplicar:"Muito produtivo para discutir a espetacularização da violência em telejornais diários, a alienação por meio do entretenimento vazio e a invisibilização sistemática de lutas camponesas e indígenas.",enem2026Focus:"Tema excelente para analisar o controle invisível de fluxos de informação por big techs e como os feeds hiperpersonalizados reduzem o senso crítico do eleitor.",commonTraps:"Evite teorias de conspiração rasas na argumentação. Trate o processo sob uma perspectiva econômica de maximização de lucros e retenção da atenção do espectador."},{title:"Boaventura de Sousa Santos (Epistemicídio)",description:"Conceitua o epistemicídio como a destruição, desvalorização e silenciamento sistemático de formas de conhecimento e culturas alternativas produzidas por minorias oprimidas.",comoAplicar:"Essencial para combater o preconceito contra a medicina tradicional indígena, o desconhecimento de técnicas agrícolas quilombolas e a desvalorização acadêmica de intelectuais negros.",enem2026Focus:"Altamente recomendado para temas de preservação de línguas indígenas ameaçadas de extinção, salvaguarda de tradições orais sertanejas e inclusão curricular plural.",commonTraps:"Não restrinja o epistemicídio apenas a assassinatos físicos de minorias. O termo se refere estritamente à morte e aniquilação simbólica de seus saberes e conhecimentos históricos."},{title:"Ulrich Beck (Sociedade de Risco)",description:"Postula que a modernidade industrial avançada gera perigos globais invisíveis (químicos, ambientais, biológicos e cibernéticos) que transcendem fronteiras nacionais e escapam ao controle protetor de instituições.",comoAplicar:"Perfeito para debater as mudanças climáticas severas, contaminação de águas por agrotóxicos em excesso, vazamento em massa de dados cibernéticos e pandemias mundiais recorrentes.",enem2026Focus:"Destaque o desamparo de populações litorâneas diante do aumento do nível do mar ou a exposição de trabalhadores rurais a pesticidas proibidos sem equipamentos protetores.",commonTraps:"Evite tratar riscos ambientais contemporâneos apenas como fatalidades naturais. Explique, baseado em Beck, que estes riscos são produtos diretos do modelo de desenvolvimento tecnológico-industrial."},{title:"Émile Durkheim (Anomia Social)",description:"Define a anomia como o estado de ausência de regras claras ou de desintegração das normas sociais reguladoras, deixando os indivíduos desorientados e as instituições fragilizadas diante de crises morais.",comoAplicar:"Aplique em temas de criminalidade juvenil em expansão, crises éticas nas esferas de governabilidade e descumprimento rotineiro de normas básicas de convivência civil.",enem2026Focus:"Excelente para analisar o aumento das taxas de suicídio entre jovens devido à falta de coesão comunitária e a desregulação do tempo livre diante de dependências digitais.",commonTraps:"Não confunda anomia com desordem física temporária ou vandalismo de rua. É uma patologia social crônica caracterizada pelo enfraquecimento fático da força moral e integradora da lei."},{title:"Simone de Beauvoir (A Construção Social de Gênero)",description:"Defende que os papéis sociais, limitações e expectativas atribuídos às mulheres não são características biológicas inatas, mas sim construções culturais elaboradas para sustentar a submissão feminina.",comoAplicar:"O maior repertório para debater a desigualdade salarial de gênero, a tripla jornada de trabalho feminino, a violência doméstica crônica e a baixa representatividade feminina na política.",enem2026Focus:"Cirúrgico para propor reformas na divisão do trabalho de cuidado invisibilizado doméstico e combater a hipersexualização de meninas em mídias de massa nacionais.",commonTraps:"Não desvie da tese de que a opressão é socialmente construída. Evite basear sua redação em clichês emocionais e foque nas amarras sociológicas descritas pela autora francesa."},{title:"Adorno e Horkheimer (Indústria Cultural)",description:"Demonstra como as manifestações artísticas na modernidade foram mercantilizadas e transformadas em mercadorias de consumo rápido, padronizando os gostos coletivos e anulando a reflexão política do público.",comoAplicar:"Excelente para criticar a superficialidade de conteúdos virais de vídeos curtos, a espetacularização da dor humana em programas de fofocas e o consumo musical descartável.",enem2026Focus:"Use para abordar o declínio do pensamento crítico juvenil, o desinteresse por clássicos literários e a dependência de algoritmos que priorizam o engajamento visual raso.",commonTraps:"Não generalize dizendo que toda arte moderna é inútil. Explique que o problema reside na lógica industrial capitalista que subordina a expressão artística criativa ao lucro de curto prazo."},{title:"Karl Marx (Fetichismo da Mercadoria)",description:"Explica como a relação social entre os trabalhadores que produzem um bem é mascarada pela adoração à própria mercadoria final, que ganha uma aura de vida própria independente do esforço humano.",comoAplicar:"Ideal para discutir o consumismo ostentação de marcas de luxo que geram endividamento de jovens de baixa renda, a exploração anônima de confecções têxteis e o descarte desenfreado.",enem2026Focus:"Excelente para debater a obsolescência programada de smartphones, o descarte de lixo eletrônico poluente e a invisibilidade dos trabalhadores de aplicativos de entrega.",commonTraps:"Evite o uso de terminologias de viés partidário extremo. Utilize uma abordagem puramente sociológica, focando na desumanização das relações e na coisificação do indivíduo produtor."},{title:"Achille Mbembe (Necropolítica)",description:"Investiga como o poder estatal soberano decide quais vidas humanas têm valor e devem ser ativamente protegidas pelo Estado, e quais vidas são consideradas descartáveis e podem ser deixadas à morte de forma sistêmica.",comoAplicar:"Altamente recomendável para temas de violência policial em favelas, o descaso hospitalar com grávidas negras periféricas e a exposição de comunidades ribeirinhas a poluições tóxicas industriais.",enem2026Focus:"Pertinente para debater a alta taxa de homicídios de jovens negros no Brasil, o descaso sanitário com povos indígenas da Amazônia e o abandono de pessoas em situação de rua extrema.",commonTraps:"Este é um conceito de extrema seriedade e impacto acadêmico. Evite aplicá-lo em problemas cotidianos menores de baixa letalidade física. Reserve para violações graves à vida física humana."},{title:"Edgar Morin (Pensamento Complexo)",description:"Critica a fragmentação e hipersimplificação do saber escolar tradicional e defende uma visão integrada de conexões que perceba a interdependência sistêmica de todas as crises humanas.",comoAplicar:"Use para defender propostas de intervenção educacionais interdisciplinares e transdisciplinares que tratem simultaneamente de saúde, tecnologia e sustentabilidade nas escolas.",enem2026Focus:"Perfeito para argumentar por que o combate às mudanças climáticas ou epidemias exige o letramento sistêmico-científico e ambiental integrado na educação brasileira básica.",commonTraps:"Não sugira que as matérias escolares tradicionais devam ser extintas. Destaque que o pensamento complexo propõe a união e o diálogo interdisciplinar contínuo entre elas para resolver problemas fáticos."},{title:"Machado de Assis (Teoria do Medalhão)",description:"Através da ironia de um pai que aconselha o filho de como se destacar socialmente sem ter ideias originais, critica a cultura da superficialidade, valorização das aparências vazias e falta de conteúdo real.",comoAplicar:"Coringa literário brasileiro perfeito para temas de futilidade e busca por fama instantânea nas redes sociais, ostentação de vidas de mentira e esvaziamento do intelecto acadêmico.",enem2026Focus:"Destaque a futilidade das métricas de vaidade digitais (seguidores e curtidas) e a valorização de pseudocientistas e influenciadores digitais vazios em detrimento de profissionais qualificados.",commonTraps:"Sempre identifique o autor (Machado de Assis), localize temporalmente a obra (Realismo do século XIX) e explique o tom profundamente irônico e crítico do texto literário."},{title:"Robert Castel (Desfiliação Social)",description:"Analisa a desfiliação como a perda gradativa dos laços sociais, de proteção civil e de garantias de trabalho, empurrando o indivíduo da estabilidade para uma zona de vulnerabilidade extrema e completo abandono social.",comoAplicar:"Excelente para debater a informalidade trabalhista, a falta de registro em carteira de prestadores de serviços, a falência do sistema previdenciário e a marginalização urbana de desempregados.",enem2026Focus:"Muito produtivo para o debate de precarização do trabalho via aplicativos de entrega (uberização) e a ausência fática de amparos em acidentes de trabalho de autônomos periféricos.",commonTraps:"Diferencie 'desfiliação' de 'pobreza' simples. A desfiliação descreve o processo dinâmico de enfraquecimento das estruturas de sociabilidade e trabalho que protegiam o cidadão do abismo social."}],alusoes:[{id:"al-1",title:"Grécia e Roma Antiga",description:"Origem da cidadania e da democracia excludentes. No ENEM, serve para contrastar o ideal democrático com o preconceito e a negação de direitos de minorias hoje.",keywords:["Cidadania","Democracia","Segregação"],comoAplicar:"Demonstre como, apesar de milênios de evolução política desde Atenas, a cidadania no Brasil atual ainda replica exclusões análogas para populações vulneráveis.",enem2026Focus:"Excelente para contrapor a exclusão de grupos sub-representados no debate político e social brasileiro, tais como mulheres e populações indígenas, mostrando o distanciamento da verdadeira isonomia democrática.",commonTraps:"Não cometa o erro de idealizar Atenas como uma democracia perfeita. Lembre-se e pontue no texto que mulheres, escravos e estrangeiros eram terminantemente excluídos da cidadania antiga."},{id:"al-2",title:"Revolução Industrial (Século XVIII)",description:"Mecânica da exploração laboral massiva, surgimento de poluição desenfreada, jornadas de trabalho desumanas e consolidação do consumismo de massa.",keywords:["Consumismo","Poluição","Trabalho"],comoAplicar:"Conecte as pressões trabalhistas modernas (uberização), o estresse de metas inalcançáveis ou a degradação ambiental acelerada à herança utilitarista desse marco.",enem2026Focus:"Tema de extrema relevância face às discussões globais sobre pegada de carbono, justiça climática, saúde do trabalhador na economia de plataformas e o ritmo desenfreado da sociedade do desempenho.",commonTraps:"Evite focar apenas nas máquinas a vapor ou aspectos tecnológicos do século XVIII. O corretor busca a análise sociológica: a transformação do trabalhador em mera engrenagem mercantil."},{id:"al-3",title:"Ditadura Militar no Brasil (1964-1985)",description:"Período marcado pela restrição à liberdade de expressão, perseguição ideológica, censura institucionalizada promovida pelo DIP e violações graves de direitos humanos.",keywords:["Censura","Liberdade de Expressão","Autoritarismo"],comoAplicar:"Contraste com a consolidação da democracia em 1988 e use para denunciar tentativas modernas de silenciar grupos minoritários ou restringir o pensamento livre nas redes.",enem2026Focus:"Útil em discussões sobre liberdade de expressão na era das mídias sociais, direito à informação de qualidade, preservação da memória histórica nacional e integridade das instituições públicas.",commonTraps:"Não faça juízos de valor de caráter partidário ou político-panfletário. Mantenha a neutralidade acadêmica referenciando fatos históricos e jurídicos, como o AI-5 ou a Lei da Anistia."},{id:"al-4",title:"A Crise Financeira de 1929",description:"Queda da bolsa de Nova York provocada por superprodução desenfreada e especulação financeira selvagem, resultando em fome mundial e miséria sistêmica.",keywords:["Consumo","Capitalismo","Crise Econômica"],comoAplicar:"Mostre como a ausência de mechanisms reguladores rígidos sobre o mercado livre deságua em catástrofes sociais inevitáveis, exigindo a tutela do Estado.",enem2026Focus:"Perfeito para abordar crises humanitárias contemporâneas, o impacto do desemprego estrutural nas famílias de baixa renda e a necessidade urgente de programas robustos de transferência de renda estatal.",commonTraps:"Não se perca na explicação técnica do crash da bolsa de valores. Foque no impacto humano: a fome, o desemprego de massa e a falência dos sistemas de bem-estar social."},{id:"al-5",title:"Iluminismo (Século XVIII)",description:"Movimento intelectual que colocou a razão, a ciência e a liberdade individual como pilares contra a opressão absolutista e o obscurantismo religioso.",keywords:["Razão","Ciência","Direitos Individuais"],comoAplicar:"Defenda a importância do método científico ou de políticas de tolerância civil citando o imperativo iluminista da racionalidade em oposição a boatos digitais.",enem2026Focus:"Altamente produtivo para temas de negacionismo científico, combate à desinformação vacinal ou intolerância religiosa nas redes sociais.",commonTraps:"Não trate o Iluminismo como isento de falhas. Lembre-se de que os pensadores iluministas frequentemente ignoravam a desigualdade de gênero e a escravidão fática de sua época."},{id:"al-6",title:"Lei Áurea (1888)",description:"Decreto legal que aboliu formalmente a escravidão no Brasil, porém desprovido de qualquer amparo habitacional, profissional ou educacional para os libertos.",keywords:["Racismo Estrutural","Inclusão Social","Legislação"],comoAplicar:"Explique como a ausência de políticas públicas de inclusão pós-1888 perpetuou a marginalização geográfica e econômica da população negra.",enem2026Focus:"Base sociológica perfeita para temas de racismo estrutural, desigualdade de renda racial, precarização do trabalho doméstico ou segregação espacial nas favelas.",commonTraps:"Não trate a Princesa Isabel como a única heroína da abolição. Destaque a luta dos intelectuais e movimentos abolicionistas negros da época (como Luiz Gama e André Rebouças)."},{id:"al-7",title:"Constituição de Weimar (1919)",description:"Marco jurídico alemão que pioneiramente inseriu os direitos sociais (como saúde, educação e trabalho) na estrutura constitucional nacional básica.",keywords:["Direitos Sociais","Cidadania","Justiça Social"],comoAplicar:"Mostre como a Constituição alemã de Weimar inspirou a noção moderna de que o Estado deve ser provedor ativo de bem-estar social e não mero espectador comercial.",enem2026Focus:"Aplique para defender o dever inalienável do Estado brasileiro na prestação de saúde básica, educação inclusiva e moradia de interesse social.",commonTraps:"Não confunda a República de Weimar com o regime que a sucedeu. Pontue que a sua fragilidade institucional e crise socioeconômica permitiram a ascensão do extremismo."},{id:"al-8",title:"Segunda Guerra Mundial (1939-1945)",description:"Conflito global que expôs os limites da barbárie humana, culminando na criação da ONU e na posterior redação dos Direitos Humanos.",keywords:["Direitos Humanos","Barbárie","Guerra"],comoAplicar:"Use para argumentar como o desrespeito absoluto à alteridade e a xenofobia resultaram na maior catástrofe humanitária do século XX, justificando a urgência do respeito mútuo.",enem2026Focus:"Excelente para debater a crise mundial de refugiados climáticos, intolerância étnica, discursos de ódio organizados digitalmente e ascensão do neonazismo.",commonTraps:"Evite descrições táticas ou militares. O corretor do ENEM busca a dimensão ética e geopolítica das consequências humanitárias e humanitárias do conflito."},{id:"al-9",title:"Guerra Fria e a Corrida Espacial",description:"Período de intensa disputa geopolítica e militar indireta entre EUA e URSS, que catalisou avanços tecnológicos em comunicação e satélites artificiais.",keywords:["Tecnologia","Polarização","Geopolítica"],comoAplicar:"Mostre como o fomento tecnológico motivado pela disputa por hegemonia militar criou a infraestrutura técnica das nossas redes de dados e vigilância atuais.",enem2026Focus:"Apropriado para discutir o controle de dados privados por grandes potências globais, a soberania tecnológica nacional e a militarização de sistemas de informação.",commonTraps:"Evite debates maniqueístas ou ideológicos rasos sobre qual polo era 'melhor'. Aborde de maneira neutra e sociológica o impacto geopolítico e tecnológico global."},{id:"al-10",title:"Revolução Francesa (1789)",description:"Movimento burguês e popular que derrubou o Antigo Regime sob o lema de 'Liberdade, Igualdade e Fraternidade', fundando a base jurídica moderna ção), exploração de estagiários, direitos de minorias no ambiente corporativo e assédio moral.",commonTraps:"Evite elogiar de forma cega ou partidária a figura de Getúlio Vargas. Aborde a CLT como uma conquista social consolidada de forma regulatória e estratégica pelo Estado."},{id:"al-13",title:"A Peste Negra (Século XIV)",description:"Pandemia de peste bubônica que dizimou um terço da população europeia devido à ausência de infraestrutura sanitária urbana e desconhecimento científico básico.",keywords:["Saúde Pública","Saneamento","Ciência"],comoAplicar:"Mostre como a falta de saneamento básico e higiene pública expõe os povos a riscos biológicos extremos, justificando a centralidade de serviços sanitários preventivos.",enem2026Focus:"Poderoso para temas de saneamento básico deficitário no Brasil, epidemias recorrentes de dengue e zika nas favelas, e a importância de políticas sanitárias públicas.",commonTraps:"Não compare diretamente a letalidade biológica da peste medieval com doenças atuais de forma exagerada. Foque no paralelo estrutural da falta de higiene pública."},{id:"al-14",title:"Feudalismo e a Sociedade Estamental",description:"Organização medieval baseada em estamentos rígidos, onde a posição de nascimento determinava todos os privilégios e a mobilidade social era nula.",keywords:["Desigualdade","Mobilidade Social","Privilégios"],comoAplicar:"Compare a estrutura rígida feudal com o Brasil contemporâneo, no qual o CEP de nascimento e a classe dos pais continuam determinando drasticamente o futuro escolar.",enem2026Focus:"Indispensável para argumentar sobre a falta de mobilidade social ascendente, a perpetuação da pobreza de geração para geração e a meritocracia ilusória.",commonTraps:"Não diga que o Brasil vive um feudalismo literal. Diga que a desigualdade fática brasileira reproduz amarras sociais análogas às da rigidez estamental medieval."},{id:"al-15",title:"Renascimento Cultural e Científico",description:"Movimento intelectual que reposicionou o gna no interior.",enem2026Focus:"Tema potente para debater a desigualdade regional Norte-Sul, a negligência em relação ao sertão nordestino e a repressão violenta a minorias que criam redes de apoio mútuo.",commonTraps:"Não resuma Canudos a uma disputa puramente religiosa. Mostre que o cerne do conflito era a miséria, a falta de terras agrícolas e a ausência fática de amparo estatal."},{id:"al-18",title:"Revolta da Vacina (1904)",description:"Levante popular no Rio de Janeiro contra a vacinação obrigatória da varíola, impulsionado por reformas higienistas autoritárias e ausência absoluta de campanhas de esclarecimento.",keywords:["Saúde Pública","Comunicação Estatal","Autoritarismo"],comoAplicar:"Evidencie que o sucesso de qualquer medida de saúde pública depende de educação científica prévia e diálogo democrático, e não apenas de imposição governamental.",enem2026Focus:"Perfeito para analisar as raízes históricas do ceticismo vacinal, falhas em campanhas publicitárias informativas do Ministério da Saúde e desconfiança na ciência.",commonTraps:"Não criminalize a população revoltada de 1904. Explique que o povo reagiu à truculência da polícia higienista e à invasão de suas casas, em um ambiente sem informação de qualidade."},{id:"al-19",title:"Urbanização Higienista de Pereira Passos",description:"Reforma urbana no início do século XX que promoveu o 'bota-abaixo' de cortiços e moradias populares no centro do Rio para embelezar a cidade sob moldes parisienses.",keywords:["Segregação Espacial","Gentrificação","Moradia"],comoAplicar:"Conecte este marco histórico ao surgimento do processo de favelização desordenada, provocado pela expulsão de trabalhadores vulneráveis para morros periféricos sem infraestrutura.",enem2026Focus:"Indispensável para discutir a desigualdade de acesso à moradia digna, gentrificação, direito à cidade, transporte público periférico e saneamento inadequado.",commonTraps:"Evite focar apenas na estética da 'Belle Époque'. Foque nos efeitos colaterais excludentes que empurraram os trabalhadores mais pobres para as franjas geográficas urbanas."},{id:"al-20",title:"Romance Naturalista 'O Cortiço' (1890)",description:"Obra literária de Aluísio Azevedo que retrata a vida precária e coletiva em uma estalagem do Rio de Janeiro, denunciando o determinismo social e as patologias urbanas.",keywords:["Socioespacial","Moradia Precária","Literatura"],comoAplicar:"Use para ilustrar a falta histórica de planejamento habitacional no Brasil, onde a escassez de espaço digno força os indivíduos à coabitação insalubre e à promiscuidade espacial.",enem2026Focus:"Relevante para temas de favelização crônica, cortiços modernos em grandes metrópoles, proliferação de doenças em ambientes superlotados e falta de dignidade habitacional.",commonTraps:"Lembre-se de explicitar que se trata de uma obra literária de ficção que pertence à corrente estética do Naturalismo brasileiro do século XIX."},{id:"al-21",title:"Romance Modernista 'Vidas Secas' (1938)",description:"Clássico de Graciliano Ramos que expõe a saga trágica de uma família de retirantes assolada pela seca, fome e incomunicabilidade (animalização do homem).",keywords:["Seca","Língua e Comunicação","Retirantes"],comoAplicar:"Cite a figura de Fabiano para exemplificar a exclusão comunicativa e linguística de populações desprovidas de escolaridade, que não conseguem articular seus próprios direitos perante a lei.",enem2026Focus:"Cirúrgico para discutir o preconceito linguístico, o estigma de analfabetismo funcional, os fluxos migratórios forçados por catástrofes climáticas e a fome rural.",commonTraps:"Não foque apenas na cachorra Baleia, embora seja tocante. Use a obra para analisar a denúncia sociológica e a exploração cruel promovida pelos donos de terras do sertão."},{id:"al-22",title:"Filme 'Cidadão Kane' (1941)",description:"Obra-prima cinematográfica de Orson Welles que narra a ascensão de um magnata de jornais e revela o imenso poder da imprensa em manipular a opinião pública.",keywords:["Mídia","Manipulação","Opinião Pública"],comoAplicar:"Argumente sobre o perigo do monopólio dos meios de comunicação de massa e a facilidade de fabricar escândalos ou ocultar verdades sociais de acordo com interesses privados.",enem2026Focus:"Excelente para debater a desinformação, o oligopólio de plataformas digitais de tecnologia (Big Techs) e a necessidade de pluralidade de vozes na imprensa de qualidade.",commonTraps:"Identifique claramente que é uma obra cinematográfica norte-americana. Conecte de forma firme os conceitos de império de comunicação ao atual ecossistema de redes sociais."},{id:"al-23",title:"Obra Literária '1984' de George Orwell",description:"Distopia clássica que descreve um regime totalitário sob a vigilância constante do 'Grande Irmão', onde a linguagem e a história são manipuladas pelo State.",keywords:["Vigilância","Privacidade","Totalitarismo"],comoAplicar:"Ilustre o perigo da perda da privacidade e do controle corporativo ou estatal de dados, que moldam e vigiam as escolhas cotidianas dos cidadãos silenciosamente.",enem2026Focus:"Indispensável para temas de vigilância cibernética, algoritmo que espiona o comportamento de compras, vazamento de dados confidenciais e censura digital de ideias.",commonTraps:"Cuidado para não soar excessivamente conspiratório. Mantenha o foco acadêmico mostrando como as técnicas de publicidade direcionada mimetizam a vigilância distópica."},{id:"al-24",title:"Obra Literária 'Admirável Mundo Novo'",description:"Distopia de Aldous Huxley em que a sociedade é controlada por meio de prazeres químicos (soma), clonagem biológica, consumo exacerbado e banimento da reflexão intelectual.",keywords:["Alienamento","Consumismo","Tecnologia"],comoAplicar:"Mostre como a sociedade contemporânea frequentemente confunde progresso tecnológico com felicidade real, gerando uma população apática e viciada em dopamina barata.",enem2026Focus:"Excelente para discutir o vício em jogos de aposta online (bets), a busca obsessiva por curtidas, a automação existencial e a medicalização excessiva da tristeza cotidiana.",commonTraps:"Diferencie o modelo de controle de Huxley (pelo prazer e consumo) do modelo de Orwell (pela dor e força física). Ambos são úteis, mas cada um tem sua especificidade analítica."},{id:"al-25",title:"Obra Literária 'Fahrenheit 451'",description:"Distopia de Ray Bradbury onde os livros são proibidos e queimados pelo governo, sendo substituídos por telas gigantes de entretenimento imbecilizante e vazio.",keywords:["Leitura","Censura","Educação"],comoAplicar:"Denuncie a desvalorização da literatura, da leitura crítica e do hábito de estudar em um ambiente dominado pela superficialidade de vídeos curtos de redes sociais.",enem2026Focus:"Excelente para debater o declínio dos índices de leitura entre jovens no Brasil, o fechamento de bibliotecas físicas municipais e a imbecilização algorítmica voluntária.",commonTraps:"Não afirme apenas que livros queimam a 451 graus. Discorra sobre como a própria população na distopia abriu mão voluntariamente do pensamento denso pela distração fútil."},{id:"al-26",title:"Declaração Universal dos Direitos Humanos",description:"Documento internacional adotado pela ONU em 1948 que proclama os direitos inalienáveis que todos os seres humanos possuem, independentemente de raça ou classe.",keywords:["Direitos Humanos","Dignidade","ONU"],comoAplicar:"Use como referencial teórico no início da Introdução para estabelecer um horizonte de dignidade plena que, no entanto, é sabotado pelo problema do tema em debate.",enem2026Focus:"Perfeito para fundamentar a defesa de minorias marginalizadas, o combate à fome, o direito à privacidade e a garantia de inclusão digital democrática universal.",commonTraps:"Evite citar os artigos de forma totalmente abstrata. Sempre contraponha a promessa civil universal contida na declaração de 1948 com as violações graves do Brasil contemporâneo."},{id:"al-27",title:"Acordo de Paris de 2015",description:"Tratado é secular e exige ações afirmativas permanentes.",enem2026Focus:"Poderoso para temas de racismo estrutural, regularização de terras quilombolas e autodeclaração étnica perante dados estatísticos oficiais.",commonTraps:"Não reduza o Quilombo a um acampamento simples. Caracterize-o como uma sofisticada confederação social e econômica que chegou a abrigar mais de 20 mil habitantes."},{id:"al-30",title:"O Cangaço no Nordeste Brasileiro",description:"Fenômeno de banditismo social e de rebeldia armada nas primeiras décadas do século XX, motivado pela extrema miséria rural e prepotência dos coronéis de latifúndios.",keywords:["Coronelismo","Violência Rural","Pobreza"],comoAplicar:"Aponte como a ausência histórica de forças policiais íntegras e a miséria do sertão fomentaram respostas violentas e soluções à margem da legalidade democrática do Estado.",enem2026Focus:"Útil em discussões sobre a persistência do coronelismo político moderno, a violência rural agrária e as milícias armadas que preenchem lacunas de soberania estatal.",commonTraps:"Não romantize as ações violentas ou saques de bandoleiros do cangaço. Analise o fenômeno estritamente sob as lentes sociológicas da falta de justiça civil e desigualdade agrária."},{id:"al-31",title:"Tratado de Tordesilhas e a Visão Colonialista",description:"Pacto de 1494 entre Portugal e Espanha que dividiu as Américas e estabeleceu as bases de uma exploração extrativista sem preocupação com o desenvolvimento social interno local.",keywords:["Exploração","Colonialismo","Socioeconômico"],comoAplicar:"Explique que a herança do subdesenvolvimento socioeconômico nacional brasileiro decorre da nossa fundação como uma colônia de exploração, priorizando lucros externos.",enem2026Focus:"Excelente para discutir a persistência de elites financeiras concentradoras de terras e a exportação massiva de commodities agrícolas em detrimento da segurança alimentar doméstica.",commonTraps:"Não gaste linhas descrevendo a linha imaginária do tratado de Tordesilhas. Foque no significado sociológico da partilha e mercantilização do território colonizado."}],agentes:[{name:"Ministério da Educação (MEC)",description:"Responsável pelas políticas nacionais de educação, controle curricular da Base Nacional Comum Curricular (BNCC), repasse de fundos federais (Fundeb) e fomento pedagógico de base.",detalhamento:"por intermédio de repasses prioritários de verba do Fundeb para regiões em extrema vulnerabilidade socioeducativa.",enem2026Focus:"Perfeito para propostas que introduzem disciplinas de letramento digital, conscientização sobre assédio virtual, inteligência artificial nas escolas ou educação socioambiental ativa.",commonTraps:"Não proponha que o MEC mude as leis penais ou puna estudantes. O papel do MEC é pedagógico e educacional."},{name:"Ministério da Saúde",description:"Coordena o Sistema Único de Saúde (SUS), cria diretrizes de saneamento básico, gerencia imunizações nacionais e promove o atendimento em saúde mental e física.",detalhamento:"através da ampliação de verbas orçamentárias e concursos públicos para contratação de equipes multidisciplinares e CAPS.",enem2026Focus:"Crucial para propor a expansão de CAPS (Centros de Atenção Psicossocial) e canais gratuitos de telemedicina para tratar ansiedade, depressão juvenil e vício digital.",commonTraps:"Não sugira criar um novo sistema de saúde privado. O foco sempre deve ser o fortalecimento, valorização e expansão do SUS."},{name:"Mídia e Veículos de Comunicação",description:"Espalha conscientização em massa de maneira didática, gera debates de relevância nacional, combate notícias falsas e expõe abusos para a fiscalização popular ativa.",detalhamento:"com a veiculação gratuita de propagandas informativas de utilidade pública no horário nobre da TV aberta e anúncios impulsionados nas redes sociais.",enem2026Focus:"Essencial para divulgar canais de denúncia (Disque 100), campanhas vacinais, educação ecológica urbana e perigos de golpes financeiros virtuais.",commonTraps:"Lembre-se de que a grande mídia é uma entidade privada na maioria das vezes. Portanto, não proponha que a mídia mude a lei penal ou use recursos federais estatais diretamente."},{name:"Família e Núcleo Domiciliar",description:"Responsável pelo desenvolvimento socioafetivo inicial, fomento da empatia, inteligência emocional e construção dos primeiros hábitos de cidadania e senso de solidariedade social.",detalhamento:"por meio de diálogos abertos, limites saudáveis no uso de telas e incentivo constante ao respeito à alteridade.",enem2026Focus:"Ótimo para propostas focadas na prevenção da dependência de dopamina rápida (telas, de rolagens infinitas, jogos de aposta eletrônica) e no incentivo ao esporte presencial.",commonTraps:"Evite delegar inteiramente à família a resolução de mazelas estruturais complexas (ex: saneamento ou violência urbana). Combine a família com o apoio de psicólogos escolares e campanhas estatais."},{name:"Ministério do Meio Ambiente e Mudança do Clima (MMA)",description:"Formula diretrizes para a preservação florestal, combate à extração ilegal de recursos, fiscalização rigorosa de crimes contra a biosfera e transição de carbono justa.",detalhamento:"mediante o fortalecimento de equipes fiscais do Ibama e aplicação imediata de multas administrativas severas contra indústrias agropecuárias reincidentes em degradação.",enem2026Focus:"Perfeito para propor monitoramento de biomas nacionais via satélite de alta definição, preservação da biodiversidade e incentivo a cooperativas de lixo eletrônico.",commonTraps:"Não o chame de 'Ministério do Meio Ambiente' simplista. O uso do nome completo 'e Mudança do Clima (MMA)' demonstra atualização política impecável."},{name:"Ministério dos Direitos Humanos e da Cidadania",description:"Promove, monitora e defende as garantias civis de populações historicamente marginalizadas, indígenas, idosos, pessoas com deficiência e indivíduos em situação de rua.",detalhamento:"por intermédio da consolidação de núcleos regionais intersetoriais de acolhimento psicossocial permanente e defesa jurídica gratuita para vítimas de estigma estrutural.",enem2026Focus:"Foco total no amparo de minorias invisibilizadas, garantindo inclusão fática para pessoas em situação de rua, povos tradicionais e idosos.",commonTraps:"Evite sugerir que este Ministério crie penas ou julgue crimes. O papel dele é assistência social, formulação de políticas de igualdade e canais de denúncia (Disque 100)."},{name:"Ministério da Justiça e Segurança Pública (MJSP)",description:"Defende a ordem jurídica, os direitos constitucionais, as garantias coletivas, a segurança pública nacional, além de policiar fronteiras e combater crimes organizados.",detalhamento:"por meio de verbas destinadas à capacitação e treinamento tecnológico de forças policiais contra crimes digitais cibernéticos.",enem2026Focus:"Útil em propostas que exigem repressão legal ou investigativa a crimes virtuais, intolerância nas redes, racismo digital e vazamento de dados privados de vulneráveis.",commonTraps:"Não confunda a atuação federal do MJSP com as polícias militares e civis estaduais, que são subordinadas diretamente aos Governos de cada Estado."},{name:"Ministério do Trabalho e Emprego (MTE)",description:"Formula e executa políticas de fomento ao emprego, fiscaliza condições trabalhistas de segurança, combate o trabalho análogo à escravidão e gerencia a previdência básica.",detalhamento:"através de mutirões federais de fiscalização ativa e aplicação de pesadas sanções fiscais a empresas infratoras.",enem2026Focus:"Essencial para intervir contra a precarização do trabalho de entregadores e motoristas por aplicativos (uberização), exploração infantil e assédio corporativo.",commonTraps:"Não recomende que o MTE simplesmente extinga a tecnologia de aplicativos. Proponha regulação trabalhista, dignidade de renda e proteção previdenciária fática."},{name:"Ministério do Desenvolvimento e Assistência Social (MDS)",description:"Gerencia programas de transferência de renda (Bolsa Família), promove a segurança alimentar nacional e coordena a rede de assistência social básica (CRAS e CREAS).",detalhamento:"por intermédio da ampliação orçamentária dos Centros de Referência de Assistência Social (CRAS) municipais em bairros de extrema vulnerabilidade.",enem2026Focus:"Ideal para propor combate à fome, segurança alimentar e inserção socioeconômica de famílias em extrema pobreza ou situação de vulnerabilidade cíclica.",commonTraps:"Diferencie o MDS da assistência médica do Ministério da Saúde. O MDS foca em amparo socioeconômico direto, habitação, combate à fome extrema e programas de renda."},{name:"Ministério da Ciência, Tecnologia e Inovação (MCTI)",description:"Fomenta a pesquisa científica brasileira, financia universidades e centros tecnológicos nacionais, apoia a inovação digital e desenvolve projetos de soberania científica.",detalhamento:"mediante a concessão de bolsas de pesquisa e parcerias técnico-científicas com universidades públicas nacionais e laboratórios estatais de ponta.",enem2026Focus:"Poderoso para temas que abordam inteligência artificial ética, regulação cibernética, desenvolvimento de vacinas nacionais e transição tecnológica de indústrias.",commonTraps:"Não proponha que o MCTI crie redes sociais ou gerencie escolas de ensino fundamental. Sua área de atuação é a pesquisa acadêmica superior, inovação e desenvolvimento de ponta."},{name:"Ministério das Cidades",description:"Formula políticas de desenvolvimento urbano sustentável, saneamento básico universal, habitação de interesse social (como o programa Minha Casa Minha Vida) e mobilidade urbana.",detalhamento:"através de convênios orçamentários diretos com prefeituras municipais para urbanização e instalação de saneamento em favelas periféricas.",enem2026Focus:"Essencial para tratar de favelização desordenada, gentrificação, saneamento básico precário nas franjas urbanas e expansão de ciclovias e transportes coletivos eficientes.",commonTraps:"Não confunda com o governo estadual. O Ministério das Cidades dita as diretrizes nacionais e repassa fundos federais, mas a execução física das obras de asfalto é municipal."},{name:"Ministério da Cultura (MinC)",description:"Promove o fomento cultural do país, incentiva o patrimônio material e imaterial, protege saberes de minorias étnicas e descentraliza o acesso à arte popular e cinema.",detalhamento:"por meio de editais descentralizados da Lei Rouanet e Lei Aldir Blanc voltados exclusivamente para periferias rurais e urbanas.",enem2026Focus:"Altamente aplicável em propostas de valorização de saberes tradicionais, combate ao preconceito linguístico, inclusão cultural de minorias e preservação de centros artísticos locais.",commonTraps:"Evite focar unicamente na concessão de shows de artistas famosos. Proponha oficinas de teatro, fomento à leitura em bibliotecas de bairro e descentralização da arte."},{name:"Poder Legislativo (Congresso Nacional)",description:"Composto pela Câmara dos Deputados e Senado Federal, é responsável por debater, formular, emendar e aprovar as leis do país, além de fiscalizar as contas governamentais.",detalhamento:"através da criação de emendas parlamentares impositivas que direcionem recursos orçamentários para a infraestrutura social local.",enem2026Focus:"Excelente para propor novas regulamentações jurídicas rígidas, como o marco legal da inteligência artificial, agravamento de penas para crimes de ódio virtuais e proteção de dados.",commonTraps:"O Congresso Nacional NÃO executa obras físicas. Ele cria as leis e aprova orçamentos. Não proponha que o Legislativo 'construa escolas ou hospitais'."},{name:"Organizações Não Governamentais (ONGs) e Sociedade Civil",description:"Entidades filantrópicas sem fins lucrativos que atuam em defesa do meio ambiente, direitos civis, educação comunitária e proteção à saúde básica, suprindo lacunas estatais.",detalhamento:"por intermédio de mutirões voluntários de educação comunitária e apoio jurídico em favelas periféricas e comunidades ribeirinhas.",enem2026Focus:"Ideal para focar no engajamento comunitário horizontal, como ecopontos em comunidades periféricas, cooperativas de costureiras ou assistência a refugiados.",commonTraps:"ONGs não possuem poder de repressão estatal ou poder de força de polícia. Use-as como parceiras e apoios das iniciativas estatais de infraestrutura."},{name:"Poder Judiciário e Defensoria Pública",description:"Responsável por julgar conflitos, garantir a aplicação estrita da Constituição Federal de 1988 e oferecer assistência jurídica gratuita para quem não possui condições financeiras.",detalhamento:"por meio da expansão física e virtual dos núcleos de atendimento gratuito da Defensoria Pública para o interior do país.",enem2026Focus:"Excelente para intervir na garantia de direitos violados de minorias, no atendimento a presidiários sem assistência jurídica e no julgamento ágil de agressões contra vulneráveis.",commonTraps:"O Judiciário não cria leis de base (quem cria é o Legislativo) nem administra o orçamento de educação e saúde do executivo. Sua esfera é estritamente judicial defensiva."}],conectivos:[{category:"Soma e Adição",examples:["além disso","ademais","outrossim","somado a isso","como também","bem como"]},{category:"Oposição e Choque",examples:["entretanto","contudo","todavia","no entanto","porém","não obstante"]},{category:"Tempo e Ordem",examples:["inicialmente","previamente","em primeiro lugar","simultaneamente","posteriormente"]},{category:"Conclusão e Fecho",examples:["portanto","desse modo","dessa forma","logo","destarte","assim sendo"]},{category:"Fito e Finalidade",examples:["com o fito de","a fim de que","com o objetivo de","com o intuito de","para que"]},{category:"Causa e Origem",examples:["visto que","já que","pois","uma vez que","dado que","em virtude de"]},{category:"Efeito e Sequência",examples:["por conseguinte","tanto que","de sorte que","de modo que","com efeito","consequentemente"]},{category:"Semelhança e Prisma",examples:["analogamente","do mesmo modo","da mesma maneira","igualmente","sob o mesmo prisma"]},{category:"Concessão e Redução",examples:["embora","conquanto","ainda que","se bem que","posto que","mesmo que"]},{category:"Explicação e Detalhe",examples:["isto é","por exemplo","ou seja","a saber","em outras palavras","inclusive"]}]},Ad=[{id:"en-q-1",year:"ENEM 2022",title:"Questão 25 (A Semana de 1922 e Identidade)",text:`A partir dos anos 1970, a diversidade étnica e cultural ganha maior reconhecimento com movimentos culturais, tais como o "Tropicalismo", os "Afrobahianos", as inserções de referências religiosas afro-brasileiras na Bossa Nova e o "Teatro do Oprimido". Tudo isso foi antecipado pelo Movimento de Cultura Popular, fundado por Paulo Freire nos anos de 1960.

Essa ideia nacionalista surgiu dos sonhos de Mário de Andrade e da Semana de Arte Moderna de 1922, que visava o(a):`,options:[{key:"A",text:"incorporação ao patrimônio nacional das culturas negra e portuguesa."},{key:"B",text:"representação das realidades social e econômica do início do século."},{key:"C",text:"reflexo da igualdade mestiça nos processos de patrimonialização."},{key:"D",text:"ideal da diversidade cultural como categoria identitária nacional."},{key:"E",text:"constituição da materialidade e da multiplicidade socioculturais."}],correctKey:"D",reason:"O modernismo introduziu o ideal de incorporar as heranças periféricas na construção da nossa identidade. A alternativa correta explicita a busca pela consolidação da diversidade cultural como a real marca identitária da nação brasileira.",trapDetails:"As alternativas A e C exageram ao citar termos específicos do patrimônio fático que não faziam parte das teorias estéticas de 1922 (na época ainda muito incipientes quanto à cultura negra especificamente).",gateTrigger:"DIVERSIDADE CULTURAL COMO CATEGORIA IDENTITÁRIA"},{id:"en-q-2",year:"ENEM PPL 2023",title:"Questão 36 (A animação Vida Maria)",text:`O curta-metragem 'Vida Maria' exibe de forma poética a rotina árdua de Maria José, uma menina de cinco anos de idade que se diverte aprendendo a escrever o próprio nome, mas é obrigada por sua mãe a deixar os estudos de lado para cuidar do trabalho rural e dos afazeres domésticos.

Este fragmento de texto descrevendo a animação constitui um exemplo de gênero sinopse porque apresenta um(a):`,options:[{key:"A",text:"posicionamento da revista sobre a produção da animação."},{key:"B",text:"relato da história abordada no curta-metragem."},{key:"C",text:"lista de acontecimentos cotidianos de uma família rural."},{key:"D",text:"história sucinta com poucos personagens definidos."},{key:"E",text:"fatos da vida de uma menina e seus familiares."}],correctKey:"B",reason:"A sinopse tem a finalidade comunicativa estrita de relatar resumidamente a narrativa principal de uma obra sem emitir juízos valorativos profundos, motivando o leitor a conhecê-la.",trapDetails:"A alternativa A refere-se à resenha crítica. As alternativas C e E descrevem apenas fatos gerais do enredo, o que confunde quem não foca na função estrutural do gênero solicitado (Relato resumido da história).",gateTrigger:"RELATO DO ENREDO SEM JUÍZO DE VALOR"},{id:"en-q-3",year:"ENEM 2024",title:"Questão 13 (Pobreza Menstruária)",text:`Estudos demonstram que a falta de acesso a absorventes e infraestrutura sanitária adequada força milhares de meninas de baixa renda a faltar às aulas durante o ciclo menstrual. Segundo dados globais, esse fator de exclusão acarreta evasão escolar progressiva, prejuízos na autoestima e perpetuação das desigualdades sociais.

Esse tipo de texto jornalístico é marcado pela função referencial da linguagem porque cumpre o propósito de:`,options:[{key:"A",text:"sugerir soluções para um problema de ordem social."},{key:"B",text:"estabelecer uma relação entre menstruação e gravidez precoce."},{key:"C",text:"comparar o desempenho acadêmico de homens e mulheres."},{key:"D",text:"informar o leitor sobre o impacto da pobreza menstrual na vida das mulheres."},{key:"E",text:"orientar o público sobre a necessidade de hábitos de autocuidado."}],correctKey:"D",reason:"A função REFERENCIAL da linguagem tem como objetivo central transmitir dados de forma impessoal, direta, concisa e puramente factual (Informativa) ao receptor.",trapDetails:"A alternativa A é um distrator forte porque apela para o desejo moral do aluno de querer resolver o problema social, mas a questão pede especificamente a finalidade da FUNÇÃO REFERENCIAL no texto.",gateTrigger:"INFORMAÇÃO PURA E OBJETIVA"},{id:"en-q-4",year:"ENEM 2015",title:"Questão 86 (Acústica e Timbre)",text:`Ao ouvir uma flauta and um piano emitindo uma mesma nota musical (ex: Lá central de 440 Hz) com a mesma intensidade física, conseguimos diferenciar instantaneamente de qual instrumento o som provém.

Essa capacidade humana de diferenciação deve-se principalmente ao(à):`,options:[{key:"A",text:"intensidade sonora do som de cada instrumento musical."},{key:"B",text:"potência sonora do som emitido pelos diferentes alto-falantes."},{key:"C",text:"velocidade de propagação do som em cada meio específico."},{key:"D",text:"timbre do som, que faz com que os formatos das ondas de cada instrumento sejam diferentes."},{key:"E",text:"altura do som, que possui frequências variadas."}],correctKey:"D",reason:"O timbre é a qualidade fisiológica do som que nos permite distinguir fontes sonoras que emitem a mesma nota (frequência) e intensidade. Ele é determinado pelo formato da onda mecânica produzida pela superposição de harmônicos.",trapDetails:"A alternativa E tenta induzir o aluno a crer que as frequências são diferentes, mas o texto da questão afirma claramente que eles emitem a MESMA nota musical (mesma frequência).",gateTrigger:"TIMBRE E FORMATO DA ONDA"},{id:"en-q-5",year:"ENEM 2023",title:"Questão 05 (Estatística - Média vs Mediana)",text:`Um estudante anotou suas notas em simulados de Redação ao longo do semestre: 880, 920, 920, 600, 960, 920 e 1000. Percebendo a nota atípica de 600 ocorrida devido a um problema de tempo, ele resolveu analisar as medidas de tendência central desse conjunto.

A mediana e a moda das notas desse estudante são, respectivamente:`,options:[{key:"A",text:"880 e 920."},{key:"B",text:"920 e 920."},{key:"C",text:"920 e 960."},{key:"D",text:"880 e 960."},{key:"E",text:"885 e 920."}],correctKey:"B",reason:"A mediana é o valor central após ordenar os dados em ordem crescente (600, 880, 920, 920, 920, 960, 1000), resultando em 920. A moda é o valor que aparece com maior frequência absoluta, que também é 920.",trapDetails:"A alternativa E tenta induzir o aluno a calcular a média aritmética tradicional (aproximadamente 885,7) no lugar da mediana, que é blindada contra valores extremos discrepantes.",gateTrigger:"ORDENAÇÃO DOS DADOS NA MEDIANA"},{id:"en-q-6",year:"ENEM 2021",title:"Questão 06 (Ecologia - Magnificação Trófica)",text:`O despejo de efluentes industriais contendo metais pesados como o mercúrio em corpos d'água afeta severamente a fauna local. Ao longo da cadeia alimentar (fitoplâncton → zooplâncton → peixes herbívoros → peixes carnívoros → aves piscívoras), esses resíduos acumulam-se nos tecidos biológicos por não serem metabolizados.

Nessa cadeia alimentar, a maior concentração de mercúrio acumulado será encontrada nas(os):`,options:[{key:"A",text:"fitoplânctons, devido ao contato direto inicial com os efluentes contaminados."},{key:"B",text:"peixes herbívoros, por consumirem grandes volumes de fitoplâncton."},{key:"C",text:"aves piscívoras, devido ao fenômeno de bioacumulação ao longo dos níveis tróficos."},{key:"D",text:"zooplânctons, por estarem na base de transição da cadeia trófica."},{key:"E",text:"bactérias decompositoras, que processam toda a matéria orgânica morta do ciclo."}],correctKey:"C",reason:"A magnificação trófica (ou biomagnificação) causa o aumento progressivo da concentração de substâncias não biodegradáveis e lipossolúveis ao longo dos níveis tróficos, atingindo concentração máxima no topo de cadeia alimentar.",trapDetails:"A alternativa A é um distrator comum ao sugerir que quem está em contato inicial (produtor) acumula mais, esquecendo que o fluxo de energia diminui, mas o fluxo de toxinas se acumula pirâmide acima.",gateTrigger:"BIOMAGNIFICAÇÃO EM TOPOS DE CADEIA"},{id:"en-q-7",year:"ENEM 2022",title:"Questão 07 (Física - Associação de Resistores)",text:"Três lâmpadas incandescentes idênticas de resistência elétrica R estão conectadas em paralelo a uma fonte de tensão ideal constante V. Caso uma dessas lâmpadas queime e seu filamento interno se rompa, o que ocorre de forma fática com o brilho (potência dissipada) das outras duas lâmpadas restantes?",options:[{key:"A",text:"O brilho de ambas diminui, pois a resistência equivalente do circuito aumenta."},{key:"B",text:"O brilho de ambas permanece inalterado, pois a diferença de potencial em cada ramal continua sendo V."},{key:"C",text:"O brilho de ambas aumenta, já que a corrente total se divide por apenas dois caminhos."},{key:"D",text:"Uma lâmpada brilhará mais que a outra devido à nova distribuição de carga."},{key:"E",text:"Ambas se apagam imediatamente, pois o circuito elétrico inteiro é interrompido."}],correctKey:"B",reason:"Em uma associação em paralelo pura ligada a uma fonte de tensão constante, a ddp em cada ramal é independente das demais ramificações. Como a tensão V e a resistência R das outras lâmpadas continuam constantes, a potência P = V²/R também continua idêntica.",trapDetails:"A alternativa E descreve o comportamento de lâmpadas associadas em série, onde a interrupção de um único elemento bloqueia fisicamente toda a corrente elétrica do circuito.",gateTrigger:"INDEPENDÊNCIA DE TENSÃO EM PARALELO"},{id:"en-q-8",year:"ENEM 2023",title:"Questão 08 (Química - Estequiometria com Rendimento)",text:`A reação de síntese da amônia (NH3) ocorre a partir dos gases nitrogênio (N2) e hidrogênio (H2), conforme a equação balanceada: N2(g) + 3H2(g) → 2NH3(g). Sabendo que as massas molares são N = 14 g/mol e H = 1 g/mol, um engenheiro químico mistura 28 g de N2 com excesso de H2. Ao final do processo industrial, ele obtém apenas 17 g de amônia pura.

O rendimento percentual real obtido nessa reação industrial foi de aproximadamente:`,options:[{key:"A",text:"100%"},{key:"B",text:"75%"},{key:"C",text:"50%"},{key:"D",text:"25%"},{key:"E",text:"10%"}],correctKey:"C",reason:"1 mol de N2 (28g) deveria produzir teoricamente 2 mols de NH3 (2 * 17g = 34g). Como na prática foram colhidos apenas 17g de NH3, o rendimento percentual foi exatamente a metade do esperado, ou seja, 50%.",trapDetails:"A alternativa B atrai o aluno que tenta dividir o peso da amônia (17g) pela massa de nitrogênio (28g) diretamente, negligenciando a proporção estequiométrica correta expressa na equação química balanceada.",gateTrigger:"ESTEQUIOMETRIA COM RENDIMENTO REAL"},{id:"en-q-9",year:"ENEM 2020",title:"Questão 09 (Geografia - Práticas Agrícolas Sustentáveis)",text:`Em áreas declivosas de encostas e morros, a ação das águas das chuvas intensas pode provocar severa erosão do solo, arrastando nutrientes agrícolas valiosos e causando o assoreamento rápido de rios vizinhos. Para conter esse impacto ambiental nas encostas, agricultores utilizam técnicas específicas de manejo físico do terreno.

A técnica agrícola indicada para reduzir a velocidade de escoamento superficial da água e evitar a erosão nesses terrenos é o(a):`,options:[{key:"A",text:"queimada controlada periódica, para limpar a biomassa rapidamente."},{key:"B",text:"terraceamento ou plantio em curvas de nível transversal ao declive."},{key:"C",text:"monocultura intensiva contínua de grãos, compactando a terra."},{key:"D",text:"irrigação por aspersão de alta pressão para assentar a poeira."},{key:"E",text:"aração profunda morro abaixo, facilitando o escoamento rápido."}],correctKey:"B",reason:"O terraceamento e o plantio em curvas de nível criam barreiras horizontais transversais ao sentido da descida da água. Isso reduz drasticamente a velocidade do escoamento superficial da chuva, controlando o arrasto de solo e facilitando a infiltração de água.",trapDetails:"A alternativa E atrai quem acredita de forma equivocada que facilitar o escoamento vertical rápido 'morro abaixo' drena o terreno, quando na verdade isso acelera a erosão por ravinamento profundo.",gateTrigger:"CONSERVAÇÃO DE ENCOSTAS POR CURVAS DE NÍVEL"},{id:"en-q-10",year:"ENEM 2019",title:"Questão 10 (Sociologia - Sociabilidade e Zygmunt Bauman)",text:`"Na era da informação, as conexões humanas tornaram-se extraordinariamente fáceis de estabelecer, mas igualmente fáceis de desfazer. As interações de redes sociais virtuais moldam laços temporários, pautados pelo descarte rápido emocional e relações efêmeras de consumo afetivo."

Essa volatilidade de interações e fragilidade nas instituições sociais contemporâneas constitui o cerne da teoria sociológica da:`,options:[{key:"A",text:"Solidariedade Mecânica de Émile Durkheim."},{key:"B",text:"Modernidade Líquida desenvolvida por Zygmunt Bauman."},{key:"C",text:"Ação Social Racional com relação a valores de Max Weber."},{key:"D",text:"Luta de Classes estrutural formulada por Karl Marx."},{key:"E",text:"Sociedade Disciplinar e vigilância de Michel Foucault."}],correctKey:"B",reason:"O sociólogo Zygmunt Bauman cunhou o termo 'Modernidade Líquida' para representar a transição de um mundo 'sólido' (com casamentos, carreiras e identidades vitalícias) para uma realidade fluida, impermanente, mercantilizada e incerta.",trapDetails:"A alternativa A é um distrator que apela para a ideia de 'laço e união', mas a solidariedade mecânica durkheimiana refere-se à forte coesão social coletiva de sociedades tradicionais pré-capitalistas.",gateTrigger:"MODERNIDADE LÍQUIDA E RELAÇÕES FLUIDAS"},{id:"en-q-11",year:"ENEM 2018",title:"Questão 11 (História - Estado Novo e Aparelho de State)",text:`Durante o regime autoritário do Estado Novo (1937-1945), Getúlio Vargas centralizou as tomadas de decisões e investiu maciçamente no uso de transmissões de rádio (A Hora do Brasil), desfiles cívicos e cartilhas de exaltação patriótica. Essas ações eram controladas por um órgão centralizador específico.

O departamento estatal responsável pela propaganda ideológica nacional varguista e controle rígido da censura artística foi o:`,options:[{key:"A",text:"Departamento de Imprensa e Propaganda (DIP)."},{key:"B",text:"Instituto Brasileiro de Geografia e Estatística (IBGE)."},{key:"C",text:"Ministério das Relações Exteriores (Itamaraty)."},{key:"D",text:"Conselho Nacional do Petróleo (CNP)."},{key:"E",text:"Serviço Nacional de Aprendizagem Industrial (SENAI)."}],correctKey:"A",reason:"O DIP (Departamento de Imprensa e Propaganda) centralizava a divulgação de propagandas oficiais, moldava a imagem pública de Getúlio Vargas como o 'pai dos trabalhadores' e aplicava censura prévia de imprensa, teatro e rádio contra as dissidências de oposição.",trapDetails:"A alternativa E cita o SENAI, que embora criado no período Vargas para a qualificação industrial, não possui nenhuma correlação institucional com censura estatal ou propagandas ideológicas de rádio.",gateTrigger:"CONTROLE SOCIAL E CENSURA DO DIP"},{id:"en-q-12",year:"ENEM 2021",title:"Questão 12 (Linguagens - Variação Linguística)",text:`"Dae mano, blz? O bagulho ficou louco ontem na aula de biologia, o prof começou a falar de mitocôndria e eu viajei total na parada, mó brisa."

A partir da análise do registro de linguagem empregado no diálogo acima, conclui-se que o falante utilizou uma variedade linguística classificada como:`,options:[{key:"A",text:"formal e culta, típica do discurso pedagógico escolar formal."},{key:"B",text:"coloquial e informal, marcada por marcas de oralidade e gírias juvenis."},{key:"C",text:"regional e geográfica, exclusiva de idosos rurais no interior do país."},{key:"D",text:"técnico-científica, exigida na redação de relatórios oficiais acadêmicos."},{key:"E",text:"arcaica e histórica, cujos elementos vocabulares caíram em completo desuso."}],correctKey:"B",reason:"O uso de abreviações gráficas ('Dae', 'blz', 'prof') combinadas com gírias urbanas expressivas ('bagulho', 'mó brisa') tipificam a variedade coloquial (registro informal de linguagem), comum e adequada em conversas espontâneas cotidianas.",trapDetails:"A alternativa D tenta enganar o aluno que foca unicamente no vocábulo biológico 'mitocôndria', inferindo erroneamente tratar-se de um registro técnico-científico, desconsiderando a sintaxe coloquial predominante.",gateTrigger:"ADEQUAÇÃO COLOQUIAL E CONTEXTUAL"},{id:"en-q-13",year:"ENEM 2017",title:"Questão 13 (Filosofia - Thomas Hobbes e o Contrato Social)",text:`"Durante o tempo em que os homens vivem sem um poder comum capaz de mantê-los a todos em respeito, eles se encontram naquela condição a que se chama guerra de todos contra todos. Nessa condição, a vida é solitária, pobre, sórdida, embrutecida e curta." (HOBBES, T. Leviatã. São Paulo: Abril Cultural, 1974).

Para superar as ameaças do estado de natureza e garantir a autopreservação da vida, Hobbes defende que os homens devem:`,options:[{key:"A",text:"descentralizar as decisões políticas, eliminando magistrados e leis escritas."},{key:"B",text:"firmar um pacto social civil, transferindo sua soberania natural a um poder absoluto estatal."},{key:"C",text:"abolir a propriedade privada para restabelecer a igualdade natural primária."},{key:"D",text:"armar os indivíduos de forma livre para garantir a autodefesa privada comunitária."},{key:"E",text:"organizar governos democráticos participativos diretos sem restrições fiscais."}],correctKey:"B",reason:"Para Hobbes, a única saída da violência generalizada do 'estado de natureza' é a celebração do contrato social, por meio do qual os indivíduos abrem mão do direito de autodefesa para criar o Leviatã — um Estado soberano forte que garanta a paz interna por meio da lei.",trapDetails:"A alternativa D contradiz diretamente a filosofia hobbesiana, pois o monopólio legítimo da força deve ser entregue exclusivamente ao soberano absoluto, e não mantido descentralizado nas mãos dos cidadãos.",gateTrigger:"PACTO SOCIAL E SOBERANO ABSOLUTO"},{id:"en-q-14",year:"ENEM 2022",title:"Questão 14 (Química Orgânica - Reconhecimento de Funções)",text:`O paracetamol é um analgésico e antipirético de amplo consumo mundial. Sua fórmula estrutural apresenta um anel aromático ligado diretamente a um grupo hidroxila (-OH) em uma das extremidades, e em outra extremidade possui um nitrogênio ligado a um grupo carbonila (C=O) conectado a um radical metil.

As funções orgânicas que contêm os átomos de oxigênio e nitrogênio descritos na estrutura do paracetamol são, respectivamente:`,options:[{key:"A",text:"Álcool e amina aromática primária."},{key:"B",text:"Fenol e amida alifática secundária."},{key:"C",text:"Éter cíclico e amina secundária saturada."},{key:"D",text:"Ácido carboxílico e imina linear insolúvel."},{key:"E",text:"Cetona alicíclica e nitrila aromática ramificada."}],correctKey:"B",reason:"O grupo hidroxila (-OH) ligado diretamente ao anel benzênico constitui o grupo funcional FENOL. O átomo de nitrogênio ligado de forma adjacente a um grupo carbonila (C=O) caracteriza a função nitrogenada AMIDA.",trapDetails:"A alternativa A é o maior erro entre candidatos, que confundem a hidroxila aromática do fenol com a hidroxila de um álcool simples, e o nitrogênio de amida com uma amina simples por não notarem a presença da carbonila.",gateTrigger:"RECONHECIMENTO DE FENOL E AMIDA"},{id:"en-q-15",year:"ENEM 2020",title:"Questão 15 (Matemática - Razão e Escalas Cartográficas)",text:`Um mapa metropolitano de trânsito rodoviário foi confeccionado obedecendo à escala cartográfica exata de 1 : 50.000. Nesse mapa, uma importante avenida expressa que liga duas zonas comerciais é representada por um segmento linear de reta medindo exatamente 12 cm.
