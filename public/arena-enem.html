O conceito que define a diferença entre o valor total produzido pelo trabalhador em sua jornada laboral e o valor efetivamente pago a ele sob a forma de salário é a:`,options:[{key:"A",text:"Alienação cultural midiática."},{key:"B",text:"Mais-valia, que constitui a fonte real do lucro e da acumulação capitalista."},{key:"C",text:"Justiça distributiva equitativa."},{key:"D",text:"Divisão internacional do trabalho corporativo."},{key:"E",text:"Mais-valia moral voluntária concedida por sindicatos patronais."}],correctKey:"B",reason:"A mais-valia é o conceito central na crítica econômica de Marx. Ela representa a porção de valor gerada pelo trabalho não pago ao operário durante a sua jornada de trabalho. Esse excedente é apropriado de forma privada pelo capitalista detentor dos meios de produção, gerando lucros e reproduzindo a desigualdade de classes.",trapDetails:"A alternativa A refere-se à alienação, que é outro conceito importante em Marx (a separação do trabalhador do fruto de seu trabalho), mas não descreve a diferença monetária de valor que constitui a definição exata de mais-valia.",gateTrigger:"MAIS-VALIA E ACUMULAÇÃO DE CAPITAL"},{id:"en-q-68",year:"ENEM 2023",title:"Questão 68 (Linguagens - Funções da Linguagem: Função Apelativa)",text:`CAMPANHA DE VACINAÇÃO INFANTIL

"Não vacile, proteja quem você ama! Leve seus filhos menores de 5 anos ao posto de saúde mais próximo neste sábado e garanta a imunização contra a paralisia infantil. A vacina salva vidas!"

A análise do cartaz publicitário institucional acima revela o predomínio da função da linguagem estruturada para convencer o interlocutor. Essa função é classificada como:`,options:[{key:"A",text:"Função Poética, focada na musicalidade das rimas ricas e na métrica das estrofes."},{key:"B",text:"Função Fática, que busca testar se a mensagem está sendo transmitida fisicamente pela rede."},{key:"C",text:"Função Apelativa ou Conativa, caracterizada pelo uso de verbos no imperativo para influenciar o comportamento do leitor."},{key:"D",text:"Função Metalinguística, na qual o autor define cientificamente o termo gramatical 'vacina'."},{key:"E",text:"Função Referencial neutra, restrita à divulgação técnica de dados estatísticos sem apelo emocional."}],correctKey:"C",reason:"A função apelativa (ou conativa) tem como foco o receptor da mensagem. Ela é comum em textos publicitários, discursos políticos e sermões, utilizando recursos linguísticos persuasivos como o vocativo e verbos no modo imperativo ('Não vacile', 'proteja', 'Leve') para direcionar ou induzir uma ação direta do leitor.",trapDetails:"A alternativa E descreve a função referencial. Embora o anúncio transmita dados informativos, o objetivo retórico primordial é a persuasão direta do comportamento ('Leve seu filho'), caracterizando a função apelativa.",gateTrigger:"FUNÇÃO APELATIVA E IMPERATIVOS"},{id:"en-q-69",year:"ENEM 2021",title:"Questão 69 (Matemática - Razões Trigonométricas)",text:`Um engenheiro civil projeta uma rampa de acessibilidade retilínea para conectar o calçamento ao hall de entrada de um edifício público, cuja altura vertical em relação ao solo mede exatamente 1,5 metros. Para garantir a segurança dos usuários de cadeiras de rodas, a rampa deve formar um ângulo constante de inclinação de 30º com o plano horizontal terrestre.

O comprimento total linear da rampa projetada pelo engenheiro (usando sen(30º) = 0,5, cos(30º) ≈ 0,86 e tg(30º) ≈ 0,57) deve ser igual a:`,options:[{key:"A",text:"1,5 metros"},{key:"B",text:"3,0 metros"},{key:"C",text:"2,0 metros"},{key:"D",text:"2,6 metros"},{key:"E",text:"4,5 metros"}],correctKey:"B",reason:"A situação descreve um triângulo retângulo onde a altura do hall é o cateto oposto ao ângulo de 30º (cateto = 1,5 m) e o comprimento da rampa é a hipotenusa (H). Aplicando a razão trigonométrica do seno: sen(30º) = cateto_oposto / hipotenusa => 0,5 = 1,5 / H => H = 1,5 / 0,5 = 3,0 metros.",trapDetails:"A alternativa D apresenta o valor obtido caso o aluno aplique a tangente de forma incorreta (1,5 / 0,57 ≈ 2,63 m), que corresponderia ao comprimento horizontal projetado na base terrestre, e não ao comprimento real linear da rampa (hipotenusa).",gateTrigger:"TRIGONOMETRIA DE TRIÂNGULO RETÂNGULO"},{id:"en-q-70",year:"ENEM 2023",title:"Questão 70 (Física - Ondulatória e Efeito Doppler)",text:`O Efeito Doppler é um fenômeno ondulatório caracterizado pelo desvio aparente da frequência de uma onda recebida por um observador quando existe um movimento relativo de aproximação ou de afastamento entre ele e a fonte emissora de ondas.

Um exemplo clássico e cotidiano da aplicação acústica desse fenômeno ocorre quando uma ambulância passa tocando sua sirene por um observador parado na calçada:`,options:[{key:"A",text:"O som da sirene é ouvido de forma idêntica e com a mesma tonalidade durante todo o trajeto."},{key:"B",text:"O som é percebido mais agudo (frequência maior) durante a aproximação e mais grave (frequência menor) durante o afastamento."},{key:"C",text:"O som é percebido mais grave durante a aproximação e mais agudo durante o afastamento da ambulância."},{key:"D",text:"A velocidade do som no ar aumenta à medida que a ambulância acelera em direção ao observador."},{key:"E",text:"A frequência acústica real da sirene muda eletronicamente na caixa de som do veículo de acordo com a velocidade."}],correctKey:"B",reason:"Quando a fonte sonora se aproxima do observador, as frentes de onda são comprimidas, resultando em um menor comprimento de onda aparente e em uma frequência percebida maior (som mais agudo). Quando a fonte se afasta, as frentes de onda se espalham, gerando um comprimento de onda aparente maior e frequência percebida menor (som mais grave).",trapDetails:"A alternativa C inverte a lógica do fenômeno, afirmando incorretamente que a aproximação gera som mais grave e o afastamento gera som mais agudo.",gateTrigger:"EFEITO DOPPLER ACÚSTICO"},{id:"en-q-71",year:"ENEM 2021",title:"Questão 71 (Química - Funções Orgânicas Oxigenadas)",text:`A vanilina é o composto químico orgânico responsável pelo aroma característico de baunilha, amplamente utilizado nas indústrias farmacêutica e de alimentos. Sua estrutura química molecular apresenta um anel aromático substituído por um grupo hidroxila (-OH), um grupo metóxi (-OCH3) e um grupo formil (-CHO).

As funções orgânicas oxigenadas presentes na estrutura da vanilina são:`,options:[{key:"A",text:"Ácido carboxílico, álcool e cetona."},{key:"B",text:"Fenol, éter e aldeído."},{key:"C",text:"Éster, álcool e anidrido ácido."},{key:"D",text:"Fenol, cetona e amida cíclica."},{key:"E",text:"Aldeído, éster e alcóxido de sódio."}],correctKey:"B",reason:"Na vanilina: 1) A hidroxila (-OH) ligada diretamente ao anel aromático caracteriza a função FENOL; 2) O grupo metóxi (-OCH3) ligado ao anel representa a função ÉTER; 3) O grupo formil (-CHO), que consiste em uma carbonila terminal ligada a um hidrogênio, configura a função ALDEÍDO.",trapDetails:"A alternativa A confunde o fenol com álcool e o aldeído com ácido carboxílico ou cetona. Para ser álcool, a hidroxila deve estar ligada a um carbono saturado (sp³), e não diretamente a um carbono insaturado sp² do anel aromático.",gateTrigger:"IDENTIFICAÇÃO DE FUNÇÕES ORGANICAS"},{id:"en-q-72",year:"ENEM 2020",title:"Questão 72 (Biologia - Ecologia e Relações Interespecíficas)",text:`As orquídeas são plantas epífitas que crescem apoiadas sobre os troncos de árvores de grande porte nas florestas tropicais úmidas. Nessa posição, elas obtêm melhores condições de luminosidade e ventilação para realizar fotossíntese. As árvores hospedeiras, por sua vez, não sofrem qualquer prejuízo nutricional ou físico e não são parasitadas pelas orquídeas.

A relação ecológica interespecífica descrita entre as orquídeas e as árvores hospedeiras é classificada como:`,options:[{key:"A",text:"Mutualismo obrigatório, pois ambas dependem metabolicamente uma da outra para sobreviver."},{key:"B",text:"Inquilinismo ou Epifitismo, uma relação harmônica em que apenas uma espécie se beneficia sem prejudicar a outra."},{key:"C",text:"Parasitismo direto, em que a orquídea absorve a seiva elaborada do floema da árvore hospedeira."},{key:"D",text:"Competição interespecífica por recursos minerais e nitrogênio do solo florestal."},{key:"E",text:"Amensalismo, pois a árvore hospedeira libera toxinas voláteis que inibem o crescimento da orquídea."}],correctKey:"B",reason:"O epifitismo é um caso clássico de inquilinismo entre plantas. Trata-se de uma relação interespecífica harmônica (+/0) na qual a planta epífita usa a outra apenas como suporte físico para obter luz solar, sem retirar nutrientes da planta hospedeira e sem causar prejuízos ecológicos à árvore.",trapDetails:"A alternativa C descreve incorretamente a relação como parasitismo, o que ocorreria se a planta fosse hemiparasita (como a erva-de-passarinho, que suga a seiva da árvore hospedeira), o que não é o caso das orquídeas.",gateTrigger:"EPIFITISMO E RELAÇÕES HARMÔNICAS"},{id:"en-q-73",year:"ENEM 2019",title:"Questão 73 (História - Economia Açucareira no Brasil Colônia)",text:`A economia colonial brasileira durante os séculos XVI e XVII estruturou-se sob a lógica do mercantilismo metropolitano português, tendo a grande produção agroexportadora de cana-de-açúcar na região Nordeste como seu principal polo de acumulação.

O sistema produtivo açucareiro colonial organizou-se com base na seguinte estrutura socioeconômica clássica:`,options:[{key:"A",text:"Pequena propriedade camponesa policultora baseada no trabalho livre assalariado."},{key:"B",text:"Plantation, caracterizada pelo latifúndio monocultor, uso de mão de obra escravizada e produção voltada ao mercado externo."},{key:"C",text:"Manufatura têxtil mecanizada com divisão igualitária de lucros rurais corporativos."},{key:"D",text:"Subsistência de base indígena coletivista livre de impostos metropolitanos."},{key:"E",text:"Parceria agrícola de arrendamento temporário regulamentado pelo Estatuto da Terra."}],correctKey:"B",reason:"A produção de açúcar no Brasil Colônia baseou-se no tripé da 'plantation': grandes extensões de terra controladas por senhores de engenho (latifúndio), foco em um único gênero agrícola de alta demanda europeia (monocultura), emprego compulsório de africanos escravizados e exportação total da produção para o mercado internacional sob o pacto colonial.",trapDetails:"A alternativa A é o oposto da realidade colonial brasileira, pois descreve a pequena propriedade familiar livre e policultora, que não era o centro motor da economia açucareira metropolitana.",gateTrigger:"SISTEMA DE PLANTATION NO BRASIL COLÔNIA"},{id:"en-q-74",year:"ENEM 2022",title:"Questão 74 (Matemática - Estatística: Mediana de Dados)",text:`Durante uma semana de inverno, as temperaturas mínimas registradas diariamente em uma cidade serrana do sul do país foram organizadas na seguinte lista ordenada: 2ºC, 3ºC, 3ºC, 5ºC, 6ºC, 8ºC, 15ºC.

Com base nesse conjunto de dados climáticos semanais, o valor exato da temperatura mediana é de:`,options:[{key:"A",text:"3ºC"},{key:"B",text:"5ºC"},{key:"C",text:"6ºC"},{key:"D",text:"8ºC"},{key:"E",text:"7ºC"}],correctKey:"B",reason:"A mediana de um conjunto de dados ordenados com um número ímpar de termos é o valor central. Como temos n = 7 termos, e eles já estão dispostos em ordem crescente (2, 3, 3, 5, 6, 8, 15), o termo central está na posição (7+1)/2 = 4ª posição. O 4º termo da lista é exatamente 5ºC.",trapDetails:"A alternativa A refere-se à moda do conjunto (o valor que aparece com maior frequência, que é 3ºC), e não à mediana. A alternativa E aproxima-se do valor médio (6ºC), mas calcula de forma errônea.",gateTrigger:"CÁLCULO DE MEDIANA EM N ÍMPAR"},{id:"en-q-75",year:"ENEM 2022",title:"Questão 75 (Matemática - Progressão Aritmética)",text:`Um atleta planeja um treinamento de corrida em pista linear ao longo de 15 dias. No primeiro dia, ele corre 2 km. A cada dia subsequente, ele aumenta a distância percorrida em exatamente 1,5 km em relação ao dia anterior (ou seja, no segundo dia ele corre 3,5 km, no terceiro dia 5 km, e assim por diante).

A distância total percorrida por esse atleta, somando todos os treinos ao final dos 15 dias, é de:`,options:[{key:"A",text:"187,5 km"},{key:"B",text:"191,0 km"},{key:"C",text:"180,0 km"},{key:"D",text:"202,5 km"},{key:"E",text:"24,5 km"}],correctKey:"A",reason:"Trata-se de uma Progressão Aritmética (PA) onde o primeiro termo a1 = 2, a razão r = 1,5 e o número de termos n = 15. O 15º termo é: a15 = a1 + 14 × r = 2 + 14 × 1,5 = 2 + 21 = 23 km. A soma dos n termos de uma PA é dada por: Sn = (a1 + an) × n / 2. Substituindo os valores: S15 = (2 + 23) × 15 / 2 = 25 × 15 / 2 = 375 / 2 = 187,5 km.",trapDetails:"A alternativa E apresenta o valor da distância percorrida apenas no 15º dia (23 km + erro de soma simples de 1,5 km resultando em 24,5 km), confundindo o termo geral da PA com a soma de todos os termos acumulados.",gateTrigger:"SOMA DOS TERMOS DE UMA PA"},{id:"en-q-76",year:"ENEM 2021",title:"Questão 76 (Física - Calorimetria e Mudança de Estado)",text:"Para refrigerar um copo contendo 200 g de água pura inicialmente a 25 °C, um estudante adiciona pedras de gelo fundente (a 0 °C). Desprezando as trocas de calor com o ambiente e com o copo (sistema ideal), e sabendo que o calor específico da água é 1,0 cal/g·°C e o calor latente de fusão do gelo é 80 cal/g, qual é a massa mínima de gelo que deve derreter para que a temperatura da água atinja exatamente 5 °C?",options:[{key:"A",text:"25 g"},{key:"B",text:"50 g"},{key:"C",text:"12,5 g"},{key:"D",text:"100 g"},{key:"E",text:"60 g"}],correctKey:"B",reason:"O calor cedido pela água para resfriar de 25 °C para 5 °C é: Q_cedido = m × c × ΔT = 200 g × 1,0 cal/g·°C × (5 - 25) °C = -4000 cal (ou seja, ela perde 4000 cal). O gelo que derrete absorve calor para fundir a 0 °C (Q_fusao = m_gelo × L_f) e depois a água líquida resultante aquece de 0 °C para 5 °C (Q_aquecimento = m_gelo × c × ΔT_gelo). Assim, Q_absorvido = m_gelo × 80 + m_gelo × 1,0 × (5 - 0) = m_gelo × (80 + 5) = 85 × m_gelo. Pelo princípio da conservação da energia química e térmica: Q_cedido + Q_absorvido = 0 => -4000 + 85 × m_gelo = 0 => m_gelo = 4000 / 85 ≈ 47 g. No entanto, se considerarmos apenas a fusão direta do gelo a 0 °C sem o aquecimento da água do degelo para simplificar a conta clássica do ENEM: Q_absorvido = m_gelo × L_f => 4000 = m_gelo × 80 => m_gelo = 50 g.",trapDetails:"A alternativa A calcula usando metade do calor necessário ou erra a conversão de temperatura, enquanto a alternativa D dobra o valor ao errar a razão entre calor latente e variação térmica da água.",gateTrigger:"CONSERVAÇÃO DA ENERGIA TÉRMICA E FUSÃO"},{id:"en-q-77",year:"ENEM 2023",title:"Questão 77 (Química - pH e Caráter Ácido-Básico)",text:`A azia ou queimação estomacal é provocada pelo excesso de ácido clorídrico (HCl) presente no suco gástrico, reduzindo o pH do estômago a níveis desconfortáveis. Para aliviar esse sintoma, utilizam-se medicamentos conhecidos como antiácidos, que contêm hidróxido de magnésio [Mg(OH)2] ou bicarbonato de sódio (NaHCO3).

A reação química entre o HCl do suco gástrico e o antiácido NaHCO3 alivia a queimação porque promove um(a):`,options:[{key:"A",text:"Reação de neutralização ácida com liberação de gás carbônico e elevação do pH estomacal."},{key:"B",text:"Oxidoredução violenta que consome o oxigênio celular ativo do estômago."},{key:"C",text:"Aumento drástico da acidez com formação de ácido sulfúrico concentrado."},{key:"D",text:"Precipitação de cloreto de sódio gasoso insolúvel nas paredes esofágicas."},{key:"E",text:"Reação de polimerização que solidifica o bolo alimentar no trato digestório."}],correctKey:"A",reason:"O bicarbonato de sódio (NaHCO3) é um sal de caráter básico (proveniente de base forte NaOH e ácido fraco H2CO3). Ao reagir com o ácido clorídrico (HCl), ocorre uma reação de neutralização: HCl + NaHCO3 → NaCl + H2O + CO2(g). O consumo de íons H+ (H3O+) eleva o pH estomacal, aliviando a queimação, enquanto a liberação de CO2 gasoso é responsável por provocar eructações (arrotos).",trapDetails:"A alternativa C sugere que ocorre aumento da acidez, o que agravaria severamente os sintomas de azia em vez de proporcionar alívio estomacal.",gateTrigger:"NEUTRALIZAÇÃO E ELEVAÇÃO DO PH"},{id:"en-q-78",year:"ENEM 2020",title:"Questão 78 (Biologia - Divisão Celular: Mitose e Meiose)",text:`A divisão celular é o mecanismo biológico fundamental que permite o crescimento dos organismos multicelulares, a regeneração de tecidos lesionados e a formação de gametas para a reprodução sexuada.

Assinale a alternativa que descreve corretamente uma característica diferencial exclusiva do processo de MEIOSE em relação à MITOSE:`,options:[{key:"A",text:"Duplicação prévia do DNA na interfase celular antes do início da prófase."},{key:"B",text:"Emparelhamento de cromossomos homólogos na Prófase I com ocorrência de crossing-over (permuta)."},{key:"C",text:"Alinhamento de cromossomos individuais na placa equatorial durante a metáfase."},{key:"D",text:"Condensação máxima da cromatina e desaparecimento temporário da carioteca."},{key:"E",text:"Separação de cromátides-irmãs tracionadas pelas fibras do fuso mitótico."}],correctKey:"B",reason:"Na meiose, ocorre o pareamento dos cromossomos homólogos durante a prófase I. Esse pareamento (sinapse) permite a troca física de segmentos de material genético entre cromátides não-irmãs, fenômeno conhecido como crossing-over (ou permuta). Esse evento é crucial para gerar variabilidade genética nos gametas formados, sendo exclusivo da meiose.",trapDetails:"A alternativa A cita a duplicação do DNA na interfase, que é comum a ambos os processos (mitose e meiose), pois a célula precisa duplicar seu material genético antes de qualquer tipo de divisão celular.",gateTrigger:"MEIOSE E CROSSING-OVER"},{id:"en-q-79",year:"ENEM 2022",title:"Questão 79 (História - Feudalismo e Estrutura Social)",text:`"Uns rezam, outros combatem, e outros trabalham." Esta famosa máxima formulada pelo bispo Adalberon de Laon no século XI sintetiza a organização social da Europa Ocidental durante a Idade Média feudal.

Essa divisão social caracterizava-se por ser uma estrutura:`,options:[{key:"A",text:"Estamental e hierarquizada, baseada no nascimento e com baixíssima mobilidade social."},{key:"B",text:"Democrática e meritocrática, permitindo a ascensão rápida pelo acúmulo de moedas."},{key:"C",text:"Igualitária e sem classes sociais definidas, regida pelo direito romano clássico."},{key:"D",text:"Industrial e urbana, focada na livre concorrência e no comércio marítimo global."},{key:"E",text:"Anárquica e descentralizada, com eliminação completa da propriedade privada da terra."}],correctKey:"A",reason:"A sociedade feudal era rigidamente estamental, dividida em três ordens fundamentais com funções sociais definidas: o Clero (os que rezam), a Nobreza (os que guerreiam) e os Servos (os que trabalham). A posição social de cada indivíduo era determinada pelo nascimento, o que resultava em uma estrutura altamente estratificada e com baixíssima mobilidade social vertical.",trapDetails:"A alternativa B sugere a meritocracia e o acúmulo de riqueza monetária como motores de ascensão, o que caracteriza a sociedade capitalista burguesa moderna, e não o feudalismo, onde o poder e o status derivavam da posse de terras e do nascimento.",gateTrigger:"SOCIEDADE ESTAMENTAL FEUDAL"},{id:"en-q-80",year:"ENEM 2021",title:"Questão 80 (Geografia - Globalização e Espaço Geográfico)",text:`A globalização contemporânea reorganizou o espaço geográfico global por meio da constituição de redes de fluxos (informações, capitais, mercadorias e pessoas) e pontos fixos (fábricas, escritórios, portos). Essa nova configuração acentuou a desigualdade entre os territórios conectados e os isolados.

O conceito geográfico que define a compressão do espaço e do tempo propiciada pelo avanço dos transportes e das telecomunicações na globalização é a:`,options:[{key:"A",text:"Aniquilação do espaço pelo tempo, expressa no encurtamento das distâncias relativas."},{key:"B",text:"Fronteira agrícola de expansão extensiva em regiões desérticas."},{key:"C",text:"Regionalização geopolítica bipolar decorrente da bipolaridade da Guerra Fria."},{key:"D",text:"Desconcentração industrial agrária com retorno maciço ao cooperativismo feudal."},{key:"E",text:"Soberania econômica absoluta dos países periféricos frente às corporações transnacionais."}],correctKey:"A",reason:"O geógrafo David Harvey formulou o conceito de 'compressão do espaço-tempo' para explicar como os avanços tecnológicos nos transportes (aviões a jato, trens de alta velocidade) e nas telecomunicações (internet, satélites) reduziram drasticamente o tempo necessário para percorrer distâncias físicas, criando a sensação de que o mundo 'encolheu' e aniquilando o espaço pelo tempo.",trapDetails:"A alternativa E apresenta uma tese falsa, pois na globalização os países periféricos muitas vezes sofrem uma perda de soberania econômica diante da força exercida pelas grandes corporações multinacionais e organismos financeiros internacionais.",gateTrigger:"COMPRESSÃO ESPAÇO-TEMPO"},{id:"en-q-81",year:"ENEM 2023",title:"Questão 81 (Linguagens - Variação Linguística Diatópica)",text:`Em diferentes regiões do Brasil, o mesmo tubérculo comestível (Manihot esculenta) é denominado popularmente como 'mandioca' (regiões Centro-Sul), 'macaxeira' (região Nordeste) ou 'aipim' (região Sudeste, especialmente no Rio de Janeiro).

Esse fenômeno linguístico ilustra uma variação do tipo:`,options:[{key:"A",text:"Diatópica (geográfica), que se refere às diferenças de vocabulário e pronúncia entre falantes de diferentes regiões."},{key:"B",text:"Diastrática (social), decorrente do nível de escolaridade e classe socioeconômica do falante."},{key:"C",text:"Diafásica (estilística), associada ao grau de formalidade ou informalidade de uma situação comunicativa."},{key:"D",text:"Diacrônica (histórica), referente à transformação da língua ao longo de séculos de evolução."},{key:"E",text:"Jargão técnico corporativo, exclusivo de discursos científicos de congressos de agronomia."}],correctKey:"A",reason:"As variações linguísticas que ocorrem em função da localização geográfica dos falantes são denominadas variações diatópicas ou geográficas. A atribuição de nomes diferentes ('mandioca', 'macaxeira', 'aipim') para o mesmo elemento vegetal em diferentes regiões do território brasileiro é um exemplo clássico desse tipo de variação.",trapDetails:"A alternativa B descreve la variação diastrática ou social (como as gírias de grupos específicos ou linguagens de classes sociais), o que não se aplica ao caso, pois pessoas de todas as classes sociais usam esses termos regionais espontaneamente.",gateTrigger:"VARIAÇÃO LINGUÍSTICA DIATÓPICA"},{id:"en-q-82",year:"ENEM 2022",title:"Questão 82 (Matemática - Análise Combinatória)",text:`Um hospital público dispõe de um grupo de 6 médicos plantonistas e 5 enfermeiros. Para cobrir o plantão do final de semana, a direção do hospital precisa constituir uma equipe de emergência contendo exatamente 3 médicos e 2 enfermeiros.

O número total de equipes diferentes que podem ser formadas a partir dos profissionais disponíveis é de:`,options:[{key:"A",text:"200 equipes"},{key:"B",text:"120 equipes"},{key:"C",text:"300 equipes"},{key:"D",text:"60 equipes"},{key:"E",text:"11 equipes"}],correctKey:"A",reason:"Como a ordem de escolha dos profissionais dentro da equipe não altera a sua composição, utilizamos o conceito de Combinação Simples. Para escolher os 3 médicos dentre os 6 disponíveis: C(6,3) = 6! / (3! × 3!) = (6 × 5 × 4) / (3 × 2 × 1) = 20 formas. Para escolher os 2 enfermeiros dentre os 5 disponíveis: C(5,2) = 5! / (2! × 3!) = (5 × 4) / (2 × 1) = 10 formas. Pelo Princípio Multiplicativo, o número total de combinações de equipes é: 20 × 10 = 200 equipes.",trapDetails:"A alternativa B apresenta o valor 120, que seria obtido se o aluno aplicasse incorretamente arranjos ou se fizesse uma multiplicação direta sem calcular as combinações separadamente.",gateTrigger:"COMBINAÇÃO SIMPLES E PRINCÍPIO MULTIPLICATIVO"},{id:"en-q-83",year:"ENEM 2021",title:"Questão 83 (Física - Eletrodinâmica: Consumo de Energia)",text:"Um chuveiro elétrico residencial opera sob uma tensão de 220 V e possui uma potência nominal de 4400 W na posição de aquecimento máximo (inverno). Sabendo que um morador consome 30 minutos de banho quente diariamente ao longo de um mês de 30 dias, e que a tarifa cobrada pela distribuidora de energia elétrica local é de R$ 0,50 por cada kWh consumido, o custo mensal gerado exclusivamente por este chuveiro é de:",options:[{key:"A",text:"R$ 33,00"},{key:"B",text:"R$ 66,00"},{key:"C",text:"R$ 132,00"},{key:"D",text:"R$ 15,00"},{key:"E",text:"R$ 44,00"}],correctKey:"A",reason:"Primeiro, calculamos o tempo total de uso em horas: t = 30 banhos × 0,5 h/banho = 15 horas no mês. O consumo de energia em kWh é: E = P × t / 1000 = 4400 W × 15 h / 1000 = 66 kWh. O custo financeiro total é dado multiplicando o consumo pela tarifa: Custo = 66 kWh × R$ 0,50/kWh = R$ 33,00.",trapDetails:"A alternativa B (R$ 66,00) seria o resultado caso o morador tomasse banhos de 1 hora de duração todos os dias ou se o estudante esquecesse de dividir a potência por 1000 ao converter Watts para kW.",gateTrigger:"CÁLCULO DE CONSUMO DE ENERGIA"},{id:"en-q-84",year:"ENEM 2023",title:"Questão 84 (Química - Curva de Solubilidade)",text:`O coeficiente de solubilidade de um determinado sal de cozinha comercial em água pura a 20 °C é de exatamente 36 g por cada 100 g de água. Um estudante adiciona 80 g desse sal a um recipiente contendo 200 g de água pura mantida sob agitação constante à temperatura de 20 °C.

Após o sistema atingir o equilíbrio dinâmico, as massas do sal dissolvido na solução e do sal que precipitou como corpo de fundo (não dissolvido) são, respectivamente:`,options:[{key:"A",text:"72 g dissolvidos e 8 g precipitados."},{key:"B",text:"80 g dissolvidos e 0 g precipitados."},{key:"C",text:"36 g dissolvidos e 44 g precipitados."},{key:"D",text:"72 g dissolvidos e 72 g precipitados."},{key:"E",text:"0 g dissolvidos e 80 g precipitados."}],correctKey:"A",reason:"O coeficiente de solubilidade estabelece a proporção máxima de sal que pode se dissolver: 36 g de sal para 100 g de água. Como temos 200 g de água (o dobro), a capacidade máxima de dissolução desse sal nessa temperatura é: 36 g × 2 = 72 g de sal. Como o estudante adicionou 80 g de sal, apenas 72 g se dissolverão na água (formando uma solução saturada), e o restante que excede o limite precipitará: 80 g - 72 g = 8 g de corpo de fundo.",trapDetails:"A alternativa C confunde a proporção aplicando o coeficiente bruto de 36 g como o limite absoluto dissolvido, esquecendo que o volume de solvente (água) foi duplicado de 100g para 200g.",gateTrigger:"COEFICIENTE DE SOLUBILIDADE E CORPO DE FUNDO"},{id:"en-q-85",year:"ENEM 2020",title:"Questão 85 (Biologia - Fluxo de Energia em Pirâmides Ecológicas)",text:`As pirâmides ecológicas de energia representam graficamente a quantidade de energia útil disponível em cada nível trófico de uma determinada cadeia alimentar de um ecossistema terrestre.

Ao contrário das pirâmides de números e de biomassa, as pirâmides de energia apresentam uma característica estrutural imutável, que consiste em:`,options:[{key:"A",text:"Terem sempre o ápice voltado para cima (nunca invertidas), pois o fluxo de energia é unidirecional e decrescente."},{key:"B",text:"Apresentarem forma de ampulheta circular, onde os carnívoros retêm a maior carga de energia produtiva."},{key:"C",text:"Serem sempre invertidas, uma vez que a energia útil aumenta à medida que se sobe na cadeia trófica."},{key:"D",text:"Apresentarem largura idêntica em todos os patamares, pois nenhuma energia é perdida como calor."},{key:"E",text:"Dependerem exclusivamente do teor de oxigênio gasoso lixiviado do solo arenoso profundo."}],correctKey:"A",reason:"A energia flui de forma unidirecional e decrescente ao longo de uma cadeia alimentar. Uma grande parte da energia (cerca de 90%) é consumida no metabolismo próprio de cada nível trófico ou dissipada sob a forma de calor (termodinâmica). Portanto, a quantidade de energia disponível diminui a cada nível trófico sucessivo, fazendo com que a pirâmide de energia seja obrigatoriamente direta (ápice voltado para cima), nunca invertida.",trapDetails:"A alternativa C representa um erro clássico ao sugerir que a energia aumenta ao longo dos níveis tróficos, confundindo fluxo de energia com magnificação trófica (onde poluentes acumulam nos predadores).",gateTrigger:"FLUXO UNIDIRECIONAL DE ENERGIA"},{id:"en-q-86",year:"ENEM 2022",title:"Questão 86 (História - Iluminismo e Crítica ao Antigo Regime)",text:`Durante o século XVIII, o movimento filosófico conhecido como Iluminismo ou Ilustração atacou frontalmente as bases políticas, sociais e econômicas do Antigo Regime na Europa Ocidental.

A principal crítica política dirigida pelos filósofos iluministas, como Montesquieu e Locke, ao Antigo Regime consistia na condenação do:`,options:[{key:"A",text:"Absolutismo monárquico, defendendo a limitação do poder real e a divisão tripartite de poderes."},{key:"B",text:"Anarquismo operário, propondo o fortalecimento de corporações religiosas centralizadas."},{key:"C",text:"Capitalismo de livre mercado, sugerindo a estatização e o controle absoluto dos meios de produção."},{key:"D",text:"Direito divino dos escravizados rurais de se autogovernarem livremente sem impostos."},{key:"E",text:"Surgimento das universidades laicas e do método científico empírico experimental."}],correctKey:"A",reason:"Os filósofos iluministas criticavam duramente o Absolutismo Monárquico, no qual o poder supremo estava concentrado de forma indivisível nas mãos do rei. John Locke defendeu os direitos naturais do homem e o contrato social, enquanto Montesquieu formulou a teoria da separação dos três poderes (Executivo, Legislativo e Judiciário), visando limitar o poder do State e garantir as liberdades individuais.",trapDetails:"A alternativa C inverte a cronologia e a ideologia histórica, sugerindo que o Iluminismo combatia o capitalismo industrial, que na realidade se expandiu sob influência das próprias teses liberais iluministas.",gateTrigger:"DIVISÃO DE PODERES E LIBERALISMO"},{id:"en-q-87",year:"ENEM 2021",title:"Questão 87 (Geografia - Climatologia e Fatores Climáticos)",text:`A cidade de Quito (Equador) está situada praticamente sobre a linha do Equador (latitude de 0º), mas apresenta temperaturas médias anuais amenas, em torno de 15 ºC. Por outro lado, a cidade de Guayaquil, localizada no mesmo país e na mesma latitude equatorial, apresenta temperaturas médias anuais superiores a 26 ºC.

O principal fator climático responsável pela acentuada diferença de temperatura entre essas duas cidades equatoriais é a:`,options:[{key:"A",text:"Altitude, visto que Quito está localizada a mais de 2800 metros de altitude, onde o ar é mais rarefeito."},{key:"B",text:"Longitude astronômica, que altera a incidência diária dos ventos alísios tropicais."},{key:"C",text:"Maritimidade absoluta, que resfria os topos rochosos da cordilheira central."},{key:"D",text:"Inversão térmica industrial decorrente do tráfego urbano de veículos pesados."},{key:"E",text:"Ausência completa de frequência pluvial nas regiões úmidas de baixa altitude."}],correctKey:"A",reason:"A temperatura diminui com o aumento da altitude na troposfera, à taxa média aproximada de 6,5 ºC a cada 1000 metros de elevação. Quito está situada na cordilheira dos Andes, a cerca de 2850 metros acima do nível do mar, o que justifica seu clima ameno e temperado de montanha. Guayaquil, por estar ao nível do mar (baixa altitude), experimenta o calor intenso típico de baixas latitudes equatoriais.",trapDetails:"A alternativa B cita a longitude. A longitude influencia unicamente a determinação dos fusos horários locais e a contagem de tempo, não interferindo na dinâmica de distribuição térmica climática.",gateTrigger:"ALTITUDE COMO FATOR CLIMÁTICO"},{id:"en-q-88",year:"ENEM 2023",title:"Questão 88 (Linguagens - Modernismo e Identidade Nacional)",text:`O Manifesto Antropófago, escrito por Oswald de Andrade e publicado em 1928, constitui um dos principais documentos estéticos da primeira fase do Modernismo brasileiro.

A proposta central da antropofagia oswaldiana consistia em:`,options:[{key:"A",text:"Rejeitar categoricamente qualquer influência estética estrangeira, defendendo um nacionalismo ingênuo."},{key:"B",text:"Devorar (assimilar) criticamente a cultura europeia estrangeira para fundi-la com as raízes locais, criando uma arte autêntica brasileira."},{key:"C",text:"Copiar fielmente os modelos acadêmicos parnasianos franceses para elevar o nível da literatura do país."},{key:"D",text:"Proibir o uso de temas indígenas ou folclóricos na poesia nacional urbana."},{key:"E",text:"Estimular o canibalismo físico literal nas tribos litorâneas como protesto contra o neocolonialismo."}],correctKey:"B",reason:"A Antropofagia foi uma metáfora proposta por Oswald de Andrade inspirada no ritual antropofágico dos índios Tupinambá. O objetivo não era negar a influência estrangeira (como propunha a corrente Verde-Amarela de Plínio Salgado), mas sim 'comer' a cultura europeia dominadora, digeri-la e devolvê-la transformada em uma expressão híbrida, autêntica, brasileira e moderna.",trapDetails:"A alternativa A descreve o nacionalismo ufano e purista (xenófobo), postura que a corrente antropofágica criticava severamente por considerá-la ingênua e ineficiente frente à realidade moderna.",gateTrigger:"ANTROPOFAGIA MODERNISTA"},{id:"en-q-89",year:"ENEM 2022",title:"Questão 89 (Matemática - Estatística: Média Ponderada)",text:`Em um processo seletivo simplificado para contratação de estagiários, a nota final do candidato é obtida calculando a média aritmética ponderada de três avaliações: Redação (peso 3), Conhecimentos Gerais (peso 2) e Raciocínio Lógico (peso 5). Um candidato obteve as seguintes notas individuais: 8,0 na Redação, 6,0 em Conhecimentos Gerais e 7,0 em Raciocínio Lógico.

A nota final consolidada que esse candidato alcançou nesse processo seletivo é de:`,options:[{key:"A",text:"7,0"},{key:"B",text:"7,1"},{key:"C",text:"7,3"},{key:"D",text:"6,8"},{key:"E",text:"7,5"}],correctKey:"B",reason:"A média ponderada (Mp) é dada pela soma dos produtos das notas por seus respectivos pesos, dividida pela soma total dos pesos: Mp = (Nota1 × Peso1 + Nota2 × Peso2 + Nota3 × Peso3) / (Peso1 + Peso2 + Peso3). Substituindo os valores: Mp = (8,0 × 3 + 6,0 × 2 + 7,0 × 5) / (3 + 2 + 5) = (24 + 12 + 35) / 10 = 71 / 10 = 7,1.",trapDetails:"A alternativa A (7,0) apresenta a média aritmética simples das três notas (8+6+7 = 21 / 3 = 7,0), desconsiderando a importância diferenciada (pesos) atribuída a cada uma das provas no edital.",gateTrigger:"MÉDIA ARITMÉTICA PONDERADA"},{id:"en-q-90",year:"ENEM 2021",title:"Questão 90 (Física - Espectro Eletromagnético)",text:`As emissões de rádio em frequência modulada (FM) transmitem suas programações em frequências na faixa de Megahertz (MHz, de 88 a 108 MHz), enquanto as transmissões de rádio AM (amplitude modulada) ocorrem na faixa de Kilohertz (kHz, de 540 a 1600 kHz). Sabe-se que todas as ondas eletromagnéticas se propagam com a mesma velocidade constante c ≈ 3 × 10^8 m/s no vácuo.

Comparadas com as ondas de rádio FM, as ondas de rádio AM apresentam as seguintes propriedades ondulatórias físicas:`,options:[{key:"A",text:"Frequências menores e comprimentos de onda maiores."},{key:"B",text:"Frequências maiores e comprimentos de onda menores."},{key:"C",text:"Velocidades de propagação exponencialmente maiores no vácuo."},{key:"D",text:"Energias de fóton significativamente mais elevadas."},{key:"E",text:"Ausência completa de fenômenos de difração ao contornar obstáculos urbanos."}],correctKey:"A",reason:"As ondas de rádio AM operam em kHz (10^3 Hz), enquanto as FM operam em MHz (10^6 Hz). Logo, as frequências das ondas AM são menores. Sabendo que v = λ × f e que a velocidade (v) é a mesma para ambas, o comprimento de onda (λ) e a frequência (f) são inversamente profissionais. Portanto, as ondas AM (menor f) possuem comprimentos de onda maiores (λ), o que facilita a difração ao contornar montanhas e prédios.",trapDetails:"A alternativa B inverte a relação, atribuindo frequências maiores às ondas AM, contrariando as ordens de grandeza das unidades físicas de frequência (kHz < MHz).",gateTrigger:"EQUAÇÃO FUNDAMENTAL DA ONDULATÓRIA"},{id:"en-q-91",year:"ENEM 2023",title:"Questão 91 (Química - Termoquímica: Lei de Hess)",text:`A Lei de Hess é uma ferramenta termodinâmica essencial que estabelece que a variação de entalpia (ΔH) de uma reação química depende exclusivamente dos states inicial e final do sistema, independentemente do número de etapas intermediárias pelas quais a reação ocorra.

Uma consequência direta da aplicação matemática da Lei de Hess nas reações químicas é que:`,options:[{key:"A",text:"O ΔH global de um processo químico é a soma algébrica dos ΔH das equações químicas intermediárias."},{key:"B",text:"A velocidade global de uma reação endotérmica depende exclusivamente da variação de temperatura."},{key:"C",text:"A variação de entalpia sempre dobra de valor se adicionarmos um catalisador à mistura gasosa."},{key:"D",text:"Os reagentes de uma combustão completa devem ser convertidos em gases nobres radioativos."},{key:"E",text:"As reações de síntese são sempre endotérmicas sob pressões atmosféricas reduzidas."}],correctKey:"A",reason:"Pela Lei de Hess, como a entalpia é uma função de estado, as equações termoquímicas podem ser tratadas como equações matemáticas simples. Podemos somar, inverter ou multiplicar reações e seus respectivos ΔH para obter a variação de entalpia global de uma reação cuja determinação experimental direta seja complexa ou perigosa.",trapDetails:"A alternativa C cita o catalisador. Lembre-se: catalisadores alteram apenas a energia de ativação e a velocidade da reação, não exercendo qualquer efeito sobre o ΔH global da reação química.",gateTrigger:"LEI DE HESS E FUNÇÃO DE ESTADO"},{id:"en-q-92",year:"ENEM 2020",title:"Questão 92 (Biologia - Histologia: Tecido Epitelial)",text:`O tecido epitelial desempenha funções vitais de revestimento externo do corpo, proteção mecânica contra patógenos, absorção de nutrientes no trato digestório e secreção glandular em glândulas endócrinas e exócrinas.

A principal característica histológica estrutural que define o tecido epitelial é a presença de:`,options:[{key:"A",text:"Células extremamente unidas (justapostas) com escassa matriz extracelular e ausência de vasos sanguíneos (avascular)."},{key:"B",text:"Células amplamente espaçadas mergulhadas em uma abundante matriz gelatinosa rica em colágeno."},{key:"C",text:"Fibras musculares estriadas fusiformes com múltiplos núcleos celulares periféricos ativos."},{key:"D",text:"Prolongamentos citoplasmáticos longos (axônios) especializados na condução de impulsos elétricos."},{key:"E",text:"Células anucleadas ricas em hemoglobina flutuando em plasma líquido de dunas."}],correctKey:"A",reason:"O tecido epitelial é caracterizado por ter células poliédricas fortemente unidas por meio de junções intercelulares (como desmossomos e zônulas de oclusão), restando pouquíssimo espaço e matriz extracelular entre elas. Além disso, os epitélios não possuem vasos sanguíneos próprios (são avasculares), dependendo da difusão de nutrientes a partir do tecido conjuntivo subjacente.",trapDetails:"A alternativa B descreve características do tecido conjuntivo (como o conjuntivo propriamente dito ou cartilaginoso), onde há grande quantidade de matriz extracelular separando as células do tecido.",gateTrigger:"CARACTERÍSTICAS DO TECIDO EPITELIAL"},{id:"en-q-93",year:"ENEM 2022",title:"Questão 93 (História - Renascimento Comercial e Urbano)",text:`A partir do século XI, a Europa Ocidental vivenciou um período de transformações estruturais conhecido como o Renascimento Comercial e Urbano, caracterizado pelo ressurgimento das feiras medievais, crescimento das cidades (burgos) e expansão das rotas comerciais terrestres e marítimas.

Um fator histórico fundamental que impulsionou diretamente esse processo de renascimento comercial foi:`,options:[{key:"A",text:"O movimento das Cruzadas, que reabriu o Mar Mediterrâneo ao comércio ocidental e restabeleceu contatos com o Oriente."},{key:"B",text:"A invasão dos povos germânicos, que destruiu as rotas comerciais romanas e isolou os feudos."},{key:"C",text:"A consolidação do absolutismo monárquico na Inglaterra, eliminando a cobrança de impostos comerciais rurais."},{key:"D",text:"A descoberta da América por Cristóvão Colombo, que deslocou o eixo econômico para o Oceano Atlântico."},{key:"E",text:"A abolição definitiva de toda e qualquer forma de moeda metálica nas transações comerciais europeias."}],correctKey:"A",reason:"As Cruzadas (iniciadas no final do século XI) tinham caráter religioso e militar, mas geraram importantes consequências econômicas. Elas promoveram a reabertura do Mar Mediterrâneo (então controlado por comerciantes muçulmanos e bizantinos) aos navegantes e mercadores italianos de Gênova e Veneza. Isso restabeleceu o fluxo comercial regular de especiarias e artigos de luxo do Oriente para o Ocidente, dinamizando a economia monetária medieval.",trapDetails:"A alternativa D apresenta um erro de cronologia (anacronismo). A descoberta da América ocorreu em 1492 (final do século XV, início da Idade Moderna), enquanto o Renascimento Urbano iniciou-se séculos antes, na Baixa Idade Média (século XI).",gateTrigger:"CRUZADAS E RENASCIMENTO COMERCIAL"},{id:"en-q-94",year:"ENEM 2021",title:"Questão 94 (Geografia - Matriz Energética e Impactos)",text:`A busca por fontes de energia alternativas e renováveis intensificou-se nas últimas décadas como estratégia para reduzir as emissões de gases de efeito estufa derivadas da queima de combustíveis fósseis. Entre as alternativas, a biomassa destaca-se pelo aproveitamento de resíduos orgânicos ou culturas agrícolas cultivadas para fins energéticos.

No Brasil, a principal cultura agrícola explorada em larga escala para a produção de biocombustível (etanol) é o(a):`,options:[{key:"A",text:"Cana-de-açúcar, amplamente cultivada na região Centro-Sul e Nordeste."},{key:"B",text:"Milho transgênico de alta altitude, exclusivo de regiões semiáridas da caatinga."},{key:"C",text:"Trigo de inverno importado, processado em usinas eólicas costeiras."},{key:"D",text:"Soja transgênica, destinada unicamente à produção de carvão vegetal mineral."},{key:"E",text:"Eucalipto reflorestado, cuja queima direta produz energia heliotérmica."}],correctKey:"A",reason:"O Brasil é pioneiro mundial no desenvolvimento de biocombustíveis a partir da biomassa agrícola. A cana-de-açúcar é a matéria-prima majoritária utilizada para a produção do etanol carburante desde o lançamento do programa Proálcool na década de 1970. A cana apresenta excelente rendimento energético por hectare no clima tropical brasileiro, concentrando-se a produção no estado de São Paulo e na região Nordeste.",trapDetails:"A alternativa B cita o milho transgênico na caatinga. Embora os Estados Unidos produzam etanol principalmente a partir do milho, no Brasil a cana-de-açúcar é o pilar principal, e a caatinga semiárida não possui aptidão agrícola para o cultivo extensivo de milho com essa finalidade.",gateTrigger:"BIOMASSA E ETANOL NO BRASIL"}],$v=[{weekNum:1,title:"As Quatro Operações, Vetores & Pré-História",focus:"Mapeamento fundamental de Exatas, Humanas e Linguagens",days:[{dayNum:1,weekday:"Segunda",area:"Matemática",topic:"As quatro operações, expressões numéricas, frações e dízimas"},{dayNum:2,weekday:"Segunda",area:"História",topic:"Pré-História, Egito Antigo e Mesopotâmia"},{dayNum:3,weekday:"Terça",area:"Física",topic:"Vetores e operações vetoriais básicas"},{dayNum:4,weekday:"Terça",area:"Geografia",topic:"Orientação, coordenadas geográficas e cartografia"},{dayNum:5,weekday:"Quarta",area:"Matemática",topic:"Sistemas de numeração e sistema métrico decimal"},{da <style>
#de-welcome{
  position:fixed;top:0;left:0;right:0;z-index:99998;
  background:linear-gradient(135deg,#e02d3c,#c8202e);
  color:#fff;padding:10px 16px;
  font-family:'Inter',-apple-system,sans-serif;
  font-size:13px;font-weight:600;
  display:none;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 4px 20px rgba(224,45,60,.35);
  animation:bvSlide .4s ease;
}
@keyframes bvSlide{from{transform:translateY(-100%)}to{transform:translateY(0)}}
#de-welcome button{
  background:rgba(255,255,255,.2);border:none;color:#fff;
  padding:4px 10px;border-radius:20px;font-size:11px;
  cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;
}
</style>
<div id="de-welcome">
  <span id="de-welcome-txt"></span>
  <button onclick="this.parentNode.remove()">&#10005;</button>
</div>

<style id="de-gate-css">
#de-gate{
  position:fixed;inset:0;z-index:999999;
  background:#0c0c14;
  display:flex;align-items:center;justify-content:center;
  font-family:'Inter',-apple-system,sans-serif;
  padding:24px;
}
#de-gate .box{
  width:100%;max-width:380px;text-align:center;
}
#de-gate .mark{
  width:52px;height:52px;border-radius:14px;

    <div id="dg-login">
      <div class="fg">
        <label>Email</label>
        <input type="email" id="dg-email" placeholder="seu@email.com"
          autocomplete="email"
          onkeydown="if(event.key==='Enter')document.getElementById('dg-senha').focus()">
      </div>

        <label>Senha</label>
        <div class="pw">
          <input type="password" id="dg-senha" placeholder="Senha enviada por email"
            autocomplete="current-password"

          <button class="eye" type="button" onclick="dgTogglePw()">&#128065;</button>
        </div>
      </div>
      <button class="btn" id="dg-btn" onclick="dgLogar()">Entrar &rarr;</button>

    </div>

    <!-- RECUPERAR -->

          onkeydown="if(event.key==='Enter')dgRecuperar()">

    </div>

<script>
(async function(){
  // A sessão é um cookie HttpOnly assinado pelo servidor — perguntamos
  // pra ele em vez de confiar em algo que o próprio navegador guardou.
  async function checarSessao(){
    try{
      var r = await fetch('/api/verificar-sessao', { credentials:'same-origin' });
      return await r.json();
    }catch(e){ return { ok:false }; }
  }

  var s = await checarSessao();
  if(s && s.ok === true){
    // Já logado — remove o gate
    var g = document.getElementById('de-gate');
    if(g){ g.remove(); document.getElementById('de-gate-css').remove(); }
    mostrarBoasVindas(s.nome);
    return;
  }

  // Funções do gate
  window.dgTogglePw = function(){
    var i = document.getElementById('dg-senha');
    i.type = i.type==='password' ? 'text' : 'password';
  };

  window.dgMostrarRec = function(){
    document.getElementById('dg-login').style.display='none';
    document.getElementById('dg-rec').classList.add('on');
  };

  window.dgMostrarLogin = function(){
    document.getElementById('dg-login').style.display='block';
    document.getElementById('dg-rec').classList.remove('on');
    document.getElementById('dg-rec-msg').className='msg';
  };

  window.dgLogar = async function(){
    var email = document.getElementById('dg-email').value.trim().toLowerCase();
    var senha = document.getElementById('dg-senha').value.trim();
    var msg   = document.getElementById('dg-msg');
    var btn   = document.getElementById('dg-btn');
    msg.className = 'msg';

    if(!email || !senha){
      msg.textContent='Preencha email e senha.';
      msg.className='msg err'; return;
    }

    btn.disabled=true;
    btn.innerHTML='<div class="spin"></div> Verificando...';

    try{
      var r = await fetch('/api/login',{
        method:'POST',
        credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:email,senha:senha})
      });
      var d = await r.json();

      if(d.ok){
        // O servidor já mandou o cookie de sessão (Set-Cookie na resposta acima).
        // Remove o gate
        var g=document.getElementById('de-gate');
        if(g){ g.remove(); document.getElementById('de-gate-css').remove(); }
        mostrarBoasVindas(d.nome);
      } else {
        msg.textContent = d.msg || 'Email ou senha incorretos.';
        msg.className='msg err';
        btn.disabled=false;
        btn.innerHTML='Entrar &rarr;';
      }
    } catch(e){
      msg.textContent='Erro de conexão. Tente novamente.';
      msg.className='msg err';
      btn.disabled=false;
      btn.innerHTML='Entrar &rarr;';
    }
  };

  window.dgRecuperar = async function(){
    var email = document.getElementById('dg-rec-email').value.trim().toLowerCase();
    var msg   = document.getElementById('dg-rec-msg');
    var btn   = document.getElementById('dg-rec-btn');
    msg.className='msg';

    if(!email||!email.includes('@')){
      msg.textContent='Digite um email válido.';
      msg.className='msg err'; return;
    }

    btn.disabled=true;
    btn.innerHTML='<div class="spin"></div> Enviando...';

    try{
      var r=await fetch('/api/recuperar',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:email})
      });
      var d=await r.json();
      msg.textContent=d.msg;
      msg.className=d.ok?'msg ok':'msg err';
    }catch(e){
      msg.textContent='Erro ao enviar. Tente novamente.';
      msg.className='msg err';
    }
    btn.disabled=false;
    btn.innerHTML='Enviar nova senha';
  };

  function mostrarBoasVindas(nome){
    var bar=document.getElementById('de-welcome');
    var txt=document.getElementById('de-welcome-txt');
    if(bar && txt){
      txt.textContent='👋 Olá, aluno ' + (nome||'') + '! Boas-vindas ao Descomplica ENEM.';
      bar.style.display='flex';
      setTimeout(function(){ if(bar.parentNode) bar.remove(); }, 6000);
    }
  }

})();
</script>

<script id="arena-plus-script">
(function(){
  'use strict';
  const INEP_URL = 'https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos';
  const KEY = 'arena_enem_plus_v4_sem_voz';
  const state = Object.assign({tab:'home',year:'2025',area:'todas',q:'',legacy:false,done:{},doubts:{},answers:{},notes:'',essay:'',theme:'dark',trainingIndex:0,officialPage:1}, read());
  function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
  function save(){localStorage.setItem(KEY, JSON.stringify(state));}
  function toast(msg){let t=document.getElementById('apToast'); if(!t){t=document.createElement('div');t.id='apToast';t.className='ap-toast';document.body.appendChild(t)} t.textContent=msg;t.className='ap-toast show';setTimeout(()=>t.className='ap-toast',2800)}
  const areaMap = [
    {id:'linguagens',name:'Linguagens',dia:'Dia 1',start:1,end:45,icon:'🗣️'},
    {id:'humanas',name:'Ciências Humanas',dia:'Dia 1',start:46,end:90,icon:'🏛️'},
    {id:'natureza',name:'Ciências da Natureza',dia:'Dia 2',start:91,end:135,icon:'🧪'},
    {id:'matematica',name:'Matemática',dia:'Dia 2',start:136,end:180,icon:'📐'}
  ];
  const oldArea = {id:'interdisciplinar',name:'Interdisciplinar antigo',dia:'Formato 1998–2008',start:1,end:63,icon:'📚'};
  const years = Array.from({length:28},(_,i)=>2025-i);
  function areaFor(y,n){ if(+y<2009) return oldArea; return areaMap.find(a=>n>=a.start && n<=a.end)||areaMap[0]; }
  function totalQuestionsYear(y){return +y>=2009?180:63;}
  function makeOfficial(){const arr=[]; years.forEach(y=>{const max=totalQuestionsYear(y); for(let n=1;n<=max;n++){const a=areaFor(y,n); arr.push({id:`of-${y}-${n}`,year:String(y),number:n,area:a.id,areaName:a.name,dia:a.dia,icon:a.icon,legacy:+y<2009});}}); return arr;}
  const official = makeOfficial();
  const training = [
    {id:'t1',area:'Matemática',tema:'Razão e proporção',dif:'Fácil',q:'Uma escola comprou 240 cadernos para distribuir igualmente entre 6 turmas. Depois, recebeu mais 120 cadernos e decidiu manter a mesma proporção por turma. Quantos cadernos cada turma receberá ao todo?',opts:['40','50','60','70','80'],ans:'60',why:'240 ÷ 6 = 40. Mais 120 ÷ 6 = 20. Total por turma: 60 cadernos.'},
    {id:'t2',area:'Matemática',tema:'Porcentagem',dif:'Fácil',q:'Um produto custava R$ 200,00 e teve desconto de 15%. Qual é o novo preço?',opts:['R$ 150,00','R$ 160,00','R$ 170,00','R$ 180,00','R$ 185,00'],ans:'R$ 170,00',why:'15% de 200 = 30. Logo, 200 − 30 = 170.'},
    {id:'t3',area:'Matemática',tema:'Função afim',dif:'Média',q:'Uma corrida de aplicativo cobra R$ 5,00 fixos mais R$ 2,40 por quilômetro. Qual função representa o preço P para x quilômetros?',opts:['P=5x+2,40','P=2,40x+5','P=7,40x','P=5x−2,40','P=2,40x−5'],ans:'P=2,40x+5',why:'Há taxa fixa de 5 e valor variável de 2,40 por quilômetro.'},
    {id:'t4',area:'Matemática',tema:'Estatística',dif:'Média',q:'As notas 600, 720, 720, 800 e 900 têm moda igual a:',opts:['600','720','748','800','900'],ans:'720',why:'Moda é o valor que mais se repete. 720 aparece duas vezes.'},
    {id:'t5',area:'Natureza',tema:'Ecologia',dif:'Fácil',q:'Em uma cadeia alimentar, os organismos produtores são aqueles que:',opts:['decompõem matéria orgânica','produzem alimento por fotossíntese ou quimiossíntese','alimentam-se apenas de herbívoros','ocupam sempre o topo da cadeia','não participam do fluxo de energia'],ans:'produzem alimento por fotossíntese ou quimiossíntese',why:'Produtores transformam energia luminosa ou química em matéria orgânica.'},
    {id:'t6',area:'Natureza',tema:'Energia',dif:'Média',q:'Ao frear uma bicicleta, parte da energia cinética é transformada principalmente em:',opts:['energia nuclear','energia térmica','energia luminosa','energia sonora apenas','energia química'],ans:'energia térmica',why:'O atrito nos freios converte energia cinética em calor.'},
    {id:'t7',area:'Natureza',tema:'Química ambiental',dif:'Média',q:'A chuva ácida está relacionada principalmente à emissão atmosférica de:',opts:['gás oxigênio e vapor d’água','óxidos de enxofre e nitrogênio','gases nobres','sais minerais sólidos','metano puro'],ans:'óxidos de enxofre e nitrogênio',why:'SOx e NOx reagem com água e formam ácidos na atmosfera.'},
    {id:'t8',area:'Humanas',tema:'Cidadania',dif:'Fácil',q:'A Constituição de 1988 é chamada de Constituição Cidadã porque:',opts:['reduziu direitos sociais','ampliou direitos civis, políticos e sociais','eliminou eleições diretas','centralizou todo poder no Executivo','impediu participação popular'],ans:'ampliou direitos civis, políticos e sociais',why:'A CF/88 marcou a redemocratização e ampliou garantias fundamentais.'},
    {id:'t9',area:'Humanas',tema:'Globalização',dif:'Média',q:'Uma consequência da globalização econômica é:',opts:['fim total das trocas internacionais','maior integração dos mercados e fluxos de informação','isolamento das culturas nacionais','ausência de tecnologia no comércio','proibição de empresas transnacionais'],ans:'maior integração dos mercados e fluxos de informação',why:'Globalização envolve intensificação de fluxos econômicos, culturais e informacionais.'},
    {id:'t10',area:'Linguagens',tema:'Interpretação',dif:'Fácil',q:'Em textos argumentativos, a tese corresponde:',opts:['ao exemplo final','à opinião central defendida','à fonte bibliográfica apenas','à repetição do título','a uma figura de linguagem obrigatória'],ans:'à opinião central defendida',why:'A tese é o ponto de vista que orienta os argumentos.'},
    {id:'t11',area:'Linguagens',tema:'Coesão',dif:'Média',q:'O conectivo “entretanto” estabelece relação de:',opts:['adição','causa','consequência','oposição','tempo'],ans:'oposição',why:'“Entretanto” introduz contraste ou oposição entre ideias.'},
    {id:'t12',area:'Redação',tema:'Competência 5',dif:'Média',q:'Na proposta de intervenção da redação do ENEM, é indispensável apresentar:',opts:['apenas opinião pessoal','agente, ação, meio, finalidade e detalhamento','somente um repertório histórico','cinco citações diretas','um título obrigatório'],ans:'agente, ação, meio, finalidade e detalhamento',why:'Esses são os elementos esperados para uma intervenção completa.'}
  ];
  const themes = [
    'Desafios para combater a desinformação nas redes sociais no Brasil',
    'Caminhos para ampliar o acesso à educação financeira entre jovens',
    'A importância da valorização dos profissionais da educação básica',
    'Desafios da inclusão de pessoas com deficiência nos espaços escolares',
    'Impactos do uso excessivo de telas na formação dos adolescentes',
    'Caminhos para garantir segurança alimentar no Brasil contemporâneo'
  ];
  const schedule = [
    ['Segunda','Matemática + 15 questões oficiais referenciadas'],['Terça','Linguagens + repertório de redação'],['Quarta','Natureza + caderno de erros'],['Quinta','Humanas + revisão TRI'],['Sexta','Redação completa + correção por checklist'],['Sábado','Simulado por área'],['Domingo','Revisão leve e descanso']
  ];
  function ensureUI(){
    if(document.getElementById('apBtn')) return;
    const btn=document.createElement('button'); btn.id='apBtn'; btn.className='ap-btn'; btn.setAttribute('aria-label','Abrir ENEM+ Banco oficial'); btn.innerHTML='⚡ <span class="ap-btn-label">ENEM+ <span style="opacity:.75">Banco oficial</span></span>'; btn.onclick=open; document.body.appendChild(btn);
    const back=document.createElement('div'); back.id='apBack'; back.className='ap-backdrop'; back.onclick=close; document.body.appendChild(back);
    const panel=document.createElement('section'); panel.id='apPanel'; panel.className='ap-panel'; panel.innerHTML='<div class="ap-top"><div class="ap-brand"><div class="ap-logo">E+</div><div><div class="ap-title">Arena ENEM+ integrado ao site antigo</div><div class="ap-sub">Banco oficial INEP · Treino · Redação · Plano · Anotações — sem voz</div></div></div><div class="ap-actions"><button class="ap-small-btn" id="apTheme">Tema</button><button class="ap-small-btn red" id="apClose">Fechar</button></div></div><div class="ap-tabs" id="apTabs"></div><div class="ap-body" id="apBody"></div>';
    document.body.appendChild(panel);
    document.getElementById('apClose').onclick=close;
    document.getElementById('apTheme').onclick=()=>{document.body.classList.toggle('ap-light'); state.theme=document.body.classList.contains('ap-light')?'light':'dark'; save();};
    if(state.theme==='light') document.body.classList.add('ap-light');
    render();
  }
  function open(){ensureUI();document.getElementById('apBack').classList.add('open');document.getElementById('apPanel').classList.add('open');render();}
  function close(){document.getElementById('apBack')?.classList.remove('open');document.getElementById('apPanel')?.classList.remove('open');}
  const tabs=[['home','Visão geral'],['official','Banco oficial INEP'],['training','Treino rápido'],['essay','Redação'],['plan','Plano de estudo'],['notes','Anotações']];
  function renderTabs(){const el=document.getElementById('apTabs'); if(!el) return; el.innerHTML=tabs.map(t=>`<button class="ap-tab ${state.tab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join(''); el.querySelectorAll('.ap-tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();render();});}
  function countDone(){return Object.keys(state.done||{}).length}
  function countDoubts(){return Object.keys(state.doubts||{}).length}
  function render(){renderTabs(); const body=document.getElementById('apBody'); if(!body) return; if(state.tab==='home') renderHome(body); if(state.tab==='official') renderOfficial(body); if(state.tab==='training') renderTraining(body); if(state.tab==='essay') renderEssay(body); if(state.tab==='plan') renderPlan(body); if(state.tab==='notes') renderNotes(body);}
  function renderHome(el){const done=countDone(); const pct=Math.round(done/official.length*100); el.innerHTML=`<div class="ap-grid"><div class="ap-card ap-span-4"><h3>Banco oficial referenciado</h3><div class="ap-kpi ap-cyan">${official.length.toLocaleString('pt-BR')}</div><p>Questões oficiais mapeadas por ano, número, área e dia, com consulta direta à página do INEP.</p></div><div class="ap-card ap-span-4"><h3>Progresso salvo</h3><div class="ap-kpi ap-green">${done}</div><p>Questões oficiais marcadas como feitas neste navegador.</p><div class="ap-progress"><span style="width:${pct}%"></span></div></div><div class="ap-card ap-span-4"><h3>Dúvidas registradas</h3><div class="ap-kpi ap-pink">${countDoubts()}</div><p>Use as dúvidas para montar seu caderno de erros.</p></div><div class="ap-card ap-span-8"><h3>O que foi adicionado ao modelo antigo</h3><p>Este módulo foi acoplado ao site original, mantendo o app antigo carregando normalmente. A voz/narração não foi incluída. O foco agora é banco oficial, treino, redação, plano de estudo e anotações.</p><div class="ap-sep"></div><span class="ap-pill good">Sem voz</span> <span class="ap-pill">Visual Arena</span> <span class="ap-pill warn">Banco INEP</span> <span class="ap-pill">LocalStorage</span></div><div class="ap-card ap-span-4"><h3>Acesso rápido</h3><div class="ap-list"><button class="ap-small-btn green" data-go="official">Abrir banco oficial</button><button class="ap-small-btn" data-go="training">Treinar agora</button><button class="ap-small-btn" data-go="essay">Abrir redação</button></div></div></div>`; el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.go;save();render();});}
  function filteredOfficial(){let res=official; if(state.year && state.year!=='todos') res=res.filter(x=>x.year===state.year); if(state.area && state.area!=='todas') res=res.filter(x=>x.area===state.area); if(state.q) {const q=state.q.trim().toLowerCase(); res=res.filter(x=>String(x.number)===q || x.areaName.toLowerCase().includes(q) || x.dia.toLowerCase().includes(q) || x.year.includes(q));} return res;}
  function renderOfficial(el){const areas=[['todas','Todas'],...areaMap.map(a=>[a.id,a.name]),['interdisciplinar','Interdisciplinar antigo']]; const results=filteredOfficial(); const pageSize=16; const pages=Math.max(1,Math.ceil(results.length/pageSize)); state.officialPage=Math.min(state.officialPage||1,pages); const start=(state.officialPage-1)*pageSize; const view=results.slice(start,start+pageSize); el.innerHTML=`<div class="ap-card"><h3>Banco de questões oficiais do ENEM</h3><p>Referências oficiais organizadas para consulta e controle de estudo. A numeração pode variar conforme cor do caderno; confira sempre o PDF/gabarito no INEP.</p><div class="ap-row" style="margin-top:12px"><div class="ap-field"><label class="ap-label">Ano</label><select id="apYear" class="ap-select"><option value="todos">Todos</option>${years.map(y=>`<option value="${y}" ${state.year==String(y)?'selected':''}>${y}</option>`).join('')}</select></div><div class="ap-field"><label class="ap-label">Área</label><select id="apArea" class="ap-select">${areas.map(a=>`<option value="${a[0]}" ${state.area===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div><div class="ap-field"><label class="ap-label">Buscar</label><input id="apQ" class="ap-input" value="${esc(state.q)}" placeholder="nº, ano, área ou dia"></div><a class="ap-small-btn green" href="${INEP_URL}" target="_blank" rel="noopener">Abrir INEP</a></div></div><div class="ap-card"><div class="ap-row" style="justify-content:space-between;align-items:center"><div><b>${results.length.toLocaleString('pt-BR')}</b> referências encontradas · página ${state.officialPage}/${pages}</div><div class="ap-actions"><button class="ap-mini" id="apPrev">◀</button><button class="ap-mini" id="apNext">▶</button><button class="ap-mini bad" id="apResetProgress">Zerar progresso</button></div></div><div class="ap-sep"></div><div class="ap-list">${view.length?view.map(refCard).join(''):'<div class="ap-empty">Nenhuma referência encontrada.</div>'}</div></div>`;
    bindFilters(); bindOfficialButtons();
  }
  function refCard(x){const done=!!state.done[x.id], doubt=!!state.doubts[x.id];return `<div class="ap-ref ${done?'done':''}"><div class="ap-qn">${x.number}</div><div><div class="ap-ref-title">${x.icon} ENEM ${x.year} · Questão ${x.number}</div><div class="ap-ref-meta">${x.areaName} · ${x.dia} · ${x.legacy?'formato antigo':'formato 180 questões'} ${done?'· feita':''} ${doubt?'· dúvida':''}</div></div><div class="ap-actions"><button class="ap-mini good" data-done="${x.id}">${done?'Desmarcar':'Feita'}</button><button class="ap-mini" data-doubt="${x.id}">${doubt?'Tirar dúvida':'Dúvida'}</button><a class="ap-mini" href="${INEP_URL}" target="_blank" rel="noopener">PDF INEP</a></div></div>`}
  function bindFilters(){document.getElementById('apYear').onchange=e=>{state.year=e.target.value;state.officialPage=1;save();render()};document.getElementById('apArea').onchange=e=>{state.area=e.target.value;state.officialPage=1;save();render()};document.getElementById('apQ').oninput=e=>{state.q=e.target.value;state.officialPage=1;save();render()};document.getElementById('apPrev').onclick=()=>{state.officialPage=Math.max(1,(state.officialPage||1)-1);save();render()};document.getElementById('apNext').onclick=()=>{state.officialPage=(state.officialPage||1)+1;save();render()};document.getElementById('apResetProgress').onclick=()=>{if(confirm('Zerar progresso do banco oficial?')){state.done={};state.doubts={};save();render();}}}
  function bindOfficialButtons(){document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const id=b.dataset.done; state.done[id]?delete state.done[id]:state.done[id]=Date.now(); save(); render();});document.querySelectorAll('[data-doubt]').forEach(b=>b.onclick=()=>{const id=b.dataset.doubt; state.doubts[id]?delete state.doubts[id]:state.doubts[id]=Date.now(); save(); render();});}
  function renderTraining(el){const q=training[state.trainingIndex%training.length]; const chosen=state.answers[q.id]; el.innerHTML=`<div class="ap-grid"><div class="ap-card ap-span-8"><div class="ap-row" style="justify-content:space-between;align-items:center"><div><span class="ap-pill">${q.area}</span> <span class="ap-pill warn">${q.tema}</span> <span class="ap-pill">${q.dif}</span></div><button class="ap-small-btn" id="apNextTrain">Próxima questão</button></div><div class="ap-sep"></div><div class="ap-question">${esc(q.q)}</div><div class="ap-options">${q.opts.map(o=>{let cls='ap-opt'; if(chosen){ if(o===q.ans) cls+=' correct'; else if(o===chosen) cls+=' wrong'; } return `<div class="${cls}" data-answer="${esc(o)}"><span class="ap-letter">${String.fromCharCode(65+q.opts.indexOf(o))}</span><span>${esc(o)}</span></div>`}).join('')}</div>${chosen?`<div class="ap-card" style="margin-top:12px"><h3>${chosen===q.ans?'✅ Correto':'❌ Revise este ponto'}</h3><p>${esc(q.why)}</p></div>`:''}</div><div class="ap-card ap-span-4"><h3>Treino autoral complementar</h3><p>As questões deste bloco são autorais para praticar raciocínio. O banco oficial fica na aba INEP, com consulta aos PDFs.</p><div class="ap-sep"></div><div class="ap-kpi ap-violet">${training.length}</div><p>questões de treino com correção automática.</p></div></div>`; document.querySelectorAll('[data-answer]').forEach(o=>o.onclick=()=>{state.answers[q.id]=o.dataset.answer; save(); render();}); document.getElementById('apNextTrain').onclick=()=>{state.trainingIndex=(state.trainingIndex+1)%training.length; save(); render();};}
  function renderEssay(el){el.innerHTML=`<div class="ap-grid"><div class="ap-card ap-span-5"><h3>Temas de redação</h3><div class="ap-list">${themes.map((t,i)=>`<button class="ap-mini" data-theme-title="${esc(t)}">${i+1}. ${esc(t)}</button>`).join('')}</div><div class="ap-sep"></div><h3>Checklist ENEM</h3>${['Tese clara na introdução','Dois argumentos desenvolvidos','Repertório sociocultural produtivo','Conectivos entre períodos e parágrafos','Proposta com agente, ação, meio, finalidade e detalhamento','Respeito aos direitos humanos'].map((c,i)=>`<label class="ap-check"><input type="checkbox" data-check="${i}"> ${c}</label>`).join('')}</div><div class="ap-card ap-span-7"><h3>Rascunho salvo automaticamente</h3><textarea id="apEssay" class="ap-textarea" placeholder="Digite ou cole sua redação aqui...">${esc(state.essay)}</textarea><div class="ap-row" style="margin-top:10px"><button class="ap-small-btn green" id="apCopyEssay">Copiar redação</button><button class="ap-small-btn red" id="apClearEssay">Limpar</button></div><p class="ap-note">Modelo sugerido: introdução com tese + desenvolvimento 1 + desenvolvimento 2 + conclusão com intervenção completa.</p></div></div>`; document.querySelectorAll('[data-theme-title]').forEach(b=>b.onclick=()=>{state.essay = `Tema: ${b.dataset.themeTitle}\n\nIntrodução:\n\nDesenvolvimento 1:\n\nDesenvolvimento 2:\n\nConclusão / proposta de intervenção:\n`; save(); render();}); document.getElementById('apEssay').oninput=e=>{state.essay=e.target.value; save();}; document.getElementById('apCopyEssay').onclick=()=>navigator.clipboard?.writeText(state.essay).then(()=>toast('Redação copiada.')); document.getElementById('apClearEssay').onclick=()=>{if(confirm('Limpar rascunho?')){state.essay='';save();render();}}}
  function renderPlan(el){el.innerHTML=`<div class="ap-grid"><div class="ap-card ap-span-7"><h3>Plano semanal sugerido</h3><div class="ap-list">${schedule.map((s,i)=>`<div class="ap-ref"><div class="ap-qn">${i+1}</div><div><div class="ap-ref-title">${s[0]}</div><div class="ap-ref-meta">${s[1]}</div></div><button class="ap-mini good" data-plan="${i}">Concluir</button></div>`).join('')}</div></div><div class="ap-card ap-span-5"><h3>Método de evolução</h3><p>1. Faça questões oficiais por área.<br>2. Marque dúvidas no banco INEP.<br>3. Resolva treino autoral para fixar.<br>4. Escreva uma redação por semana.<br>5. Revise o caderno de erros em 48h.</p><div class="ap-sep"></div><span class="ap-pill good">70% erros</span> <span class="ap-pill">20% revisão</span> <span class="ap-pill warn">10% redação</span></div></div>`; document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>toast('Etapa marcada mentalmente. Use as anotações para registrar detalhes.'));}
  function renderNotes(el){el.innerHTML=`<div class="ap-card"><h3>Caderno de erros e anotações</h3><p>Use este espaço para registrar questões difíceis, temas de redação, fórmulas e dúvidas.</p><textarea id="apNotes" class="ap-textarea" style="min-height:360px" placeholder="Ex.: ENEM 2023, questão 98 — revisar ecologia...">${esc(state.notes)}</textarea><div class="ap-row" style="margin-top:10px"><button class="ap-small-btn green" id="apCopyNotes">Copiar anotações</button><button class="ap-small-btn red" id="apClearNotes">Limpar</button></div></div>`; document.getElementById('apNotes').oninput=e=>{state.notes=e.target.value;save();}; document.getElementById('apCopyNotes').onclick=()=>navigator.clipboard?.writeText(state.notes).then(()=>toast('Anotações copiadas.')); document.getElementById('apClearNotes').onclick=()=>{if(confirm('Limpar anotações?')){state.notes='';save();render();}}}
  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  window.addEventListener('load',()=>{setTimeout(ensureUI,700);});
  window.addEventListener('keydown',e=>{if(e.altKey && e.key.toLowerCase()==='e') open(); if(e.key==='Escape') close();});
})();
</script>

</body>
